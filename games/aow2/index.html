let gnd=x.createLinearGradient(0,H*.42,0,H);gnd.addColorStop(0,'#63824a');gnd.addColorStop(1,'#3d5330');x.fillStyle=gnd;x.fillRect(0,H*.46,W,H*.54);let sun=x.createRadialGradient(W*.78,H*.16,4,W*.78,H*.16,H*.18);sun.addColorStop(0,'#fff3b8cc');sun.addColorStop(1,'#fff0');x.fillStyle=sun;x.fillRect(0,0,W,H*.55);x.fillStyle='#425863';x.beginPath();x.moveTo(0,H*.47);for(let i=0;i<=12;i++){let px=i*W/12,py=H*(.29+.13*Math.sin(i*2.1)+.06*Math.sin(i*.73));x.lineTo(px,py)}x.lineTo(W,H*.58);x.lineTo(0,H*.58);x.fill();x.fillStyle='#61745d';x.beginPath();x.moveTo(0,H*.52);for(let i=0;i<=18;i++)x.lineTo(i*W/18,H*(.43+.035*Math.sin(i*1.8)));x.lineTo(W,H*.62);x.lineTo(0,H*.62);x.fill();for(let i=0;i<34;i++){let px=(i*97%W),py=H*(.43+(i%4)*.012),r=8+(i%5)*3;x.fillStyle=i%3?'#263d32':'#334a37';x.beginPath();x.moveTo(px-r,py+r);x.lineTo(px,py-r*2);x.lineTo(px+r,py+r);x.fill()}let corners=[[-45,0,-120],[WORLD+45,0,-120],[WORLD+45,0,120],[-45,0,120]].map(v=>proj(...v));let grd=x.createLinearGradient(0,H*.35,0,H);grd.addColorStop(0,'#70814d');grd.addColorStop(1,'#3f5632');x.fillStyle=grd;x.beginPath();corners.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fill();poly3([[0,.03,-12],[WORLD,.03,-12],[WORLD,.03,12],[0,.03,12]],'#91764b','#796039');poly3([[0,.05,-7],[WORLD,.05,-7],[WORLD,.05,7],[0,.05,7]],'#aa8b58','#8b7049');for(let i=5;i<WORLD;i+=10){line3([i,.07,-6],[i,.07,6],.05,'#c8aa72aa');for(let z of[-41,-31,31,41]){let h=.35+((i+z)%4)*.12;line3([i,.05,z],[i-1,h,z-.5],.07,'#89a555');line3([i,.05,z],[i+1,h,z+.5],.07,'#526f39')}}for(let X=20;X<WORLD;X+=18)for(let Z of[-47,47])ball(X,.35,Z,.45+(X%3)*.15,'#6d6658','#4b4439');
// receding perspective depth lines across the open field
for(let z=-100;z<=100;z+=15)line3([-30,.04,z],[WORLD+30,.04,z],.04,'rgba(255,255,255,.05)');
// atmosphere: depth haze toward the horizon
let hz=x.createLinearGradient(0,H*.40,0,H*.66);hz.addColorStop(0,'rgba(214,224,210,0)');hz.addColorStop(.5,'rgba(210,222,205,.42)');hz.addColorStop(1,'rgba(210,222,205,0)');x.fillStyle=hz;x.fillRect(0,H*.40,W,H*.26)}
function castleWizard(w,i){let X=(w.x!=null?w.x:PLAYER_FORT),Z=(w.z!=null?w.z:-9+i*4.5),Y=(w.y!=null?w.y:15),glow=.65+.25*Math.sin(t*4+i);poly3([[X-1,Y,Z-1],[X+1,Y,Z-1],[X+.65,Y+5,Z],[X-.65,Y+5,Z]],'#354fbd','#18295f');ball(X,Y+6,Z,1,'#111417','#d9b36d');poly3([[X-1.5,Y+6.7,Z],[X+1.5,Y+6.7,Z],[X,Y+9.2,Z]],'#354fbd','#18295f');line3([X+1,Y,Z+1],[X+1,Y+8,Z+1],.18,'#6b4526');ball(X+1,Y+8.5,Z+1,.42+glow*.15,'#73edff','#d9ffff')}
function drawArrow(s){if(s.kind==='boulder'){ball(s.x,s.y,s.z,1.7,'#7a7f85','#3a3d42');return}if(s.kind==='magic'){line3([s.x-1,s.y,s.z],[s.x+1,s.y,s.z],.32,'#78efff');ball(s.x,s.y,s.z,.55,'#78efff','#d9ffff');return}let dx=s.tx-s.x,dz=s.tz-s.z,d=Math.hypot(dx,dz)||1,nx=dx/d,nz=dz/d,L=s.kind==='spear'?3.6:1.7,tail=[s.x-nx*L,s.y,s.z-nz*L],tip=[s.x+nx*(s.kind==='spear'?2.2:1.2),s.y,s.z+nz*(s.kind==='spear'?2.2:1.2)];line3(tail,tip,s.kind==='spear'?.15:.09,'#6b4526');if(s.kind!=='spear')line3(tail,[tail[0]-nx*.45,tail[1]+.3,tail[2]-nz*.45],.07,'#e7dfc6');poly3([[tip[0]+nx*.55,tip[1],tip[2]+nz*.55],[tip[0]-nz*.22,tip[1]-.25,tip[2]+nx*.22],[tip[0]+nz*.22,tip[1]+.25,tip[2]-nx*.22]],'#dce2e6','#70777c')}
// Folklore-siege giant — a hulking brute (~3x a soldier) that leads milestone assaults.
function giant(u){
  let E=ERA[u.era]||ERA.rome,dir=u.face||u.team||-1,walk=Math.sin(u.phase),
      moving=Math.hypot(u.vx||0,u.vz||0)>.1,bob=moving?Math.abs(Math.sin(u.phase))*.6:Math.sin(t*1.4+u.id)*.15,Y=bob;
  let p=proj(u.x,.05,u.z);x.fillStyle='#0006';x.beginPath();x.ellipse(p.x,p.y,7*p.s,2.4*p.s,0,0,7);x.fill();
  for(let s of[-1,1]){let k=1.7*walk*s;line3([u.x,Y+9,u.z+s*2.2],[u.x+dir*k,Y+.5,u.z+s*2.6],1.7,'#332a22');ball(u.x+dir*k,Y+.6,u.z+s*2.6,1.6,shade(E.metal,-30));}
  box3(u.x,Y+9,u.z,7,11,9,shade(E.main,-8));
  poly3([[u.x-dir*2,Y+9,u.z-4.6],[u.x+dir*3.6,Y+9,u.z-4.6],[u.x+dir*4,Y+20,u.z-3.6],[u.x-dir*2.6,Y+20,u.z-3.6]],E.metal,'#120d0a');
  for(let s of[-1,1]){let a=-1.1*walk*s;line3([u.x,Y+19,u.z+s*4.6],[u.x+dir*(a+2),Y+13,u.z+s*5.2],1.4,'#332a22');}
  let atk=u.state==='attack'?Math.sin(Math.min(1,u.cd)*Math.PI):0;
  line3([u.x+dir*3,Y+16,u.z-5.5],[u.x+dir*(7.5+atk*3),Y+(9-atk*6),u.z-5.5],1.7,'#5a3f22');
  ball(u.x+dir*(7.5+atk*3),Y+(9-atk*6),u.z-5.5,3.1,shade(E.metal,-12));
  ball(u.x,Y+23,u.z,3.3,'#2a2018');
  for(let s of[-1,1])line3([u.x,Y+25,u.z+s*1.7],[u.x-dir*1.6,Y+29,u.z+s*3.2],.55,'#e8e0d0');
  let hb=proj(u.x,Y+33,u.z);x.fillStyle='#160d0d';x.fillRect(hb.x-26,hb.y,52,5);x.fillStyle='#e0452f';x.fillRect(hb.x-26,hb.y,52*Math.max(0,u.hp/u.max),5);
  if(u.folkName){x.fillStyle='#ffd98a';x.font='700 12px Georgia';x.textAlign='center';x.fillText(u.folkName,hb.x,hb.y-5);x.textAlign='left';}
}
function draw(){terrain();let things=[{d:proj(PLAYER_FORT,0,0).d,f:()=>fort(PLAYER_FORT,1)},{d:proj(ENEMY_FORT,0,0).d,f:()=>fort(ENEMY_FORT,-1)},...wizards.map((w,i)=>({d:proj(w.x!=null?w.x:PLAYER_FORT,w.y!=null?w.y:15,w.z!=null?w.z:-9+i*4.5).d,f:()=>castleWizard(w,i)})),...units.map(u=>({d:proj(u.x,0,u.z).d,f:()=>u.boss?giant(u):soldier(u)}))].sort((a,b)=>a.d-b.d);things.forEach(o=>o.f());for(let s of shots)drawArrow(s);for(let f of fx){let p=proj(f.x,2,f.z);x.strokeStyle=`rgba(255,160,30,${f.life})`;x.lineWidth=8*(1-f.life)+2;x.beginPath();x.arc(p.x,p.y,25*(1-f.life),0,7);x.stroke()}}
function loop(now){let dt=Math.min(.04,(now-last)/1000)*speed;last=now;update(dt);draw();requestAnimationFrame(loop)}
function show(s){let b=document.getElementById('banner');b.textContent=s;bannerT=2;b.classList.add('show')}
function setCommand(cmd){let now=performance.now();for(let u of units)if(u.team===1)u.charge=false;if(cmd==='defend'){if(now-lastDefendTap<350){stance='defend';playerRally=30;marchDir=1;show('RETREAT TO FORT')}else{stance='defend';let front=units.filter(u=>u.team===1&&!u.fortDef&&u.hp>0).reduce((m,u)=>Math.max(m,u.x),28);playerRally=Math.max(30,Math.min(158,front));show('HOLD FORMATION')}lastDefendTap=now}else if(cmd==='march'){if(stance==='march'&&now-lastMarchTap<350){marchDir*=-1;show(marchDir>0?'MARCH FORWARD':'REVERSE MARCH')}else{stance='march';show(marchDir>0?'MARCH FORWARD':'MARCH HOME')}lastMarchTap=now}else{stance='attack';for(let u of units)if(u.team===1){u.slotX=null;u.slotZ=null}show('FULL ATTACK')}document.querySelectorAll('[data-cmd]').forEach(q=>q.classList.toggle('active',q.dataset.cmd===stance))}
document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{let r=b.dataset.unit,c=COST[r];if(gold<c||units.filter(u=>u.team===1).length>=50)return;gold-=c;let n=units.filter(u=>u.team===1&&!u.fortDef).length;add(r,1,(n%10-4.5)*4,{x:PLAYER_FORT+8+Math.floor(n/10)*1.2})});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>setCommand(b.dataset.cmd));document.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>{let k=b.dataset.charge,n=0;for(let u of units){if(u.team!==1||u.hp<=0||u.fortDef)continue;if(u.role===k){u.charge=true;n++;}}show(n?'⚔ '+n+' charging — rest hold the line!':'No units of that type')});document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>location.href='castle-builder.html');
document.querySelectorAll('[data-action="spear"]').forEach(b=>b.onclick=()=>{if(spearCd>0){show('Spears reloading…');return}let n=0;for(let u of units){if(u.team!==1||u.hp<=0||u.fortDef||u.role!=='defender')continue;let q=spearThrowTarget(u,28);if(q){shots.push({kind:'spear',x:u.x,y:8,z:u.z,tx:q.x,tz:q.z,ty:5,target:q.id,team:1,d:24,life:1,impale:true});u.state='attack';u.cd=1;n++}}spearCd=n?5:0;show(n?'🔱 SPEAR VOLLEY!':'No spearmen to throw')});
document.getElementById('zin').onclick=()=>{zoom=Math.min(2.4,+(zoom+0.3).toFixed(2))};
document.getElementById('zout').onclick=()=>{zoom=Math.max(1,+(zoom-0.3).toFixed(2))};
document.getElementById('rl').onclick=()=>{camA-=0.35};document.getElementById('rr').onclick=()=>{camA+=0.35};document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{let k=b.dataset.system;if(k==='garrison'&&gold>=150&&garrison<12){gold-=150;for(let i=0;i<2;i++){let slot=garrison+i;add('ranged',1,-17+slot*3.1,{x:PLAYER_FORT,fortDef:true,platformY:15})}garrison+=2;show('WALL ARCHERS '+garrison+'/12')}else if(k==='wizard'&&gold>=250&&wizards.length<5){gold-=250;wizards.push({id:wizards.length+1,cd:0,attackCd:0});show('WIZARD SUMMONS 10 SPEARMEN')}else if(k==='fortify'&&gold>=300&&fortLevel<5){gold-=300;fortLevel++;fortMax+=500;fortHP=Math.min(fortMax,fortHP+500);add('defender',1,(fortLevel-3)*6,{x:PLAYER_FORT,fortDef:true,platformY:15});show('FORTRESS TIER '+fortLevel)}else if(k==='evolve'&&gold>=600){gold-=600;era=ERA_ORDER[(ERA_ORDER.indexOf(era)+1)%ERA_ORDER.length];document.getElementById('era').value=era;for(let u of units)if(u.team===1)u.era=era;fortLevel=Math.min(5,fortLevel+1);fortMax+=350;fortHP=fortMax;show(ERA[era].name.toUpperCase())}else if(k==='power'&&powerCd<=0){let foes=units.filter(u=>u.team===-1);for(let u of foes)hit(u,28+ERA_ORDER.indexOf(era)*12);for(let i=0;i<9;i++)fx.push({x:30+Math.random()*60,z:(Math.random()-.5)*70,life:1,type:'burst'});powerCd=18;show('ERA POWER')}});document.getElementById('speed').onclick=e=>{speed=speed%3+1;e.target.textContent=speed+'× SPEED'};document.getElementById('era').onchange=e=>{era=e.target.value;for(let u of units)if(u.team===1)u.era=era};
// Spawn the player's garrison from the Castle Builder slots (wizard / range / defense).
function applyCastle(){if(!CASTLE||!CASTLE.length)return;castleFront=PLAYER_FORT+8;for(const b of CASTLE){const w=ccWorld(b),px=w[0],py=w[1],pz=w[2];
  if(b.t<6)castleFront=Math.max(castleFront,px+CB/2);   // front wall line for collision
  if(b.t===6){if(wizards.length<6)wizards.push({id:wizards.length+1,cd:0,attackCd:0,x:px,z:pz,y:py});}
  else if(b.t===7){add('ranged',1,pz,{x:px,fortDef:true,platformY:py});}
  else if(b.t===8){defenses.push({x:px,z:pz,y:py});}
}}
applyCastle();
// Camera like the builder: DRAG to orbit, wheel to zoom. A TAP fires the castle defenses.
// One finger = orbit + tap-fire. Two fingers = pinch zoom. Mouse wheel = zoom.
let gdrag=null,ptrs=new Map(),pinch0=0,zoom0=1;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){gdrag={x:e.clientX,sx:e.clientX,sy:e.clientY,moved:false,id:e.pointerId};}
  else{gdrag=null;const p=[...ptrs.values()];pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoom0=zoom;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){const p=[...ptrs.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch0>0)zoom=Math.max(1,Math.min(2.6,zoom0*d/pinch0));return;}
  if(!gdrag)return;if(Math.abs(e.clientX-gdrag.sx)+Math.abs(e.clientY-gdrag.sy)>8)gdrag.moved=true;camA+=(e.clientX-gdrag.x)*0.006;gdrag.x=e.clientX;});
function endPtr(e){
  if(gdrag&&gdrag.id===e.pointerId&&!gdrag.moved&&ptrs.size===1&&castleCd<=0){
    let r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,best=null,bd=1e9;
    for(let u of units){if(u.team!==-1||u.hp<=0)continue;let p=proj(u.x,4,u.z),d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=u;}}
    if(best&&bd<=175){let fired=0;
      for(let dw of defenses){shots.push({kind:'boulder',x:dw.x,y:(dw.y||18)+6,z:dw.z,tx:best.x,tz:best.z,ty:5,d:40+fortLevel*12,team:1,life:1,aoe:12});fired++;}
      for(let u of units){if(u.team===1&&u.fortDef&&u.role==='ranged'&&u.hp>0){shots.push({kind:'arrow',x:u.x,y:(u.platformY||0)+8,z:u.z,tx:best.x,tz:best.z,ty:5,target:best.id,team:1,d:16,life:1});fired++;}}
      if(!fired)shots.push({kind:'boulder',x:PLAYER_FORT+2,y:24,z:0,tx:best.x,tz:best.z,ty:5,d:32+fortLevel*10,team:1,life:1,aoe:10});
      castleCd=Math.max(.5,2.6-fortLevel*.42);
    }
  }
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(ptrs.size===0)gdrag=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{zoom=Math.max(1,Math.min(2.6,zoom-e.deltaY*0.0012));e.preventDefault();},{passive:false});
for(let i=0;i<20;i++)add(i%7===0?'ranged':i%5===0?'defender':'assault',-1,(i%10-4.5)*4,{x:ENEMY_FORT-8-Math.floor(i/10)*1.2});requestAnimationFrame(loop);
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
