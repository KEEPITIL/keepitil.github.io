<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Kingdom Wars has moved</title>
<meta http-equiv="refresh" content="0;url=/games/ageofwars/">
<script>
// Unregister the old-scope service worker so returning players don't stay
// pinned to the retired /games/kingdom-wars/ cache, then move on.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).finally(()=>location.replace('/games/ageofwars/'));}
else location.replace('/games/ageofwars/');
</script></head>
<body style="background:#22303c;color:#eef3f7;font-family:sans-serif;text-align:center;padding-top:20vh">
Kingdom Wars moved to <a style="color:#e8c15a" href="/games/ageofwars/">keepitil.com/games/ageofwars</a>
</body></html>
