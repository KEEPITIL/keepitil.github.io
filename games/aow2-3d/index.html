<script>
/* TEST AFFORDANCE ONLY (?pump=1). Some embedded preview/QA panes throttle
   requestAnimationFrame to zero, which freezes the game clock and makes the
   build look broken when it is fine. This drives queued rAF callbacks from a
   timer instead. Inert during normal play — no flag, no effect. */
if (/[?&]pump=1/.test(location.search)) (function () {
  var q = [];
  window.requestAnimationFrame = function (cb) { q.push(cb); return q.length; };
  window.cancelAnimationFrame = function () {};
  var vt = performance.now();
  // Drain one simulated frame. Exposed so an automated harness can advance the
  // clock synchronously when even timers are throttled.
  window.__pumpFrame = function (ms) {
    vt += (ms || 16.7);
    var batch = q; q = [];
    for (var i = 0; i < batch.length; i++) { try { batch[i](vt); } catch (e) {} }
    return batch.length;
  };
  window.__pumpFrames = function (n, ms) {
    var c = 0; for (var i = 0; i < (n || 60); i++) c += window.__pumpFrame(ms); return c;
  };
  setInterval(function () { window.__pumpFrame(16.7); }, 16);
})();
</script>
