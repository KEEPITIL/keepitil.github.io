<link rel="canonical" href="https://keepitil.com/app/tuitea/app/">
<!--
  LEGACY ENTRY POINT.
  ==========================================================================
  This path used to hold a hand-written demonstration shell. It now holds the
  real, compiled TUITEA at /app/tuitea/app/ instead.

  It survives as a redirect rather than being deleted because an already
  installed home-screen icon may have this URL in its history, and the service
  worker of a previous install has it precached. A 404 there would look like
  the app had broken. The redirect is meta + script + link so it works with or
  without JavaScript.
-->
<meta http-equiv="refresh" content="0; url=./app/">
<script>location.replace('./app/' + location.search + location.hash);</script>
<style>body{margin:0;background:#FBF7EF;color:#20261F;
  font:17px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;padding:2rem}
  @media (prefers-color-scheme:dark){body{background:#14170F;color:#ECE7DA}}
  a{color:#3F7658}</style>
</head>
<body><p>Opening TUITEA… <a href="./app/">Continue</a></p></body>
</html>
