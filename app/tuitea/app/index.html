<!-- The manifest deliberately lives one level up, and this page is inside its
     scope (/app/tuitea/) rather than being its start_url's neighbour. The
     manifest's id stays /app/tuitea/ forever — that is the installed identity
     the owner's existing home-screen icon is matched against — while start_url
     now points here, at /app/tuitea/app/, so the icon opens the real app
     instead of the page that explains how to install it. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">

<style>
  html,body{height:100%}
  body{margin:0;background:#FBF7EF;color:#20261F;
       font:17px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
       overscroll-behavior:none}
  @media (prefers-color-scheme: dark){body{background:#14170F;color:#ECE7DA}}
  /* The splash is removed by the engine-ready callback below. It exists because
     a 5 MB dart2js bundle plus CanvasKit is several seconds on a cold cellular
     launch, and an unstyled white page for that long reads as a broken app. */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:1rem;z-index:5}
  #boot img{width:72px;height:72px;border-radius:18px}
  #boot p{margin:0;font-size:.9rem;letter-spacing:.14em;opacity:.65}
  #boot .bar{width:140px;height:3px;border-radius:2px;background:rgba(127,127,127,.25);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;background:#3F7658;
               animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #boot.gone{opacity:0;pointer-events:none;transition:opacity .35s ease}
</style>

     keepitil.com's SITE-WIDE /sw.js (scope "/") took control of the app bundle
     instead - caching main.dart.js under a version key TUITEA does not
     control and cannot invalidate. Registering at the narrower /app/tuitea/
     scope wins over "/" and puts the app back under the one CACHE_VERSION
     that a TUITEA deploy bumps. -->
<script src="../pwa.js"></script>

<script>

     ONE SERVICE WORKER, AND IT IS NOT THIS ONE.
     ----------------------------------------------------------------------
     `_flutter.loader.load()` is called WITHOUT `serviceWorkerSettings`, so
     flutter_service_worker.js is never registered and is not deployed at all.

     Two service workers whose scopes nest (/app/tuitea/ and
     /app/tuitea/app/) is not a merge — the inner one wins outright for every
     request under it. That would have silently taken the app bundle out of
     the shell's single-CACHE_VERSION update path, which is the one mechanism
     that guarantees the owner is never stranded on a stale build. Flutter's
     worker is also deprecated upstream and, as generated by 3.44, does
     nothing but unregister itself.

     So: /app/tuitea/sw.js is the only worker. It precaches this document and
     the Flutter boot files, serves documents network-first, and empties its
     cache wholesale whenever CACHE_VERSION changes.
     ====================================================================== */

  /* Which compiled TUITEA to run.
     `--dart-define` is resolved by dart2js at compile time, so a build-time
     switch normally means a rebuild-and-reinstall. Compiling both variants
     and choosing the entrypoint here turns it back into a server-side flag:
     flags.json decides, on every single launch, which real binary boots.
     A viewer downloads exactly one of them. */

    off: 'main.dart.js',        // RELEASE_CHANNEL=base    -> release id ...".base"
    on:  'main.stamped.dart.js' // RELEASE_CHANNEL=stamped -> release id ...".stamped"
  };

     so it reported "unstamped" — which made the flag observable, but at the
     price of a production build that could not say what it was. Every row it
     ever filed is unattributable. Both variants now carry the full release
     identity and differ in the last segment, so the flag is still visible in
     one glance and neither build is anonymous. */

    try {
      var q = new URLSearchParams(location.search).get('cohort');
      if (q && /^[a-z]{1,16}$/.test(q)) localStorage.setItem('tuitea.cohort', q);
      return localStorage.getItem('tuitea.cohort') || 'public';
    } catch (e) { return 'public'; }

    return !!(doc.flags || {})[name];

    /* The SECOND third party the engine talks to, and the one that was
       still live: fonts.gstatic.com.

       only what has been registered with it, and it fills the two gaps it
       always has by fetching over the network:

           non-existent on the web), so CanvasKit falls through to its
           built-in default and downloads Roboto. Every character of
           TUITEA on the web is drawn with a file from Google.

           the onboarding seedling and goal chips, habit rows, the pet and
           health screens. No registered font covers them, so the engine
           downloads the shard that does. When that download does not
           happen the glyph is a tofu box, which is exactly what was being
           seen on onboarding.

       font path the engine resolves for itself, so pointing it at a
       directory we deploy moves both fetches onto our own origin — inside
       the service worker's scope, so they are cached with the rest of the
       shell and a second launch is offline-clean.

        'text-align:center;padding:0 1.5rem">TUITEA could not start on this ' +
