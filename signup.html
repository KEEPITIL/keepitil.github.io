<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no.0"/>
<title>Sign Up — KEEPITIL</title>
<meta name="description" content="Create your KEEPITIL account — OC & LA underground EDM."/>
<link rel="canonical" href="https://keepitil.com/signup.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/assets/js/vendor/supabase-js.min.js"></script>
<style>
:root{--black:#0b0b0f;--dark:#111118;--dark2:#18181f;--dark3:#22222c;--blue:#00b4ff;--white:#f0f0f0;--grey:#888;--font-head:'Bebas Neue',sans-serif;--font-body:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;padding-bottom:72px;}
/* A flex-column body makes every child a flex item, and a flex item defaults to
   min-width:auto — it will not shrink below its own max-content width. Measured at
   375px: .wrap computed to 1120px while body{overflow-x:hidden} clipped the excess,
   hiding the overflow instead of fixing it. Releasing min-width is what lets the
   locked-footer flex body and a nowrap rail coexist. */
body>*{min-width:0}

a{color:var(--blue);text-decoration:none;}
nav#main-nav{position:sticky;top:0;z-index:200;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);padding:0 24px;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;padding:0 32px;height:66px;}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-logo img{height:44px;width:auto;filter:drop-shadow(0 0 6px #00b4ff);mix-blend-mode:screen;}
.nav-brand{font-family:var(--font-head);font-size:1.5rem;letter-spacing:.13em;color:#fff;}
.nav-links{display:flex;list-style:none;flex:1;justify-content:space-evenly;margin:0;padding:0;}
.nav-links li{list-style:none;}
.nav-links a{font-family:var(--font-head);font-size:1.05rem;letter-spacing:.14em;color:rgba(255,255,255,.75);transition:color .2s;}
.nav-links a:hover{color:#fff;}
.nav-inner>a.nav-cta{font-family:var(--font-head);font-size:1rem;letter-spacing:.14em;color:#00b4ff!important;border:2px solid #00b4ff;padding:7px 22px;border-radius:4px;flex-shrink:0;transition:.2s;}
.nav-inner>a.nav-cta:hover{background:#00b4ff!important;color:#000!important;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;margin-left:auto;}
.nav-hamburger span{display:block;width:24px;height:2px;background:#fff;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:66px;left:0;right:0;background:rgba(10,10,18,.98);z-index:199;flex-direction:column;padding:14px 26px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:var(--font-head);font-size:1.3rem;letter-spacing:.12em;color:rgba(255,255,255,.8);padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.mobile-menu a:last-child{border-bottom:none;color:#00b4ff!important;}
@media(max-width:820px){.nav-links{display:none;}.nav-inner>a.nav-cta{display:none;}.nav-hamburger{display:flex;}}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 18px;}
.card{width:100%;max-width:380px;background:var(--dark);border:1px solid var(--dark3);border-radius:16px;padding:38px 30px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.logo{font-family:var(--font-head);letter-spacing:.14em;font-size:2.5rem;color:var(--white);margin-bottom:4px;}
.sub{color:var(--grey);font-size:.85rem;margin-bottom:24px;}
.card input{width:100%;background:var(--dark2);border:1px solid var(--dark3);border-radius:9px;color:var(--white);font-size:.95rem;padding:13px 14px;margin-bottom:11px;outline:none;}
.card input:focus{border-color:var(--blue);}
.btn{width:100%;background:var(--blue);color:#06121a;border:none;border-radius:9px;font-family:var(--font-head);letter-spacing:.08em;font-size:1.2rem;padding:13px;cursor:pointer;margin-top:5px;transition:opacity .2s;}
.btn:disabled{opacity:.6;cursor:default;}
.msg{font-size:.82rem;margin:12px 0 0;min-height:1em;line-height:1.45;}
.msg.err{color:#ff5c5c;}.msg.ok{color:var(--blue);}
.hint{font-size:.72rem;color:var(--grey);margin:2px 2px 10px;text-align:left;}
.divider{display:flex;align-items:center;gap:12px;color:var(--grey);font-size:.72rem;letter-spacing:.1em;margin:22px 0 18px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--dark3);}
.row{font-size:.86rem;color:var(--grey);}
footer{text-align:center;padding:22px;border-top:1px solid var(--dark3);color:var(--grey);font-size:.75rem;}
footer a{margin:0 5px;}
</style>
</head>
<body>
<nav id="main-nav"><div class="nav-inner">
  <a class="nav-logo" href="/"><img src="/keepitil-x-blue.png" alt="KEEPITIL"/><span class="nav-brand">KEEPITIL</span></a>
  <ul class="nav-links"><li><a href="/culture">CULTURE</a></li><li><a href="/connect">CONNECT</a></li></ul>
  <a href="/apply.html" class="nav-cta">LOGIN</a>
  <button class="nav-hamburger" onclick="document.getElementById('mm').classList.toggle('open')" aria-label="Menu"><span></span><span></span><span></span></button>
</div></nav>
<div class="mobile-menu" id="mm"><a href="/culture">CULTURE</a><a href="/connect">CONNECT</a><a href="/apply.html" class="nav-cta">LOGIN</a></div>

<main>
  <div class="card">
    <div class="logo">KEEPITIL</div>
    <div class="sub">Create your account</div>
    <input type="email" id="email" placeholder="Email" autocapitalize="none" autocorrect="off" spellcheck="false"/>
    <input type="password" id="pw" placeholder="Password (8+ characters)"/>
    <input type="password" id="pw2" placeholder="Confirm password"/>
    <button class="btn" id="signup-btn">SIGN UP</button>
    <div class="msg" id="msg"></div>
    <div class="divider">OR</div>
    <div class="row">Already have an account? <a href="/apply.html">Log in</a></div>
  </div>
</main>

<footer><a href="/">KEEPITIL</a> <a href="/privacy.html">Privacy</a></footer>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}
var MSG=$('msg');
function say(t,ok){ MSG.textContent=t; MSG.className='msg '+(ok?'ok':'err'); }

if(supa){ supa.auth.getSession().then(function(r){ if(r&&r.data&&r.data.session) location.replace('/u.html'); }).catch(function(){}); }

function signUp(){
  if(!supa){ say('Loading — try again in a moment.'); return; }
  var email=($('email').value||'').trim(), pw=$('pw').value||'', pw2=$('pw2').value||'';
  say('');
  if(!email||email.indexOf('@')<0){ say('Enter a valid email.'); return; }
  if(pw.length<8){ say('Password must be at least 8 characters.'); return; }
  if(pw!==pw2){ say('Passwords do not match.'); return; }
  var b=$('signup-btn'); b.disabled=true; b.textContent='CREATING…';
  supa.auth.signUp({email:email,password:pw}).then(function(r){
    if(r&&r.error){
      var m=r.error.message||'';
      if(/already registered|already exists/i.test(m)) say('That email already has an account — log in instead.');
      else say(m);
      b.disabled=false; b.textContent='SIGN UP';
      return;
    }
    if(r&&r.data&&r.data.session){ location.replace('/create-profile.html'); }
    else { say('Account created! Check your email to confirm, then log in.', true); b.disabled=false; b.textContent='SIGN UP'; }
  }).catch(function(){ say('Could not sign up — try again.'); b.disabled=false; b.textContent='SIGN UP'; });
}
$('signup-btn').addEventListener('click',signUp);
$('pw2').addEventListener('keydown',function(e){ if(e.key==='Enter') signUp(); });
</script>
<script src="/assets/js/keepitil-ai.js?v=20260828c" defer></script>
</body>
</html>
