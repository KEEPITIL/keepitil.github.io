<title>Install TUITEA</title>

<!--
  ============================================================================
  MOVED — /tuiteaapp  ->  /app/tuitea
  The canonical install address is https://keepitil.com/app/tuitea.
  This page exists only so links already sent to people keep working.

  GitHub Pages serves static files and cannot issue a real 301, so this does
  the three things a static page can: a canonical tag for search engines, a
  meta refresh for anyone with JavaScript off, and an immediate replace() for
  everyone else — replace(), not assign(), so the Back button returns to
  wherever the tester came from rather than bouncing them round this hop again.

  Do not add content here. Anything a person should read belongs on the
  canonical page.
  ============================================================================
-->

<link rel="canonical" href="https://keepitil.com/app/tuitea">
<meta http-equiv="refresh" content="0; url=https://keepitil.com/app/tuitea">
<meta name="robots" content="noindex, follow">
<script>window.location.replace("https://keepitil.com/app/tuitea");</script>

<style>
  :root{ --bg:#FBF7EF; --ink:#20261F; --muted:#6E7566; --ocean:#33777D; }

  }
  p{margin:0 0 .6rem;color:var(--muted)}

</style>
</head>
<body>
