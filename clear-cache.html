<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refreshing KEEPITIL…</title>
<style>
  body { background: #111; color: #fff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  p { color: #aaa; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Clearing cache…</h1>
<p>You'll be redirected to the artist page in a moment.</p>
<script>
(async function() {
  // Unregister any existing service workers
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  // Clear all caches
  if ('caches' in window) {
    const names = await caches.keys();
    await Promise.all(names.map(n => caches.delete(n)));
  }
  // Register self-destructing SW just in case
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/sw.js'); } catch(e) {}
  }
  // Redirect to artist page (no-cache)
  setTimeout(() => {
    location.href = '/artist/?nocache=' + Date.now();
  }, 1500);
})();
</script>
<script src="/keepitil-radio.js" defer></script>
</body>
</html>
