<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Reset Password — KEEPITIL</title>
<link rel="icon" type="image/png" href="https://keepitil.com/keepitil-x-blue.png"/>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#f0f0f0;font-family:'Inter',system-ui,sans-serif;padding:20px;}
  .card{width:100%;max-width:400px;background:rgba(16,16,26,.9);border:1px solid rgba(0,180,255,.25);border-radius:16px;padding:30px 26px;text-align:center;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.12em;color:#fff;margin-bottom:6px;}
  .logo b{color:#00b4ff;}
  h1{font-size:1.15rem;margin:8px 0 4px;}
  p{color:#8a8a99;font-size:.85rem;line-height:1.5;margin:0 0 18px;}
  input{width:100%;padding:12px 14px;margin:0 0 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:9px;color:#fff;font-size:1rem;}
  input:focus{outline:none;border-color:#00b4ff;}
  button{width:100%;padding:13px;background:#00b4ff;color:#001018;border:none;border-radius:9px;font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:filter .15s;}
  button:hover{filter:brightness(1.1);}
  .msg{min-height:20px;font-size:.82rem;margin-top:14px;color:#00ff88;}
  .msg.err{color:#ff6b6b;}
  a{color:#3cf;font-size:.82rem;text-decoration:none;}
  .row{margin-top:16px;}
</style>
<script src="/v3/vendor/supabase-js.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">⚡ KEEP<b>ITIL</b></div>
    <h1 id="ttl">Set a new password</h1>
    <p id="sub">Enter a new password for your account.</p>

    <div id="form-set">
      <input type="password" id="pw" placeholder="New password (8+ characters)" autocomplete="new-password"/>
      <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password"/>
      <button id="save">Save new password</button>
    </div>

    <div id="form-request" style="display:none;">
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email"/>
      <button id="send">Email me a reset link</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="row"><a href="/">← Back to KEEPITIL</a></div>
  </div>

<script>
(function(){
  var URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
  var sb=window.supabase?window.supabase.createClient(URL,KEY):null;
  function $(id){return document.getElementById(id);}
  function setMsg(t,err){var m=$('msg');m.textContent=t||'';m.className='msg'+(err?' err':'');}
  var recovering=false;
  if(sb){
    sb.auth.onAuthStateChange(function(ev){ if(ev==='PASSWORD_RECOVERY'){ recovering=true; } });
  }
  // If arriving without a recovery token, show the "request a link" form instead
  setTimeout(function(){
    var hasToken=(location.hash.indexOf('type=recovery')>-1)||(location.hash.indexOf('access_token')>-1)||recovering;
    if(!hasToken){
      $('ttl').textContent='Forgot your password?';
      $('sub').textContent='Enter your email and we will send a reset link.';
      $('form-set').style.display='none';
      $('form-request').style.display='block';
    }
  }, 400);

  $('save').onclick=function(){
    var pw=$('pw').value||'', pw2=$('pw2').value||'';
    if(pw.length<8){ setMsg('Password must be at least 8 characters.',true); return; }
    if(pw!==pw2){ setMsg('Passwords do not match.',true); return; }
    if(!sb){ setMsg('Reset is being set up — try again shortly.',true); return; }
    setMsg('Saving…');
    sb.auth.updateUser({password:pw}).then(function(r){
      if(r&&r.error){ setMsg(r.error.message||'Could not update password. Your reset link may have expired — request a new one.',true); }
      else{ setMsg('Password updated! Redirecting…'); setTimeout(function(){ location.href='/'; },1200); }
    }).catch(function(){ setMsg('Could not update password.',true); });
  };

  $('send').onclick=function(){
    var email=$('email').value||'';
    if(!email){ setMsg('Enter your email.',true); return; }
    if(!sb){ setMsg('Reset is being set up — try again shortly.',true); return; }
    setMsg('Sending…');
    sb.auth.resetPasswordForEmail(email,{redirectTo:'https://keepitil.com/reset-password.html'}).then(function(r){
      setMsg((r&&r.error)?(r.error.message||'Could not send reset link.'):'Check your email for the reset link.', r&&r.error);
    }).catch(function(){ setMsg('Could not send reset link.',true); });
  };
})();
</script>
<script src="/keepitil-ai.js?v=20260822b" defer></script>
</body>
</html>
