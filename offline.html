<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#0b0b0b"/>
<title>Offline — KEEPITIL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:#f0f0f0;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;text-align:center;background:#12121c;border:1px solid #242433;border-radius:18px;padding:38px 28px}
.x{width:96px;height:96px;border-radius:22px;margin:0 auto 18px;display:block}
h1{font-size:1.35rem;font-weight:800;letter-spacing:.02em;margin-bottom:8px}
p{color:#9aa0b0;font-size:.95rem;line-height:1.5;margin-bottom:20px}
button{background:linear-gradient(90deg,#00b4ff,#22e39b);color:#04121b;border:0;border-radius:11px;padding:12px 22px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <img class="x" src="/icon-192.png" alt="KEEPITIL">
  <h1>You&rsquo;re offline</h1>
  <p>Reconnect to load the latest events, scene drops, and the radio. Your app shell is saved — everything comes back the second you&rsquo;re online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
