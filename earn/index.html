<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#00e0a4;--neon:#00e0a4;--ink:#f4f2fb;--ink2:#aab2c5;--panel:rgba(16,16,24,.72);--brd:rgba(255,255,255,.12);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif}
/* ⚠ THE COLOUR LIVES ON <html> ONLY — body MUST stay transparent (Atlas 2026-08-21).
   This was `html,body{background:#0a0a0f}` and it made the backdrop image invisible even though
   the file loaded and the rule applied. Painting order inside the root stacking context is:
   html's background → negative-z-index children (body::before) → in-flow block backgrounds
   (body). So an opaque background ON BODY paints straight over a `z-index:-2` ::before. When only
   body has a background it is propagated to the canvas instead and body paints no box, which is
   why /connect's backdrop always worked and this one never did. */
html{background:#0a0a0f}
/* overflow-x:clip, NOT hidden (Atlas 2026-08-21). `overflow-x:hidden` on body computes
   overflow-y:auto, which turns BODY into a scroll container. position:sticky then resolves
   against body instead of the viewport, and because the page actually scrolls on the
   viewport the bar never sticks — the filter bars were correctly declared sticky and simply
   could not work. `clip` clips the same overflow WITHOUT creating a scroll container, so
   sticky resolves against the viewport again. `hidden` is kept first as the fallback for
   anything that predates `clip`. */
body{background:transparent;color:var(--ink);font-family:var(--fb);overflow-x:hidden;overflow-x:clip}
/* image-forward backdrop (same model as home): default KEEPITIL image, seasonal image takes over on its dates */
/* EARN backdrop (Founder 2026-08-21). Separate portrait file below 860px — the 16:9 art puts the
   sign centre-left, so `cover` on a phone crops to bare floor. Opacity .5 so the orange does not
   overwhelm the cards sitting on it. */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:#0a0a0f url('/v3/earn-hero.jpg?v=20260821b') center/cover no-repeat;opacity:1}
/* One scrim, not a dimmed image — the art stays full strength and this holds text legible. */
/* Scrim lightened for the 2026-08-21b artwork: these compositions already leave a dark,
   empty centre for the page content and put the neon out at the edges. The heavier
   .35->.72 scrim was flattening exactly the parts meant to be seen. */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(10,10,15,.12),rgba(10,10,15,.55))}
@media(max-width:860px){body::before{background-image:url('/v3/earn-hero-m.jpg?v=20260821b')}}
html.has-season body::before{display:none!important}
body{padding-top:70px;padding-bottom:calc(96px + env(safe-area-inset-bottom))} /* clear fixed shell nav + radio bar */
a{color:inherit;text-decoration:none}
/* width:100% IS LOAD-BEARING — DO NOT DROP IT (KODE 2026-08-20, restored by Atlas 08-21).
   body is a flex column here, so .wrap is a flex ITEM. `margin:0 auto` is a cross-axis auto
   margin, and a cross-axis auto margin cancels align-items:stretch — .wrap then sizes to
   fit-content, which for a flex-wrap:nowrap card rail is wider than the phone. Mobile Safari
   responds by zooming the whole page out to fit. max-width:1120px still caps it on desktop.
   This was lost once already when a push overwrote the file; if it goes missing again the
   symptom is "the page is zoomed out", not a layout error. */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px;width:100%}
/* hero */
/* LEFT, not centred (Founder 2026-08-21): "on the desktop version the connect metric and
   title is on the left side of the screen. should be the same for the other pages."
   Mobile keeps it centred — see the body.rad-m block. */
/* BACKGROUND FIRST, CONTENT SCROLLS UP (Founder 2026-08-21: "every page except culture
   should start like the homepage. background image first, than everything else can scroll up
   into place"). The homepage does this with .hero{min-height:100dvh} — a full-viewport opening
   panel over the fixed backdrop. Same here. svh first so the iOS URL bar collapsing does not
   change the height mid-scroll; dvh is the fallback for anything without svh. */
/* BOTTOM-WEIGHTED LANDING PANEL (Founder 2026-08-21: "titles and metrics needs to be bigger
   and towards the bottom of the landing page and also match the color theme of that page").
   justify-content:flex-end drops the block to the foot of the full-viewport panel, so the
   artwork owns the top two thirds and the type sits over the darkest part of the scrim where
   it is most legible. */
/*   The 130px is /create's value and is now the standard (Founder 2026-08-21: "create is the
   best example on positioning. it sits above the radio so it is readable on the landing page.
   the filter sits right behind the radio bar"). It is the fixed top nav (70) plus the radio bar
   (60): subtracting both keeps the title and metrics clear of the player instead of sitting
   under it, and lets the filter bar settle behind the bar as you scroll. */
.hero{padding:34px 0 46px;text-align:left;max-width:1120px;margin:0 auto;
  min-height:calc(100svh - 130px);min-height:calc(100dvh - 130px);
  display:flex;flex-direction:column;justify-content:flex-end}
/* EARN palette: the neon green and orange of the backdrop art. */
.hero h1{font-family:var(--fh);font-size:clamp(3.6rem,13vw,8rem);letter-spacing:.03em;line-height:.88;
  background:linear-gradient(100deg,#8BFF3D 18%,#FF8A1F);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 26px rgba(0,0,0,.75))}
.hero p{color:#e7e9f2;max-width:640px;margin:12px 0 0;font-size:1.02rem;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.5)}
/* Connect's stat row (Founder 2026-08-21) */
.hero .stats{display:flex;justify-content:flex-start;gap:46px;margin-top:22px;flex-wrap:wrap}
.hero .stat b{font-family:var(--fh);font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:.02em;display:block;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.hero .stat span{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#cfd6c9;margin-top:5px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hero .stat.s b{color:#8BFF3D}.hero .stat.p b{color:#FF8A1F}.hero .stat.g b{color:#8BFF3D}
@media(max-width:600px){.hero .stats{gap:26px}.hero .stat b{font-size:2rem}.hero .stat span{font-size:.68rem}}
.hero .live{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(8px);border-radius:999px;padding:8px 16px;font-size:.8rem;font-weight:700;letter-spacing:.05em}
.hero .live .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
/* ── filter bar, cloned from /connect (Founder 2026-08-21) ────────────────────────────
   Sticky under the 70px shell nav on desktop, under the notch on mobile. This only works
   because body is overflow-x:clip rather than hidden — see the note at the top of the file. */
.controls{position:sticky;top:70px;z-index:100;background:#0b0b12;max-width:none;width:100%;
  margin:6px 0 0;padding:12px 0;border-top:1px solid rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.controls-row{max-width:1120px;margin-left:auto;margin-right:auto;padding:0 16px}
.controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{font-family:var(--fh);font-size:.98rem;letter-spacing:.09em;color:var(--ink2);background:none;border:0;cursor:pointer;padding:8px 16px;border-radius:9px;transition:all .18s}
.seg button:hover{color:#fff}
.seg button.on{background:var(--brand);color:#053a2c}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:12px;padding:10px 16px}
.search input{flex:1;background:none;border:0;color:var(--ink);font-family:var(--fb);font-size:.95rem;outline:none}
.search input::placeholder{color:#6b6588}
.count{font-size:.76rem;color:#6b6588;white-space:nowrap}
@media(max-width:768px){#radCount{display:none!important}}
/* section */
section{padding:30px 0;border-top:1px solid var(--brd)}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-family:var(--fh);font-size:1.9rem;letter-spacing:.04em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.sh .sub{color:#d5d9e6;font-size:.88rem;text-shadow:0 1px 8px rgba(0,0,0,.5)}
/* grids */
/* HOMEPAGE MODEL (Founder 2026-08-20: "needs to be setup like the homepage. Each section a
   2:3 format card and carousel rows."): each section scrolls horizontally as a rail of 2:3
   cards instead of stacking a grid. Same shape as #evx .evx-row on the homepage — 240px on
   desktop, 160px on mobile, x-scroll only, scrollbar hidden. */
.grid{display:flex;gap:15px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;
  padding:4px 0 14px;scroll-snap-type:x proximity}
.grid::-webkit-scrollbar{display:none}
.grid>*{flex:0 0 240px;scroll-snap-align:start}
.grid>.card{aspect-ratio:2/3;display:flex;flex-direction:column;overflow:hidden}
@media(max-width:860px){ .grid{gap:10px} .grid>*{flex:0 0 160px} }
.g-stations>*{flex:0 0 160px}
.g-cards>*{flex:0 0 240px}
/* CREATE rail: ONE row, always (Founder 2026-08-22: "a single carousel row under CREATE").
   The generic .grid is already a nowrap flex rail, but the section-expand toggle could turn
   it back into a wrapping grid; this pins it. */
#earnGrid{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;
  overflow-y:hidden!important;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#earnGrid::-webkit-scrollbar{display:none}
#earnGrid>*{flex:0 0 240px;scroll-snap-align:start}
@media(max-width:860px){#earnGrid>*{flex:0 0 170px}}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:14px;padding:16px;transition:border-color .15s,transform .15s;backdrop-filter:blur(10px);overflow:hidden}
.card:hover{border-color:var(--brand);transform:translateY(-2px)}
/* image band on every widget */
.card-img{height:92px;margin:-16px -16px 12px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
.station{cursor:pointer;display:flex;flex-direction:column}
.station .g{font-family:var(--fh);font-size:1.35rem;letter-spacing:.03em;line-height:1}
.station .s{font-size:.68rem;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.chip{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#06120a;background:var(--brand);padding:3px 8px;border-radius:6px}
.chip.soon{background:rgba(255,255,255,.14);color:var(--ink2)}
.card h3{font-family:var(--fh);font-size:1.25rem;letter-spacing:.02em;margin-bottom:6px}
.card p{color:var(--ink2);font-size:.84rem;line-height:1.5}
.card .meta{margin-top:10px;font-size:.72rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 12px}
.btn{display:inline-block;background:var(--brand);color:#06120a;font-weight:800;letter-spacing:.05em;padding:11px 18px;border-radius:10px;border:0;cursor:pointer;font-size:.82rem}
.btn.ghost{background:transparent;border:1px solid var(--brand);color:var(--brand)}
.disc{font-size:.72rem;color:#cfd4e2;margin-top:8px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.pl-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(10px);border-radius:14px;padding:14px}
.pl-form input{flex:1 1 220px;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--brd);border-radius:9px;color:var(--ink);padding:11px 12px;font-size:.9rem;font-family:inherit}
.pl-list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.pl-item{background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(10px);border-radius:14px;padding:14px}
.pl-item .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pl-item .top b{font-family:var(--fh);font-size:1.2rem;letter-spacing:.02em;flex:1}
.pl-item .rm{background:none;border:0;color:#ff6b6b;font-weight:700;cursor:pointer;font-size:.82rem}
.pl-item iframe{width:100%;height:120px;border:0;border-radius:8px}
/* Sections as single-row carousels that expand into the full grid via a down-arrow (Founder 2026-08-04) */
.sec-toggle{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--brd);background:var(--panel);color:var(--ink);font-size:.95rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .22s,border-color .15s;backdrop-filter:blur(8px)}
.sec-toggle:hover{border-color:var(--brand);color:var(--brand)}
section.open .sec-toggle{transform:rotate(180deg)}
.grid.rad-carou{display:flex;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.grid.rad-carou::-webkit-scrollbar{height:6px}
.grid.rad-carou::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.grid.rad-carou>*{flex:0 0 230px;scroll-snap-align:start}
.grid.g-stations.rad-carou>*{flex:0 0 168px}
/* WAS: section.open reverted the rail back to display:grid, so opening a section turned the
   carousel into a single stacked column — exactly what the Founder reported 2026-08-20. The
   rail is now unconditional; a section opening changes what is visible, not how it is laid out. */
section.open .grid.rad-carou{display:flex;overflow-x:auto}
/* Vertical sidebar (desktop): subpages on top + this page's sections below (Founder 2026-08-04) */
.cul-vrail{display:none}
@media(min-width:861px){
  .cul-vrail{display:flex;flex-direction:column;gap:9px;position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40}
  .cul-vrail{overflow:visible}
  .cul-vrail .cvr{display:flex;align-items:center;gap:13px;width:58px;height:58px;padding:0 15px;overflow:hidden;white-space:nowrap;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(12,20,18,.85);backdrop-filter:blur(12px);color:#cfe6df;cursor:pointer;transition:width .18s ease;box-sizing:border-box}
  .cul-vrail .cvr .ic{font-size:1.55rem;flex:0 0 auto;line-height:1;width:26px;text-align:center}
  .cul-vrail .cvr .tx{font-family:var(--fh);font-weight:800;letter-spacing:.08em;font-size:.9rem;opacity:0;transition:opacity .12s}
  .cul-vrail:hover .cvr{width:180px}
  .cul-vrail .vr-subdd{position:absolute;right:66px;top:0;display:none;flex-direction:column;gap:2px;background:#0d1613;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px;min-width:150px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .cul-vrail .vr-subdd.open{display:flex}
  .cul-vrail .vr-subdd button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#dff0ea;font-size:.95rem;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
  .cul-vrail .vr-subdd button .ic{font-size:1.2rem}
  .cul-vrail .vr-subdd button:hover{background:rgba(255,255,255,.09);color:#fff}
  .cul-vrail:hover .cvr .tx{opacity:1}
  .cul-vrail .vr-div{width:34px;height:1px;background:rgba(255,255,255,.2);align-self:flex-end;margin:4px 6px 4px 0}
  .cul-vrail .cvr.sp.on,.cul-vrail .cvr.sf.on{background:linear-gradient(90deg,#0f6e56,#00e0a4);border-color:transparent;color:#04120a}
}
/* universal locked footer — sits at the bottom before the radio bar */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
footer{margin-top:auto}
</style>
<link rel="canonical" href="https://keepitil.com/earn"/>
  <!-- PWA manifest — STATIC, deliberately (Founder 2026-08-15).

  <link rel="manifest" href="/manifest.webmanifest"/>

</head>

<!-- universal shell: injects the KEEPITIL·CULTURE·SCENE·LOGIN nav + footer + radio rules (same on every page) -->

<!-- ══════════════════════════════════════════════════════════════════════════════════════
     MOBILE RADIO (Founder 2026-08-04, handoff #58) — same reusable pattern as Culture.
     STRICTLY ≤860px; desktop (per-section carousels + accordions) is untouched.
     Locked values, 302x600 frame: navBar 6,6 290x30 · sectionCarousel 6,36 290x28 ·
     mini-player 44px above the 56px bottom nav.
     RENAMES per spec: Stations→Channel, Create/Compete/Earn→VS.
     ══════════════════════════════════════════════════════════════════════════════════════ -->
<style>
@media(max-width:860px){
  /* subpage tabs — Radio active, teal accent */
  /* the shell reserves top-nav space even though it hides the bar ≤860px — reclaim it here only */
  /* Was padding-top:0 — correct for the missing top nav, wrong for the notch. With
     viewport-fit=cover and a black-translucent status bar the page starts UNDER the clock and
     battery, so the EARN title was clipped off the top and the page looked pre-scrolled

<script>
/* MOBILE RADIO enhancer — additive, ≤860px only; returns early above that. */
(function(){
  function isMob(){ try{ return window.matchMedia('(max-width:860px)').matches; }catch(e){ return false; } }
  function sync(){ document.body.classList.toggle('rad-m', isMob()); }
  sync(); window.addEventListener('resize', sync);
  if(!isMob()) return;

  /* section id -> label, using the Founder's renames */
  var SECS = [
    /* Founder 2026-08-18: Schedule / Apps / Games sections removed from this page. */
    ['stations','Channel'], ['playlists','Playlist'], ['earn','VS']
  ].filter(function(s){ return document.getElementById(s[0]); });
  if(!SECS.length) return;
  var idx = 0;

  var main = document.querySelector('main.wrap'); if(!main) return;
  /* Founder 2026-08-15: the mobile Feed/Radio/VS switcher is gone — all three are shell nav
     destinations now. #radMTabs stays in the DOM because M1's safe-area fix and the section
     bar's offset both key off it; it just renders nothing. */
  var tabs = document.createElement('div'); tabs.id = 'radMTabs';
  tabs.innerHTML = '';
  /* SECTION FILTER BAR REMOVED — Founder 2026-08-20: "the mobile earn page still has filters
     swipe left and right. that needs to be removed."
     The element stays in the DOM and renders nothing, exactly like #radMTabs above it: M1's
     safe-area fix and the sticky offsets below both key off these two ids, so deleting the
     nodes would move every section up under the status bar. Empty bar, no buttons, no swipe. */
  var secbar = document.createElement('div'); secbar.id = 'radMSecs';
  secbar.innerHTML = '';
  main.parentNode.insertBefore(tabs, main);
  main.parentNode.insertBefore(secbar, main);

  tabs.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b && b.dataset.go) location.href = b.dataset.go;
  });
  secbar.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) show(Number(b.dataset.i));
  });

  function toast(t){
    var el = document.getElementById('radSwToast');
    if(!el){ el = document.createElement('div'); el.id='radSwToast'; document.body.appendChild(el); }
    el.textContent = t; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 850);
  }
  function show(i, quiet){
    idx = (i + SECS.length) % SECS.length;
    SECS.forEach(function(s, n){
      var el = document.getElementById(s[0]);
      if(el) el.classList.toggle('rad-on', n === idx);
    });
    [].forEach.call(secbar.children, function(b, n){ b.classList.toggle('on', n === idx); });
    var active = secbar.children[idx];
    if(active && active.scrollIntoView) active.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    if(!quiet) toast(SECS[idx][1]);
  }
  show(0, true);

  /* Swipe-to-cycle removed with the filter bar (Founder 2026-08-20). */

  document.addEventListener('touchend', function(e){
    if(x0==null) return;
    var tt=e.changedTouches[0], dx=tt.clientX-x0, dy=tt.clientY-y0, dt=Date.now()-t0; x0=null;
    if(dt>700) return;
    if(Math.abs(dx)<55 || Math.abs(dx)<Math.abs(dy)*1.7) return;
    show(idx + (dx<0 ? 1 : -1));
  }, {passive:true});
})();
</script>

        if(!msg){ msg=document.createElement('div'); msg.id='radNoHits'; msg.className='disc';

        msg.textContent='No station matches “'+term+'”. '+total+' stations available.';
        msg.style.display='';
      } else if(msg){ msg.style.display='none'; }
    }
    if(cnt) cnt.textContent = term ? (shown+' of '+total+' stations') : (total+' stations');
  }

  seg.addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]'); if(!b) return;
    key=b.dataset.k;
    [].forEach.call(seg.querySelectorAll('button'),function(x){ x.classList.toggle('on',x===b); });
    apply();
  });
  if(q) q.addEventListener('input',apply);
  apply();
})();
/* Decorate each section: single-row carousel by default + a down-arrow to expand into the full grid (Founder 2026-08-04) */
(function(){
  [].forEach.call(document.querySelectorAll('main > section'), function(sec){
    var grid=sec.querySelector('.grid'); var sh=sec.querySelector('.sh'); if(!grid||!sh) return;
    grid.classList.add('rad-carou');
    var btn=document.createElement('button'); btn.type='button'; btn.className='sec-toggle'; btn.setAttribute('aria-label','Expand section'); btn.innerHTML='&#9662;';
    btn.addEventListener('click',function(){ var open=sec.classList.toggle('open'); btn.setAttribute('aria-label', open?'Collapse section':'Expand section'); });
    sh.appendChild(btn);
  });
})();
</script>

<script src="/keepitil-pager.js?v=20260820e" defer></script>
<script>
/* ── §D.3 — Radio on the shared pager ──────────────────────────────────────────────────────
   CHANNEL · PLAYLIST · APP. The old `Feed | Radio | VS` switcher (#radMTabs) and the six-button
   section row (#radMSecs) are both replaced by the locked single-filter header — S7 removal,
   still correct, now part of this directive.

   The pager pages over the CARDS already inside each section, so nothing is re-authored: the
   markup that renders a station today renders a station slide tonight. Sections are looked up
   by the ids the page already uses.

   Schedule now has its own slot and Games folds into APP, so the only section without a
   mobile entry point is VS (#earn, 8 items) — intentionally, since VS is a global destination
   and a Radio filter for it would duplicate that. It keeps its desktop layout. */
(function(){
  if(!window.matchMedia('(max-width:860px)').matches) return;

  /* CHANNEL · PLAYLIST · SCHEDULE · APP.
     Schedule earns a slot on its own: 10 items and no other home on mobile.
     Games (2 items) folds into APP rather than taking a slot for itself — a filter has to be
     worth a full swipe. VS (#earn, 8 items) is deliberately dropped: VS is a global destination
     since K1, so a Radio filter for it would be a second path to one product. */
  var FILTERS = [
    { ids:['stations'],           label:'Channel'  },
    { ids:['playlists'],          label:'Playlist' },
    /* Schedule + App filters dropped with their sections (Founder 2026-08-18). */
  ];

  /* SNAPSHOT, once per section.
     render() MOVES the card node into its slide, which removes it from the grid — so a live
     query would return a shrinking list every time the pager asked, and the pager asks on every
     scroll settle. First run reported 16 items for a 14-card grid before this was cached. */
  var SNAP = {};
  function cardsIn(sectionIds){
    var key = sectionIds.join('+');
    if(SNAP[key]) return SNAP[key];
    var list = [];
    sectionIds.forEach(function(id){
      var sec = document.getElementById(id);
      if(!sec) return;
      var nodes = sec.querySelectorAll('.grid > *, .pl-list > *');
      [].slice.call(nodes).forEach(function(n){
        if((n.textContent||'').trim() || n.querySelector('img')) list.push(n);
      });
    });
    if(list.length) SNAP[key] = list;   /* only freeze once there is something to freeze */
    return list;
  }

  function start(attempt){
    attempt = attempt || 0;
    var ready = FILTERS.some(function(f){ return cardsIn(f.ids).length; });
    /* Cards render from Supabase, so the first pass is usually empty. Retry, then say which. */
    if(!ready && attempt < 30){ setTimeout(function(){ start(attempt+1); }, 350); return; }

    var filters = FILTERS.map(function(f){
      return {
        id: f.ids.join('+'),
        label: f.label,
        items: function(){ return cardsIn(f.ids); },
        /* The card node itself is moved into the slide — no clone, no second copy to diverge. */
        render: function(node, el){ if(node) el.appendChild(node); }
      };
    });

    window.KIL_PAGER.mount({
      filters: filters,
      emptyFor: function(f){
        /* BROKEN != EMPTY: "nothing published" and "the page never loaded" are different, and
           the reason says which. */
        return ready
          ? { title:'Nothing in ' + f.label + ' yet', body:'New drops appear here as they publish.' }
          : { title:'Radio could not load', body:'The station list did not come back. <a href="/earn">Try again</a>.' };
      }
    });

    /* The old switchers are gone once the pager owns the screen. */
    ['radMTabs','radMSecs','radSwToast'].forEach(function(id){
      var el = document.getElementById(id); if(el) el.remove();
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ start(0); });
  else start(0);
})();
</script>
