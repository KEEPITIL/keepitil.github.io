# Enforces the single-source-of-truth rule for the agent roster.
# Without this, tests/agent-rename.test.mjs only runs when someone remembers to
# run it, and v3/agents-data.js can silently drift back into being a second
# hand-maintained roster.
#
# Runs fully offline: gen-agents.mjs --check reads the committed snapshot, so no
# Supabase service key is needed in CI.

name: roster-ci

# ⚠ DISABLED ON PUSH/PR 2026-09-01 — THIS JOB TESTS A TREE THAT NO LONGER EXISTS.
#
# Both steps read v3/agents-data.js, which went with the /v3 purge in August. The job has
# therefore failed on EVERY commit to main since: gen-agents.mjs --check dies with ENOENT, and
# five of agent-rename.test.mjs's assertions read files under /v3.
#
# It is left as workflow_dispatch rather than deleted because the roster rules it enforces are
# still worth having — they just need repointing at the current source, which is a piece of work
# in its own right and not a route-cleanup edit. Nothing currently loads agents-data.js, so its
# output is orphaned too; deciding whether the roster tooling should be repointed or retired is
# a Founder call.
#
# A job that fails on every commit is worse than no job: it teaches everyone to ignore the red.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Roster drift check (generated files match canonical snapshot)
        run: node _scripts/gen-agents.mjs --check

      - name: Rename invariants + regression tests
        run: node --test tests/*.test.mjs
