<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>KEEPITIL — URL Router (not an error page)</title>
<!-- ============================================================================
     THIS IS THE KEEPITIL URL ROUTER.  It is NOT an error page.

     WHY IT IS CALLED 404.html: GitHub Pages only ever serves ONE file for an
     unmatched path, and that file MUST be named 404.html at the repo root.
     The name is fixed by the hosting platform — it cannot be renamed without
     losing every clean URL on the site.

     WHAT IT DOES: translates pretty URLs into real pages, e.g.
        /culture              -> /culture
        /radio                -> /earn
        /vs                   -> /create
        /scene                -> /connect
        /profile/<handle>     -> /profile.html?slug=<handle>
        /event/<slug>         -> /event.html?e=<slug>
        /venue/<slug>         -> /venue.html?v=<slug>

     DELETE THIS FILE AND EVERY CLEAN URL ABOVE BREAKS AT ONCE.
     Only if a path matches nothing does it fall through to the "not found"
     panel below — which is why opening it directly looks blank/dead.
============================================================================ -->
<style>html,body{margin:0;height:100%;background:#0a0a0f;color:#eef;font:15px/1.6 'Inter',system-ui,sans-serif}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#5cc8ff}</style>
<script>
/* KEEPITIL clean-URL router (Founder 2026-07-31).
   GitHub Pages serves this 404.html for any unmatched path; we translate pretty URLs
   to the working / pages via a client-side redirect. Falls through to a real 404 message. */
(function(){
  /* ── §H1 — COLD START INSIDE THE APP ────────────────────────────────────────────────────
     On GitHub Pages a real server hands this file every unmatched path, so location.pathname
     is a site path and the map below is meaningful. The app bundle has NO server: the WebView
     opens capacitor:// (iOS) or file://, where pathname is a filesystem path that means
     nothing here. The router would still "resolve" a clean URL, replace into a file the bundle
     does not contain, land back here, and resolve again — so the first thing a user sees is an
     error page it cannot leave. Invisible on the web, which is why it survived.

     Any non-http(s) scheme therefore skips clean-URL mapping entirely and goes to the real
     entry file. RELATIVE, not '/index.html': under capacitor:// and file:// a leading slash is
     not the bundle root. */
  var httpish = /^https?:$/i.test(location.protocol);
  if(!httpish){
    var onEntry = /(^|\/)index\.html$/i.test(location.pathname);
    /* Two guards, because a bounce loop here is a brick: don't replace if we are already on
       the entry file, and never replace twice in one session even if that check is fooled by
       an odd scheme. */
    var tried = false;
    try{ tried = sessionStorage.getItem('kil404_entry') === '1'; }catch(e){}
    if(!onEntry && !tried){
      try{ sessionStorage.setItem('kil404_entry','1'); }catch(e){}
      location.replace('index.html');
    }
    return;
  }
  try{ sessionStorage.removeItem('kil404_entry'); }catch(e){}

  var p = location.pathname.replace(/\/+$/,''); // strip trailing slash
  var seg = p.split('/').filter(Boolean);       // path segments
  var q = location.search || '';
  var hash = location.hash || '';
  function go(url){ location.replace(url + hash); }
  var slug = seg.length ? decodeURIComponent(seg[seg.length-1]).toLowerCase().replace(/[^a-z0-9-]/g,'') : '';
  /* The 2026-08-16 rename kept the database row and its uuid: echo→cho, nexus→xus.
     Legacy slugs live on in public.agent_aliases, but this runs before any script can
     load, so the table is inlined here — an exact-key lookup, never a prefix match:
     'cho' is a substring of 'echo' and 'echo-west' is a real DJ with a real profile.
     tests/agent-rename.test.mjs asserts this copy against the generated one. */
  var AGENT_ALIASES = { echo: 'cho', nexus: 'xus' };
  if(Object.prototype.hasOwnProperty.call(AGENT_ALIASES, slug)) slug = AGENT_ALIASES[slug];

  /* RETIRED .html PATHS → clean URLs (Founder 2026-08-18).
     The four redirect stubs (radio/scene/vs/culture.html) are DELETED, not kept, because a stub
     at culture.html HIJACKED the extensionless /culture — GitHub Pages resolves /culture to
     culture.html BEFORE culture/index.html, so the stub redirected /culture to itself and the
     page hung in a loop.
     Handling the old paths HERE instead costs nothing: 404.html only runs on a path that matched
     no file, so a live page never pays for it and there is no redirect in the normal flow. Old
     links shared or baked into an app bundle still land in the right place. */
  var RETIRED = { 'radio':'/earn', 'scene':'/connect', 'vs':'/create', 'culture':'/culture' };
  if(seg.length===1){
    var bare = seg[0].toLowerCase().replace(/\.html$/,'');
    if(RETIRED[bare] && ('/'+seg[0].toLowerCase())!==RETIRED[bare]) return go(RETIRED[bare]+q);
  }
  // /unclaimed/profile/<slug>  → dynamic template (public view); no stale static clones (Founder 2026-08-04)
  if(seg.length===3 && seg[0]==='unclaimed' && seg[1]==='profile'){
    return go('/profile.html?slug='+encodeURIComponent(slug)+'&view=public');
  }
  // /public/profile/<slug>
  if(seg.length===3 && seg[0]==='public' && seg[1]==='profile'){
    return go('/profile.html?slug='+encodeURIComponent(slug)+'&view=public');
  }
  // /profile/<slug>
  if(seg.length===2 && seg[0]==='profile'){
    return go('/profile.html?slug='+encodeURIComponent(slug));
  }
  // /venue/<slug>
  if(seg.length===2 && seg[0]==='venue'){
    return go('/venue.html?v='+encodeURIComponent(slug));
  }
  // /event/<name>
  if(seg.length===2 && seg[0]==='event'){
    return go('/event.html?e='+encodeURIComponent(slug));
  }
  /* /article/<slug> NO LONGER ROUTES HERE (2026-08-31 route cleanup). Every article is now a
     real directory — /article/<slug>/index.html and /article/artist/<slug>/index.html — so the
     canonical URL returns 200 directly and this file is never reached for one. It used to
     rewrite to /article-<slug>.html, which meant normal article navigation went 404 → JS →
     page. Those flat files no longer exist; leaving the branch would send a visitor from a
     404 to a second 404.
     /blog/<slug> is gone for the same reason: no blog-*.html file has existed for some time,
     so the branch could only ever produce a second 404. */
  // bare /blog and /blog/<anything> → subscriber posts live in Culture
  if(seg[0]==='blog'){
    return go('/culture/');
  }
  // /culture/<sub> — Radio & VS live as Culture subpages (Founder 2026-08-04)
  if(seg.length===2 && seg[0]==='culture'){
    if(seg[1]==='radio') return go('/earn/'+q);
    if(seg[1]==='vs') return go('/create/'+q);
    if(seg[1]==='feed') return go('/culture/'+q);
  }
  /* TRAILING SLASHES ARE DELIBERATE. GitHub Pages 301s /culture to /culture/, so sending a
     visitor to the slashless form made every alias a two-hop journey: 404 → /culture →
     301 → /culture/. */
  // single-segment section aliases + every core page (clean URL)
  var SECTION={culture:'/culture/',scene:'/connect/',radio:'/earn/',
               apps:'/games/',games:'/games/',events:'/',home:'/'};
  /* about, contact and onboarding were removed: no such page exists, so those entries could
     only ever send a visitor from one 404 to another. */
  var V31PAGES=['apply','audit','community-guidelines','create-event','dashboard',
                'event','privacy','refund','settings','submit-event','terms',
                'ticket-terms','tickets'];
  if(seg.length===1){
    var one=seg[0].toLowerCase();
    if(SECTION[one]) return go(SECTION[one]);
    if(V31PAGES.indexOf(one)>=0) return go('/'+one+'.html'+q);
  }

  // No route matched — show a minimal 404 with a way home.
  document.documentElement.setAttribute('data-nomatch','1');
})();
</script>
</head><body>
<div class="wrap" id="fourohfour" style="display:none">
  <h1 style="font-size:2rem;margin:0 0 6px">Page not found</h1>
  <p style="color:#9aa;margin:0 0 20px;max-width:460px">That link doesn't exist, or it moved. Here's everything on KEEPITIL:</p>
  <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px">
    <a href="/" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Home</a>
    <a href="/culture" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Culture</a>
    <a href="/earn" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Earn</a>
    <a href="/create" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Create</a>
    <a href="/connect" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Connect</a>
    <a href="/tickets.html" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Tickets</a>
    <a href="/apply.html" style="padding:9px 15px;border:1px solid #2a3550;border-radius:9px;text-decoration:none">Join</a>
  </div>
  <p style="color:#5a6478;font-size:12px;margin-top:26px;max-width:520px">
    Developer note: this file is the site’s URL router. GitHub Pages requires it to be
    named <code>404.html</code>. Do not delete it — every clean URL depends on it.</p>
</div>
<script>
/* only reveal the 404 message if the router didn't redirect */
if(document.documentElement.getAttribute('data-nomatch')){ document.getElementById('fourohfour').style.display='flex'; }
</script>
</body></html>
