<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#a855f7;--brand-2:#c084fc;--ink:#f4f2fb;--ink2:#9a94b4;--ink3:#6b6588;--brd:rgba(255,255,255,.12);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;--fs:'Fraunces',serif}
/* ⚠ THE COLOUR LIVES ON <html> ONLY — body MUST stay transparent (Atlas 2026-08-21).
   This was `html,body{background:#0a0a0f}` and it made the backdrop invisible even though the
   image loaded and the rule applied. Root stacking context paints: html background → negative
   z-index children (body::before) → in-flow block backgrounds (body). An opaque body background
   therefore covers a `z-index:-2` ::before completely. */
html{background:#0a0a0f}
/* overflow-x:clip, NOT hidden (Atlas 2026-08-21). `overflow-x:hidden` on body computes
   overflow-y:auto, which turns BODY into a scroll container. position:sticky then resolves
   against body instead of the viewport, and because the page actually scrolls on the
   viewport the bar never sticks — the filter bars were correctly declared sticky and simply
   could not work. `clip` clips the same overflow WITHOUT creating a scroll container, so
   sticky resolves against the viewport again. `hidden` is kept first as the fallback for
   anything that predates `clip`. */
body{background:transparent;color:var(--ink);font-family:var(--fb);overflow-x:hidden;overflow-x:clip}
body{padding-top:70px;padding-bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
/* THE FOOTER MUST ABSORB THE FREE SPACE, NOT LEAVE IT BEHIND (Founder 2026-08-26: "the bottom
   page footer is floating and a gap after it").
   body is a flex column with min-height:100dvh. On a SHORT view — the entry page, an empty
   state, a "not found" — the content does not fill the viewport, and a flex column collects
   its free space AFTER the last item. Measured on ?view=entry: footer ended at y=580 with the
   document 900 tall, so 320px of bare page backdrop rendered below it and the footer appeared
   to float mid-page. The list view hid this only because it happens to be tall enough.
   margin-top:auto moves that free space ABOVE the footer, pinning it to the bottom. This is
   the same rule connect/index.html and earn/index.html already carry — create was the one page
   with the flex body and without the fix. On a tall page auto resolves to 0 and the footer's
   own padding supplies the separation, so nothing changes there.
   ⚠ SPECIFICITY: the shell injects `#v3-footer{...margin-top:56px}` — an ID, (1,0,0) — and it
   appends its stylesheet at runtime, so it also wins ties on source order. A bare
   `footer{margin-top:auto}` (0,0,1) is silently overridden; measured on the deployed page,
   computed margin-top stayed 56px and the 320px gap stayed with it. `body #v3-footer` is
   (1,0,1) and wins. The bare selector is kept for any page footer that is not the shell's. */
footer{margin-top:auto}
body #v3-footer{margin-top:auto}
/* A flex-column body makes every child a flex item, and a flex item defaults to
   min-width:auto — it will not shrink below its own max-content width. Measured at
   375px: .wrap computed to 1120px while body{overflow-x:hidden} clipped the excess,
   hiding the overflow instead of fixing it. Releasing min-width is what lets the
   locked-footer flex body and a nowrap rail coexist. */
body>*{min-width:0}

/* CREATE backdrop (Founder 2026-08-21). Two files, not one: the desktop art is 16:9 and its
   subject sits centre-left, so on a 9:19.5 phone `cover` crops to a slice of empty floor and the
   logo is gone. The portrait crop is a separate composition, switched at the shell's 860px
   breakpoint. Opacity .5 keeps the pink from fighting the pink competition cards. */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:#0a0a0f url('/assets/images/create-hero.jpg?v=20260821b') center/cover no-repeat;opacity:1}
@media(max-width:860px){
  body::before{background-image:url('/assets/images/create-hero-m.jpg?v=20260821b')}
  /* Founder 2026-08-24: the 70px clears the DESKTOP shell nav, which is display:none below
     861px. Leaving it makes the landing panel start at y=70 while the canonical height assumes
     y=0, so the panel overshoots by exactly 70px and the metrics row — the last thing in a
     bottom-weighted column — falls behind the bottom nav.
     /connect has no body padding-top; that is the whole reason it was the only correct page.
     Third instance of one defect: Discovery's 56px, /earn's rad-m inset, now this.
     padding-bottom is deliberately NOT touched here: the shell already emits
     `body{padding-bottom:0!important}` inside its own 860px block, so the page's
     calc(96px + env(safe-area-inset-bottom)) is already dead on mobile and the two are not
     compounding. Verified in the served shell before changing anything. KODE 2026-08-24. */
  body{padding-top:0!important}
}
html.has-season body::before{display:none!important}/* seasonal image takes over on its dates */
/* The scrim was .70→.92 black. Stacked on the backdrop that left the art effectively invisible —
   two separate dimmers on one image. The backdrop is now full opacity and this single scrim does
   all the darkening, kept just heavy enough at the bottom to hold card text legible. */
/* Scrim lightened for the 2026-08-21b artwork: these compositions already leave a dark,
   empty centre for the page content and put the neon out at the edges. The heavier
   .35->.72 scrim was flattening exactly the parts meant to be seen. */
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,15,.12),rgba(10,10,15,.55))}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px;width:100%}
.hero{padding:34px 0 18px;text-align:center}
.hero h1{font-family:var(--fh);font-size:clamp(3rem,11vw,6rem);letter-spacing:.04em;line-height:.9;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#e7e5f2;font-family:var(--fh);letter-spacing:.14em;font-size:1.1rem;margin-top:6px}
.soon{background:rgba(255,255,255,.035);border:1px solid var(--brd);border-radius:18px;padding:52px 26px;text-align:center;margin:22px 0}
.soon .i{font-size:3rem}
.soon h2{font-family:var(--fs);font-weight:600;font-size:1.6rem;color:#fff;margin:12px 0 8px}
.soon p{color:var(--ink2);max-width:460px;margin:0 auto}
footer{border-top:1px solid rgba(255,255,255,.06);padding:30px;text-align:center;color:var(--ink3);font-size:.82rem;margin-top:auto}
footer a{color:var(--brand-2)}
/* Vertical sidebar (desktop): subpages on top + VS filters below — same pattern as Culture/Radio (Founder 2026-08-04) */
.cul-vrail{display:none}
/* §D5 — VS pager slide styling. The pager owns layout; these are the card internals. */
.vsp-card{width:100%;max-width:520px;text-align:center;color:#fff}
.vsp-cov{width:100%;aspect-ratio:1/1;border-radius:10px;background:#15131f center/cover no-repeat;margin-bottom:14px}
.vsp-card h3{font-family:var(--fh,Inter),sans-serif;font-size:1.35rem;line-height:1.15;margin:0 0 6px}
.vsp-by{color:rgba(255,255,255,.6);font-size:.9rem;margin-bottom:14px}
.vsp-join{appearance:none;cursor:pointer;border:0;border-radius:999px;padding:13px 22px;min-height:44px;
  background:var(--brand,#00b4ff);color:#00121c;font:800 .95rem/1 Inter,sans-serif;letter-spacing:.04em;margin-top:10px}
.vsp-join:focus-visible{outline:2px solid #fff;outline-offset:3px}
#kilp .kilp-empty .vsp-join{margin-top:14px}
@media(min-width:861px){
  .cul-vrail{display:flex;flex-direction:column;gap:9px;position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40}
  .cul-vrail{overflow:visible}
  .cul-vrail .cvr{display:flex;align-items:center;gap:13px;width:58px;height:58px;padding:0 15px;overflow:hidden;white-space:nowrap;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(20,18,30,.9);backdrop-filter:blur(12px);color:#cfc9e6;cursor:pointer;transition:width .18s ease;box-sizing:border-box}
  .cul-vrail .cvr .ic{font-size:1.55rem;flex:0 0 auto;line-height:1;width:26px;text-align:center}
  .cul-vrail .cvr .tx{font-family:var(--fh);font-weight:800;letter-spacing:.08em;font-size:.9rem;opacity:0;transition:opacity .12s}
  .cul-vrail:hover .cvr{width:180px}
  .cul-vrail .vr-subdd{position:absolute;right:66px;top:0;display:none;flex-direction:column;gap:2px;background:#15131f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px;min-width:150px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .cul-vrail .vr-subdd.open{display:flex}
  .cul-vrail .vr-subdd button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#e6e2f2;font-size:.95rem;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
  .cul-vrail .vr-subdd button .ic{font-size:1.2rem}
  .cul-vrail .vr-subdd button:hover{background:rgba(255,255,255,.09);color:#fff}
  .cul-vrail:hover .cvr .tx{opacity:1}
  .cul-vrail .vr-div{width:34px;height:1px;background:rgba(255,255,255,.2);align-self:flex-end;margin:4px 6px 4px 0}
  .cul-vrail .cvr.sp.on{background:linear-gradient(90deg,#7c3aed,#a855f7);border-color:transparent;color:#fff}
  .cul-vrail .cvr.sf.on{background:linear-gradient(90deg,#3aa5ff,#5cc8ff);border-color:transparent;color:#04121b}
}
</style>
  <!-- PWA manifest — STATIC, deliberately (Founder 2026-08-15).
       keepitil-shell.js has injected this link from JS since forever (see its head-tags block),
       and the installed PWA still had no start_url: iOS reads the manifest when the user taps

<meta property="og:image" content="https://keepitil.com/keepitil-og.png"/>

<body>

<main class="wrap">
  <!-- Hero removed 2026-08-19 (Founder): the nav already says CREATE, and the tagline pushed the
       competition grid below the fold on every competition page. The page-level <h1> now lives in
       vs-app.js so each view (browse / competition detail) owns its own heading — a page must not
       ship two competing h1s. -->
  <!-- vs-app.js renders CREATE (competitions, entry, voting) into #vs-app.
       This block is the PRE-JAVASCRIPT state — it is what crawlers and link unfurlers see, so it
       must never claim the product is unbuilt. It said "the VS platform is being built" while 36
       competitions were live. -->
  <div id="vs-app">
    <div class="soon"><div class="i">⚔️</div><h2>Loading competitions…</h2><p>CREATE — seven creator competitions. Q4 2026 season opens soon.</p></div>
  </div>
</main>

<!-- DESKTOP FILTER RAIL REMOVED 2026-08-18 (Founder) — the six-view side rail is gone, matching
     the same removal on Culture and Radio.
     ⚠ ONE THING HAD TO SURVIVE IT. vs-app.js's navBar() has been a no-op since 2026-08-05, so
     this rail was the ONLY navigation on desktop. Deleting it outright would leave a desktop
     visitor stuck on FEED with no route to Join — and "the entry control was unreachable" is the
     documented reason this page has 36 published competitions and 0 entries. So the rail goes and
     a single JOIN button stays: one call to action, not a filter set. Mobile is unaffected — the
     pager still carries all six views. -->
<!-- desktop only: on mobile the pager already carries JOIN as its own filter, and two entry
     buttons on one screen is worse than none — it makes the primary action look uncertain. -->
<!-- REMOVED 2026-08-21 (Founder). It was hidden on desktop on 2026-08-20 and kept on mobile on
     the theory that the disabled pager left a phone with no route into a competition. That was
     wrong: the default view IS the competition grid, and every card links straight in. On a phone
     the button just sat alone under the last card, below the fold, looking like a stray control.
     Both breakpoints now reach a competition the same way — by tapping the competition. -->

<!-- universal shell: injects the KEEPITIL·CULTURE·SCENE·LOGIN nav + footer + radio bar (same on every page) -->
<script src="/keepitil-shell.js?v=20260831a" defer></script>
<script src="/kil-seasons.js?v=20260826a"></script>
<script src="/assets/js/keepitil-radio.js?v=20260829a" defer></script>
<!-- floating AI chat bubble (#kilo-btn) — same as Culture/home for uniformity -->
<script src="/assets/js/keepitil-ai.js?v=20260901a" defer></script>
<!-- VS platform (KODE): Supabase client + the app that renders into #vs-app.
     vs-app.js defines the real window.vsFilter, replacing the placeholder hook. -->
<script src="/assets/js/vendor/supabase-js.min.js"></script>
<script src="/vs-app.js?v=20260826e"></script>
<script src="/keepitil-pager.js?v=20260820e" defer></script>
<script>
/* VS subpage view switch (Founder 2026-08-05): rail drives vs-app.js via window.vsGo(view).
   FEED/My Votes/My Entry/Manage map to existing app views; Vote/Join/Winners are new (KODE). */
function vrNav(view, el){
  try{ var rail=document.getElementById('vsVRail');
       if(rail&&el){ [].forEach.call(rail.querySelectorAll('.cvr.sf'),function(b){ b.classList.toggle('on', b===el); }); } }catch(x){}
  if(typeof window.vsGo==='function'){ try{ window.vsGo(view); return; }catch(e){} }
  /* fallback until vs-app.js exposes vsGo: FEED still works via the legacy filter hook */
  if(view==='feed' && typeof window.vsFilter==='function'){ try{ window.vsFilter('all'); }catch(e){} }
}
/* subpage dropdown (uniform with Culture/Radio) — Founder 2026-08-04 */
function vrToggleSub(e){ if(e){try{e.stopPropagation();}catch(x){}} var dd=document.getElementById('vrSubDD'); if(dd)dd.classList.toggle('open'); }
function vrGoSub(sp){ var dd=document.getElementById('vrSubDD'); if(dd)dd.classList.remove('open'); location.href=(sp==='feed'?'/culture/':(sp==='radio'?'/culture/radio':'/culture/vs')); }

/* ── §D5 — VS on the pager, all six rail views ──────────────────────────────────────────────
   `.cul-vrail` is display:none with a min-width:861px override, so the rail — and every one of
   these six views — has been DESKTOP-ONLY. On a phone there was no way to enter a competition,
   vote, or see winners. That is why VS has 36 published competitions and 0 entries; it was never
   a demand problem, it was an unreachable control.

   JOIN IS NOT JUST THE FOURTH SWIPE. It is the money action and it is treated as one:
     - the filter carries `primary:true`, which the header renders in the brand colour
     - every empty state links STRAIGHT to it rather than describing where it is
   A user who has to swipe three times to find the entry form is barely better off than one who
   could not find it at all. */
(function(){
  var SB=null, CACHE={};

  function sb(tries){
    tries=tries||0;
    if(SB) return Promise.resolve(SB);
    if(window.supabase&&window.__vsSB){ SB=window.__vsSB; return Promise.resolve(SB); }
    if(tries>=40) return Promise.resolve(null);
    return new Promise(function(r){ setTimeout(function(){ r(sb(tries+1)); },350); });
  }

  /* One RPC per view. Failures resolve to [] and are recorded, so an empty column reads as
     "nothing here" and a broken one can still be told apart in the console. */
  function load(key, fn){
    if(CACHE[key]) return Promise.resolve(CACHE[key]);
    return sb().then(function(c){
      if(!c) return [];
      return fn(c).then(function(r){
        if(r&&r.error){ CACHE[key+'_err']=r.error.message; return []; }
        CACHE[key]=(r&&r.data)||[]; return CACHE[key];
      }).catch(function(e){ CACHE[key+'_err']=String(e&&e.message||e); return []; });
    });
  }

  var VIEWS=[
    { id:'feed',    label:'FEED',     rpc:function(c){ return c.rpc('vs_feed',{p_sort:'new',p_limit:30}); } },
    { id:'vote',    label:'VOTE',     rpc:function(c){ return c.rpc('vs_open_competitions',{}); },
      filter:function(x){ return !!x.voting_open; } },
    { id:'join',    label:'JOIN',     primary:true,
      rpc:function(c){ return c.rpc('vs_open_competitions',{}); },
      filter:function(x){ return !x.voting_open; } },
    { id:'winners', label:'WINNERS',  rpc:function(c){ return c.rpc('vs_feed',{p_sort:'top',p_limit:30}); },
      filter:function(x){ return !!x.is_winner; } },
    { id:'votes',   label:'MY VOTES', rpc:function(c){ return c.rpc('vs_my_votes',{}); } },
    { id:'mine',    label:'MY ENTRY', rpc:function(c){ return c.rpc('vs_my_entries',{}); } }
  ];

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function joinIndex(){ for(var i=0;i<VIEWS.length;i++) if(VIEWS[i].id==='join') return i; return 2; }

  /* Every empty state routes to JOIN instead of naming a control. The old copy read
     "Tap Join on the rail" — a rail that does not exist on either breakpoint now. */
  function emptyFor(f){
    if(f.id==='join'){
      return { title:'No competitions open right now',
               body:'<span>When one opens it appears here, and you can enter it from this screen.</span>' };
    }
    var line = f.id==='mine'    ? 'You have not entered a competition yet.'
             : f.id==='votes'   ? 'You have not voted yet.'
             : f.id==='winners' ? 'No winners announced yet.'
             : f.id==='vote'    ? 'Nothing is open for voting right now.'
             : 'No entries yet.';
    return { title:line,
             body:'<span>Entering takes a minute.</span>'
                 +'<button type="button" class="vsp-join" onclick="window.__vsGoJoin&&window.__vsGoJoin()">Enter a competition →</button>' };
  }
  /* Works on BOTH breakpoints. The old copy — "Tap Join on the rail" — was at least true on
     desktop, where the rail exists; replacing it with a mobile-only control would have fixed
     the phone and broken the desktop in the same edit. Pager first, rail second. */
  window.__vsGoJoin=function(){
    try{ if(window.__kilPager){ window.__kilPager.gotoFilter(joinIndex()); return; } }catch(e){}
    try{ if(typeof window.vsGo==='function'){ window.vsGo('join'); return; } }catch(e){}
    location.hash='#join';
  };

  function card(x, el){
    var title=esc(x.title||x.competition_title||'Untitled');
    var by=x.creator_handle?('@'+esc(x.creator_handle)):'';
    var cover=x.thumb_url||x.cover_url||'';
    el.innerHTML='<div class="vsp-card">'
      +(cover?'<div class="vsp-cov" style="background-image:url('+esc(cover)+')"></div>':'<div class="vsp-cov"></div>')
      +'<h3>'+title+'</h3>'
      +(by?'<div class="vsp-by">'+by+'</div>':'')
      +(x.competition_id||x.id
        ? '<button type="button" class="vsp-join" onclick="window.vsGo&&window.vsGo(\'join\')">Enter this competition →</button>'
        : '')
      +'</div>';
  }

  function mount(){
    if(!window.KIL_PAGER||!window.KIL_PAGER.isMobile()) return;
    var filters=VIEWS.map(function(v){
      return {
        id:v.id, label:v.label, primary:!!v.primary, kind:'vs',
        items:function(){ var rows=CACHE[v.id]||[]; return v.filter?rows.filter(v.filter):rows; },
        render:function(item,el){ card(item,el); }
      };
    });
    Promise.all(VIEWS.map(function(v){ return load(v.id, v.rpc); })).then(function(){
      window.KIL_PAGER.mount({ filters:filters, emptyFor:emptyFor });
      var rail=document.getElementById('vsVRail'); if(rail) rail.style.display='none';
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else setTimeout(mount,0);
})();
document.addEventListener('click',function(e){ var dd=document.getElementById('vrSubDD'),b=document.getElementById('vrSubBtn'); if(dd&&dd.classList.contains('open')&&!dd.contains(e.target)&&b&&!b.contains(e.target))dd.classList.remove('open'); });
</script>
</body>
