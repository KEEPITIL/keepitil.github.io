function hit(u,d){let hadShield=u.shield>0;if(u.shield>0){let q=Math.min(u.shield,d);u.shield-=q;d-=q}if(hadShield&&u.shield<=0&&u.role==='defender'&&!u.fortDef){u.shield=0;u.pendingSpearThrow=true;u.dualSwords=true;u.role='assault';u.retreating=true;u.fallbackX=u.x-u.team*8;u.fallbackZ=u.z;u.cd=0}if(d>0&&u.armor>0){let q=Math.min(u.armor,d*.65);u.armor-=q;d-=q*.7}u.hp-=d;if(u.hp<=0)fx.push({x:u.x,z:u.z,life:1,type:'burst'})}

function separateArmy(){let mob=units.filter(u=>u.hp>0&&!u.fortDef);for(let i=0;i<mob.length;i++)for(let j=i+1;j<mob.length;j++){let a=mob[i],b=mob[j];if(a.team!==b.team)continue;let dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d>0&&d<2.35){let push=(2.35-d)*.5,nx=dx/d,nz=dz/d;a.x-=nx*push;a.z-=nz*push;b.x+=nx*push;b.z+=nz*push}}}

function update(dt){t+=dt;gold+=dt*3;powerCd=Math.max(0,powerCd-dt);bannerT-=dt;document.getElementById('banner').classList.toggle('show',bannerT>0);if(units.filter(u=>u.team===-1&&u.hp>0).length===0)nextWave();for(let w of wizards){w.cd-=dt;w.attackCd=(w.attackCd||0)-dt;let owned=units.filter(u=>u.team===1&&u.wizard===w.id&&u.role==='defender');if(owned.length<10&&w.cd<=0&&units.filter(u=>u.team===1).length<50){let slot=owned.length;add('defender',1,(slot-4.5)*4,{wizard:w.id});w.cd=.8}let targets=units.filter(u=>u.team===-1&&u.hp>0&&u.x<70);if(targets.length&&w.attackCd<=0){let q=targets.reduce((a,b)=>a.x<b.x?a:b);shots.push({kind:'magic',x:PLAYER_FORT+1,y:23,z:-9+(w.id-1)*4.5,tx:q.x,tz:q.z,ty:5,target:q.id,team:1,d:34,life:1});w.attackCd=2.8}}

for(let s of shots){if(s.age==null){s.age=0;s.sx=s.x;s.sz=s.z;s.sy=s.y;s.duration=s.kind==='spear'?.95:s.kind==='magic'?.8:1.2}s.age+=dt;let k=Math.min(1,s.age/s.duration),target=units.find(u=>u.id===s.target&&u.hp>0);if(target){s.tx=target.x;s.tz=target.z;s.ty=(target.platformY||0)+5}s.x=s.sx+(s.tx-s.sx)*k;s.z=s.sz+(s.tz-s.sz)*k;let base=s.sy+((s.ty??5)-s.sy)*k,arc=s.kind==='spear'?7:s.kind==='magic'?9:14;s.y=base+Math.sin(k*Math.PI)*arc;s.life=1-k;if(k>=1){let q=target||units.find(u=>u.team!==s.team&&u.hp>0&&Math.hypot(u.x-s.x,u.z-s.z)<5);if(q)hit(q,s.d)}}shots.splice(0,shots.length,...shots.filter(s=>s.life>0));units.splice(0,units.length,...units.filter(u=>u.hp>0));for(let f of fx)f.life-=dt;fx.splice(0,fx.length,...fx.filter(f=>f.life>0));document.getElementById('gold').textContent=Math.floor(gold);document.getElementById('wave').textContent=wave;document.getElementById('count').textContent=units.filter(u=>u.team===1).length;document.getElementById('ph').style.width=100*fortHP/fortMax+'%';document.getElementById('eh').style.width=100*enemyHP/enemyMax+'%'}
function terrain(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#14243a');sky.addColorStop(.48,'#6f9eaa');sky.addColorStop(1,'#d7c38e');x.fillStyle=sky;x.fillRect(0,0,W,H);let sun=x.createRadialGradient(W*.78,H*.16,4,W*.78,H*.16,H*.18);sun.addColorStop(0,'#fff3b8cc');sun.addColorStop(1,'#fff0');x.fillStyle=sun;x.fillRect(0,0,W,H*.55);x.fillStyle='#425863';x.beginPath();x.moveTo(0,H*.47);for(let i=0;i<=12;i++){let px=i*W/12,py=H*(.29+.13*Math.sin(i*2.1)+.06*Math.sin(i*.73));x.lineTo(px,py)}x.lineTo(W,H*.58);x.lineTo(0,H*.58);x.fill();x.fillStyle='#61745d';x.beginPath();x.moveTo(0,H*.52);for(let i=0;i<=18;i++)x.lineTo(i*W/18,H*(.43+.035*Math.sin(i*1.8)));x.lineTo(W,H*.62);x.lineTo(0,H*.62);x.fill();for(let i=0;i<34;i++){let px=(i*97%W),py=H*(.43+(i%4)*.012),r=8+(i%5)*3;x.fillStyle=i%3?'#263d32':'#334a37';x.beginPath();x.moveTo(px-r,py+r);x.lineTo(px,py-r*2);x.lineTo(px+r,py+r);x.fill()}let corners=[[0,0,-52],[WORLD,0,-52],[WORLD,0,52],[0,0,52]].map(v=>proj(...v));let grd=x.createLinearGradient(0,H*.35,0,H);grd.addColorStop(0,'#70814d');grd.addColorStop(1,'#3f5632');x.fillStyle=grd;x.beginPath();corners.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fill();poly3([[0,.03,-12],[WORLD,.03,-12],[WORLD,.03,12],[0,.03,12]],'#91764b','#796039');poly3([[0,.05,-7],[WORLD,.05,-7],[WORLD,.05,7],[0,.05,7]],'#aa8b58','#8b7049');for(let i=5;i<WORLD;i+=10){line3([i,.07,-6],[i,.07,6],.05,'#c8aa72aa');for(let z of[-41,-31,31,41]){let h=.35+((i+z)%4)*.12;line3([i,.05,z],[i-1,h,z-.5],.07,'#89a555');line3([i,.05,z],[i+1,h,z+.5],.07,'#526f39')}}for(let X=20;X<WORLD;X+=18)for(let Z of[-47,47])ball(X,.35,Z,.45+(X%3)*.15,'#6d6658','#4b4439')}
function castleWizard(w,i){let X=PLAYER_FORT,Z=-9+i*4.5,Y=15,glow=.65+.25*Math.sin(t*4+i);poly3([[X-1,Y,Z-1],[X+1,Y,Z-1],[X+.65,Y+5,Z],[X-.65,Y+5,Z]],'#354fbd','#18295f');ball(X,Y+6,Z,1,'#111417','#d9b36d');poly3([[X-1.5,Y+6.7,Z],[X+1.5,Y+6.7,Z],[X,Y+9.2,Z]],'#354fbd','#18295f');line3([X+1,Y,Z+1],[X+1,Y+8,Z+1],.18,'#6b4526');ball(X+1,Y+8.5,Z+1,.42+glow*.15,'#73edff','#d9ffff')}
function drawArrow(s){if(s.kind==='magic'){line3([s.x-1,s.y,s.z],[s.x+1,s.y,s.z],.32,'#78efff');ball(s.x,s.y,s.z,.55,'#78efff','#d9ffff');return}let dx=s.tx-s.x,dz=s.tz-s.z,d=Math.hypot(dx,dz)||1,nx=dx/d,nz=dz/d,L=s.kind==='spear'?3.6:1.7,tail=[s.x-nx*L,s.y,s.z-nz*L],tip=[s.x+nx*(s.kind==='spear'?2.2:1.2),s.y,s.z+nz*(s.kind==='spear'?2.2:1.2)];line3(tail,tip,s.kind==='spear'?.15:.09,'#6b4526');if(s.kind!=='spear')line3(tail,[tail[0]-nx*.45,tail[1]+.3,tail[2]-nz*.45],.07,'#e7dfc6');poly3([[tip[0]+nx*.55,tip[1],tip[2]+nz*.55],[tip[0]-nz*.22,tip[1]-.25,tip[2]+nx*.22],[tip[0]+nz*.22,tip[1]+.25,tip[2]-nx*.22]],'#dce2e6','#70777c')}
function draw(){terrain();let things=[{d:proj(PLAYER_FORT,0,0).d,f:()=>fort(PLAYER_FORT,1)},{d:proj(ENEMY_FORT,0,0).d,f:()=>fort(ENEMY_FORT,-1)},...wizards.map((w,i)=>({d:proj(PLAYER_FORT,15,-9+i*4.5).d,f:()=>castleWizard(w,i)})),...units.map(u=>({d:proj(u.x,0,u.z).d,f:()=>soldier(u)}))].sort((a,b)=>a.d-b.d);things.forEach(o=>o.f());for(let s of shots)drawArrow(s);for(let f of fx){let p=proj(f.x,2,f.z);x.strokeStyle=`rgba(255,160,30,${f.life})`;x.lineWidth=8*(1-f.life)+2;x.beginPath();x.arc(p.x,p.y,25*(1-f.life),0,7);x.stroke()}}

for(let i=0;i<20;i++)add(i%7===0?'ranged':i%5===0?'defender':'assault',-1,(i%10-4.5)*4,{x:ENEMY_FORT-8-Math.floor(i/10)*1.2});requestAnimationFrame(loop);
