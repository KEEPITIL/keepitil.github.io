<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="/v3/logo-blue-nav.png"/>
  <meta name="description" content="KEEPITIL Gallery — photos, flyers and moments from the OC & LA electronic music scene."><title>Gallery — KEEPITIL</title>
<link rel="stylesheet" href="/v3/v3-tokens.css"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text);font-family:var(--font);line-height:1.55;padding-bottom:90px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--sp-3,20px)}
.hero{padding:var(--sp-6,66px) 0 var(--sp-2,14px);text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background:radial-gradient(65% 85% at 50% 0%,color-mix(in srgb,var(--glow,#00b4ff) 50%,transparent),transparent 72%)}
.eyebrow{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.16em;color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:6px 15px;margin-bottom:16px;text-transform:uppercase}
.hero h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;letter-spacing:.02em}
.hero h1 span{color:var(--brand)}
.hero p{color:var(--muted);max-width:560px;margin:14px auto 0;font-size:1.02rem}

/* filter chips */
.filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0 6px}
.fchip{font-weight:800;font-size:.85rem;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface,#15151f);color:var(--muted);cursor:pointer;transition:.2s}
.fchip:hover{color:var(--text)}
.fchip.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#04121b;border-color:transparent}

/* upload cta */
.upload{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent,#8b5cff) 9%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent,#8b5cff) 40%,var(--line));border-radius:16px;padding:16px 22px;margin:18px 0 6px}
.upload .txt{font-weight:700;font-size:.95rem}
.upload .txt small{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:2px}
.upload a{font-size:.8rem;font-weight:800;letter-spacing:.05em;color:#04121b;background:linear-gradient(90deg,var(--brand),var(--brand-2));padding:11px 20px;border-radius:999px;white-space:nowrap}

/* masonry */
.masonry{column-count:4;column-gap:14px;margin:22px 0}
@media(max-width:1000px){.masonry{column-count:3}}
@media(max-width:680px){.masonry{column-count:2}}
@media(max-width:420px){.masonry{column-count:1}}
.tile{break-inside:avoid;position:relative;margin:0 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:block}
.tile img{width:100%;display:block;transition:transform .3s}
.tile:hover img{transform:scale(1.04)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(180deg,transparent,rgba(6,5,12,.9));opacity:0;transition:.25s}
.tile:hover .cap{opacity:1}
.tile .cap .k{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.tile .cap .t{font-size:.82rem;font-weight:700;line-height:1.2;margin-top:2px}
.tile .tag{position:absolute;top:8px;left:8px;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(6,5,12,.7);color:var(--text)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:999;background:rgba(4,3,9,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:86vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .x{position:absolute;top:18px;right:22px;font-size:2rem;color:#fff;cursor:pointer;line-height:1}
</style>
</head>
<body>

<header class="hero"><div class="wrap">
  <span class="eyebrow">The Gallery</span>
  <h1>MOMENTS FROM THE <span>SCENE</span></h1>
  <p>Photos, flyers and art from OC &amp; LA nights. Member uploads coming soon.</p>

  <div class="filters" id="filters">
    <button class="fchip on" data-f="all">All</button>
    <button class="fchip" data-f="photos">📷 Photos</button>
    <button class="fchip" data-f="flyers">🎫 Flyers</button>
    <button class="fchip" data-f="art">🎨 Art</button>
  </div>
</div></header>

<div class="wrap">
  <div class="upload">
    <span class="txt">Got shots from the last night out?<small>Member photo &amp; flyer uploads open when profiles + galleries go live.</small></span>
    <a href="/v3/apply.html#plans">Join to upload &rarr;</a>
  </div>

  <div class="masonry" id="grid"></div>
</div>

<div class="lb" id="lb"><span class="x" id="lbx">&times;</span><img id="lbimg" src="" alt=""/></div>

<script>
var ITEMS=[
  {f:'photos',k:'Warehouse',t:'DTLA warehouse, 2AM',src:'https://images.pexels.com/photos/2111015/pexels-photo-2111015.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'flyers',k:'Flyer',t:'Day Trip 2026',src:'https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Crowd',t:'Hands up, OC',src:'https://images.pexels.com/photos/1763075/pexels-photo-1763075.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'art',k:'Art',t:'Neon poster study',src:'https://images.pexels.com/photos/3113218/pexels-photo-3113218.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Booth',t:'Selector at work',src:'https://images.pexels.com/photos/167636/pexels-photo-167636.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'flyers',k:'Flyer',t:'Warehouse Reign',src:'https://images.pexels.com/photos/2263436/pexels-photo-2263436.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Lights',t:'Laser wash, LA',src:'https://images.pexels.com/photos/1105666/pexels-photo-1105666.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'art',k:'Art',t:'Flyer collage',src:'https://images.pexels.com/photos/1616403/pexels-photo-1616403.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Crowd',t:'Sunset set, SD',src:'https://images.pexels.com/photos/1587927/pexels-photo-1587927.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Stage',t:'Mainstage glow',src:'https://images.pexels.com/photos/787961/pexels-photo-787961.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'flyers',k:'Flyer',t:'Rooftop Sessions',src:'https://images.pexels.com/photos/2114365/pexels-photo-2114365.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'art',k:'Art',t:'PLUR type piece',src:'https://images.pexels.com/photos/3721941/pexels-photo-3721941.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Kandi',t:'Trade before doors',src:'https://images.pexels.com/photos/1190298/pexels-photo-1190298.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Fog',t:'Fog & strobes',src:'https://images.pexels.com/photos/1540406/pexels-photo-1540406.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'flyers',k:'Flyer',t:'Beach Set',src:'https://images.pexels.com/photos/1916827/pexels-photo-1916827.jpeg?auto=compress&cs=tinysrgb&w=700'},
  {f:'photos',k:'Afters',t:'Sunrise afters',src:'https://images.pexels.com/photos/2017111/pexels-photo-2017111.jpeg?auto=compress&cs=tinysrgb&w=700'}
];
var grid=document.getElementById('grid'), F='all';
function render(){
  var list=ITEMS.filter(function(i){return F==='all'||i.f===F;});
  grid.innerHTML=list.map(function(i){
    return '<a class="tile" data-src="'+i.src+'"><span class="tag">'+i.k+'</span>'+
      '<img loading="lazy" src="'+i.src+'" alt="'+i.t+'" onerror="this.closest(\'.tile\').style.display=\'none\'"/>'+
      '<div class="cap"><div class="k">'+i.k+'</div><div class="t">'+i.t+'</div></div></a>';
  }).join('');
}
document.getElementById('filters').addEventListener('click',function(e){
  var b=e.target.closest('.fchip'); if(!b) return;
  F=b.getAttribute('data-f');
  [].forEach.call(this.querySelectorAll('.fchip'),function(x){x.classList.toggle('on',x===b);});
  render();
});
var lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg');
grid.addEventListener('click',function(e){
  var t=e.target.closest('.tile'); if(!t) return; e.preventDefault();
  lbimg.src=t.getAttribute('data-src'); lb.classList.add('on');
});
function closeLb(){lb.classList.remove('on'); lbimg.src='';}
document.getElementById('lbx').addEventListener('click',closeLb);
lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
render();
</script>
<script src="/v3/keepitil-radio.js?v=20260718" defer></script>
<script src="/v3/keepitil-ai.js?v=20260718" defer></script>
<script src="/v3/v3-shell.js?v=20260723" defer></script>
</body>
</html>
