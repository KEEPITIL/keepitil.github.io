<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--green:var(--live);--blue:var(--brand);--gold:#ffd76a;--white:var(--text);--grey:#8a97a4;--head:'Bebas Neue',sans-serif;--body:'Inter',sans-serif;}
  body{background:#0a0a12;color:var(--white);font-family:var(--body);line-height:1.6;}
  a{color:var(--blue);text-decoration:none;}
  header{position:sticky;top:0;z-index:20;background:rgba(9,9,16,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);}
  .hd{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;height:58px;padding:0 20px;}
  .hd .brand{font-family:var(--head);letter-spacing:.16em;font-size:1.15rem;color:#fff;}
  .hd .back{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8aa;}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 20px 80px;}
  .crumbs{font-size:.7rem;color:#5a6570;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px;}
  .crumbs a{color:#7a8a99;}
  .ev{display:grid;grid-template-columns:340px 1fr;gap:32px;}
  @media(max-width:720px){.ev{grid-template-columns:1fr;gap:20px;}}
  .flyer{width:100%;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--surface-2) center/cover no-repeat;border:1px solid rgba(255,255,255,.1);}
  .flyer img{width:100%;height:100%;object-fit:cover;display:block;}
  .eyebrow{font-size:.64rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--green);}
  h1{font-family:var(--head);font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;letter-spacing:.02em;margin:8px 0 12px;}
  .meta{color:var(--grey);font-size:.95rem;margin-bottom:6px;}
  .genre{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:12px;background:rgba(0,180,255,.14);color:var(--brand-2);border:1px solid rgba(0,180,255,.35);margin-bottom:16px;}
  .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 8px;}
  .cta{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;border-radius:9px;transition:filter .2s;}
  .cta-tix{background:var(--green);color:#06120a;}
  .cta-vip{background:rgba(212,160,23,.16);color:var(--gold);border:1px solid rgba(212,160,23,.5);}
  .cta-chat{background:rgba(0,180,255,.16);color:var(--brand-2);border:1px solid rgba(0,180,255,.45);}
  .cta:hover{filter:brightness(1.12);}
  .desc{color:#b6c2ce;font-size:.95rem;line-height:1.75;margin:18px 0;max-width:640px;}
  .ev-left{display:flex;flex-direction:column;gap:16px;}
  .ev-qr{background:var(--surface,#12121c);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center;}
  .ev-qr img{width:180px;height:180px;background:#fff;border-radius:10px;padding:8px;display:block;margin:0 auto;}
  .ev-qr .cap{color:#8a97a4;font-size:.72rem;font-weight:700;letter-spacing:.05em;margin-top:10px;}
  footer{border-top:1px solid rgba(255,255,255,.06);padding:30px 20px;text-align:center;color:#556;font-size:.75rem;}
  /* organizer announcement banners */
  .ann{background:linear-gradient(90deg,rgba(0,180,255,.14),rgba(0,180,255,.04));border:1px solid rgba(0,180,255,.35);border-left:3px solid var(--brand);border-radius:12px;padding:12px 16px;margin-bottom:16px;}
  .ann .t{font-weight:800;font-size:.9rem;color:var(--brand-2);margin-bottom:2px;}
  .ann .b{font-size:.88rem;color:#c8d2dc;line-height:1.5;}
  /* registration / attendee-capture modal */
  .kreg-ov{position:fixed;inset:0;background:rgba(4,4,10,.74);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;}
  .kreg{background:#12121c;border:1px solid rgba(0,180,255,.25);border-radius:16px;max-width:440px;width:100%;padding:24px;max-height:88vh;overflow:auto;}
  .kreg h3{font-family:var(--head);font-size:1.5rem;letter-spacing:.06em;margin-bottom:4px;}
  .kreg p.sub{color:var(--grey);font-size:.82rem;margin-bottom:8px;}
  .kreg label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9aa7b4;margin:12px 0 5px;}
  .kreg input{width:100%;background:#0a0a12;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:11px 12px;color:#fff;font:inherit;}
  .kreg input:focus{outline:none;border-color:var(--brand);}
  .kreg .req{color:#ff6b6b;}
  .kreg .go{margin-top:18px;width:100%;background:var(--green);color:#06120a;border:0;border-radius:9px;padding:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font:inherit;}
  .kreg .go:disabled{opacity:.6;cursor:default;}
  .kreg .x{float:right;background:none;border:0;color:#889;font-size:1.5rem;cursor:pointer;line-height:1;}
  .kreg .err{color:#ff6b6b;font-size:.8rem;margin-top:10px;min-height:1em;}
</style>
</head>
<body>
<header id="main-nav"><div class="hd"><a href="/v3/" class="brand">⚡ KEEPITIL</a> <a class="back" id="ev-back" href="/v3/">&larr; My events</a></div></header>
<div class="wrap">
  <div class="crumbs"><a href="/v3/">Home</a> › <a href="/v3/">Events</a> › <span id="cr-title">Event</span></div>
  <div id="ev-ann"></div>
  <div class="ev">
    <div class="ev-left">
      <div class="flyer" id="ev-flyer"></div>
      <div class="ev-qr" id="ev-qr" style="display:none"></div>

      <div class="meta" id="ev-venue"></div>

      <p class="desc" id="ev-desc" style="display:none"></p>
    </div>
  </div>
</div>
<footer>© 2026 KEEPITIL — OC · LA · San Diego events, artists &amp; culture. <a href="/v3/">keepitil.com</a></footer>
<script>
(function(){
  var URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
  var p=new URLSearchParams(location.search);
  function g(k){return p.get(k)||'';}
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function fmt(d){ if(!d) return ''; var a=d.split('-'); if(a.length<3) return d; var dt=new Date(Date.UTC(+a[0],+a[1]-1,+a[2])); return DOW[dt.getUTCDay()]+', '+MON[+a[1]-1]+' '+(+a[2])+', '+a[0]; }
  var ev={
    slug:g('e'), title:g('t')||'KEEPITIL Event', venue:g('v'), city:g('c'),
    date:g('d'), genre:g('g'), img:g('img'), ticket:g('tix'), price:g('pr'), vip:g('vip')==='1'
  };
  var buyerEmail='';  /* logged-in buyer's account email — pre-fills checkout so the ticket links to their account */
  function paint(){
    var titledate = ev.title + (ev.date? (' — '+fmt(ev.date)) : '');
    var loc = [ev.venue, ev.city].filter(Boolean).join(', ');
    var descTxt = ev.title + (loc?(' at '+loc):'') + (ev.date?(' on '+fmt(ev.date)):'') + (ev.genre?(' · '+ev.genre):'') + '. Save it on KEEPITIL, join the scene room, and grab tickets.';
    document.title = titledate + ' | KEEPITIL';
    $('m-desc').setAttribute('content', descTxt);
    $('og-title').setAttribute('content', titledate + ' | KEEPITIL');
    $('og-desc').setAttribute('content', descTxt);
    if(ev.img) $('og-img').setAttribute('content', ev.img);
    var canon=(location.hostname==='keepitil.com')?location.href:('https://keepitil.com'+location.pathname+location.search);
    $('m-canon').setAttribute('href', canon); $('og-url').setAttribute('content', canon);
    $('cr-title').textContent = ev.title;
    $('ev-title').textContent = ev.title;
    $('ev-date').textContent = fmt(ev.date);
    $('ev-venue').textContent = loc ? ('📍 '+loc) : '';
    if(ev.genre){ var gp=$('ev-genre'); gp.textContent=ev.genre; gp.style.display='inline-block'; }
    if(ev.img) $('ev-flyer').style.backgroundImage='url('+ev.img.replace(/"/g,'')+')';
    /* show a REAL organizer description only; the generic filler is dropped from the page */
    var _rd=ev.description||''; var _de=$('ev-desc'); if(_de){ if(_rd){ _de.textContent=_rd; _de.style.display=''; } else { _de.style.display='none'; } }
    /* shareable event QR — scan to open this event page (works on flyers/print) */
    var _qe=$('ev-qr'); if(_qe){ var _qu=(location.hostname==='keepitil.com')?location.href:('https://keepitil.com/v3/event.html?e='+encodeURIComponent(ev.slug||'')); _qe.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data='+encodeURIComponent(_qu)+'" width="180" height="180" alt="Scan to open this event"/><div class="cap">📱 Scan to open &amp; share</div>'; _qe.style.display=''; }
    // CTAs
    var c='';
    if(ev.ticket && ev.ticket!=='#') c+='<a class="cta cta-tix" data-kt="ticket_click" data-event-slug="'+esc(ev.slug)+'" href="'+esc(ev.ticket)+'" target="_blank" rel="noopener">🎟 Buy Tickets</a>';
    if(ev.vip && ev.ticket) c+='<a class="cta cta-vip" data-kt="vip_click" data-event-slug="'+esc(ev.slug)+'" href="'+esc(ev.ticket)+'" target="_blank" rel="noopener">🍾 Book VIP Table</a>';
    c+='<a class="cta cta-chat" data-kt="chat_join" data-event-slug="'+esc(ev.slug)+'" href="event-chat.html?e='+encodeURIComponent(ev.slug)+'&t='+encodeURIComponent(ev.title)+'">💬 Join Scene Room</a>';
    $('ev-ctas').innerHTML=c;
    // JSON-LD
    var ld={"@context":"https://schema.org","@type":"MusicEvent","name":ev.title,"url":canon,"eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode"};
    if(ev.date) ld.startDate=ev.date+"T20:00:00-07:00";
    if(ev.img) ld.image=ev.img;
    if(ev.venue) ld.location={"@type":"Place","name":ev.venue,"address":{"@type":"PostalAddress","addressLocality":ev.city||"Los Angeles","addressRegion":"CA","addressCountry":"US"}};
    if(ev.ticket && ev.ticket!=='#') ld.offers={"@type":"Offer","url":ev.ticket,"availability":"https://schema.org/InStock"};
    ld.organizer={"@type":"Organization","name":"KEEPITIL","url":"https://keepitil.com/"};
    $('ld-event').textContent=JSON.stringify(ld);
  }
  /* attendee-data capture: name + email + organizer's custom questions → event_registrations. Fail-open (never blocks a sale). */
  function regCapture(tierName, showPromo, done){
    var reg=Array.isArray(ev.reg)?ev.reg:[];
    var ov=document.createElement('div'); ov.className='kreg-ov';
    var qh='';
    reg.forEach(function(q,i){
      var t=({email:'email',number:'number',tel:'tel'})[q.type]||'text';
      qh+='<label>'+esc(q.label)+(q.required?' <span class="req">*</span>':'')+'</label><input data-qi="'+i+'" type="'+t+'"'+(q.required?' data-req="1"':'')+'/>';
    });
    var promoH=showPromo?'<label>Promo code <span style="text-transform:none;font-weight:400;color:#8a97a4">(optional)</span></label><input id="kr-promo" type="text" placeholder="EARLYBIRD" style="text-transform:uppercase"/>':'';
    ov.innerHTML='<div class="kreg"><button class="x" aria-label="Close">&times;</button>'+
      '<h3>Almost there</h3><p class="sub">Confirm your details'+(tierName?(' for <b>'+esc(tierName)+'</b>'):'')+'. Your info goes to the event organizer.</p>'+
      '<label>Full name <span class="req">*</span></label><input id="kr-name" type="text" autocomplete="name"/>'+
      '<label>Email <span class="req">*</span></label><input id="kr-email" type="email" autocomplete="email" value="'+esc(buyerEmail||'')+'"'+(buyerEmail?' readonly style="opacity:.75"':'')+'/>'+
      qh+promoH+'<div class="err" id="kr-err"></div><button class="go" id="kr-go">Continue</button></div>';
    document.body.appendChild(ov);
    function close(){ ov.remove(); }
    ov.querySelector('.x').addEventListener('click',close);
    ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
    ov.querySelector('#kr-go').addEventListener('click',function(){
      var name=(ov.querySelector('#kr-name').value||'').trim();
      var email=(ov.querySelector('#kr-email').value||'').trim();
      var er=ov.querySelector('#kr-err'); er.textContent='';
      if(!name){ er.textContent='Please enter your name.'; return; }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ er.textContent='Please enter a valid email.'; return; }
      var answers={}, bad=null;
      ov.querySelectorAll('input[data-qi]').forEach(function(inp){
        var i=inp.getAttribute('data-qi'), v=(inp.value||'').trim();
        if(inp.getAttribute('data-req')&&!v&&bad===null) bad=reg[i].label;
        if(v) answers[reg[i].label]=v;
      });
      if(bad){ er.textContent='Please answer: '+bad; return; }
      var promo=showPromo?(((ov.querySelector('#kr-promo')||{}).value||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'')||null):null;
      var go=ov.querySelector('#kr-go'); go.disabled=true; go.textContent='Saving…';
      var rec={ event_slug:ev.slug, buyer_email:email, buyer_name:name, answers:Object.keys(answers).length?answers:null };
      if(ev.id) rec.event_id=ev.id;
      function proceed(){ close(); if(done) done(promo); }
      try{ Promise.resolve(sb.from('event_registrations').insert(rec)).then(proceed, proceed); }catch(e){ proceed(); }
    });
  }
  paint();
  /* back button → the logged-in user's own profile Events section (not "all events") */
  try{ if(window.supabase){ var _bsb=window.supabase.createClient(URL,KEY); _bsb.auth.getSession().then(function(sr){ var s=sr&&sr.data?sr.data.session:null; var bk=document.getElementById('ev-back'); if(!bk||!s) return; _bsb.rpc('my_profile_slug').then(function(rr){ if(rr&&!rr.error&&rr.data){ bk.setAttribute('href','/v3/u.html?slug='+encodeURIComponent(rr.data)+'&tab=shows'); } },function(){}); }); } }catch(e){}
  /* returned from a successful checkout → surface the in-account ticket */
  if(p.get('paid')==='1'){ try{ var _ann=document.getElementById('ev-ann'); if(_ann){ var _d=document.createElement('div'); _d.className='ann'; _d.style.cssText='border-left-color:#22e39b;background:linear-gradient(90deg,rgba(34,227,155,.14),rgba(34,227,155,.04));border-color:rgba(34,227,155,.4)'; _d.innerHTML='<div class="t" style="color:#22e39b">🎟 You\'re in!</div><div class="b">Your ticket is confirmed and saved to your account. <a href="/v3/tickets.html" style="color:#22e39b;font-weight:800">View your ticket →</a></div>'; _ann.parentNode.insertBefore(_d,_ann); } }catch(e){} }
  // Enhance from DB if the event exists there (richer/authoritative)
  try{
    if(window.supabase && ev.slug){
      var sb=window.supabase.createClient(URL,KEY);
      sb.rpc('get_event_view',{p_slug:ev.slug}).then(function(r){
        if(r&&r.data&&r.data[0]){ var x=r.data[0];
          ev.title=x.title||ev.title; ev.venue=x.venue||ev.venue; ev.city=x.city||ev.city;
          ev.date=(x.starts_at||'').slice(0,10)||ev.date; ev.genre=x.genres||ev.genre;
          ev.img=x.cover_url||ev.img; ev.description=x.description||ev.description;
          ev.id=x.id; ev.reg=Array.isArray(x.reg_questions)?x.reg_questions:[];
          paint();
          /* organizer on-site announcements (public read) */
          sb.from('event_announcements').select('title,body,active,created_at').eq('event_slug',ev.slug).eq('active',true).order('created_at',{ascending:false}).then(function(ar){
            if(ar&&ar.data&&ar.data.length){ var box=document.getElementById('ev-ann'); if(box){ box.innerHTML=ar.data.map(function(a){ return '<div class="ann">'+(a.title?'<div class="t">'+esc(a.title)+'</div>':'')+'<div class="b">'+esc(a.body)+'</div></div>'; }).join(''); } }
          }).catch(function(){});
          /* render ticket tiers (each with its Stripe Payment Link) before the Scene Room CTA */
          sb.from('ticket_tiers').select('*').eq('event_id',x.id).order('sort').then(function(tr){
            if(tr&&tr.data&&tr.data.length){
              var box=$('ev-ctas'), pre='';
              tr.data.forEach(function(t){
                var pl = t.price_cents>0 ? ('$'+(t.price_cents/100).toFixed(2).replace(/\.00$/,'')) : 'Free';
                var base='<button class="cta cta-tix" style="border:0;cursor:pointer;font:inherit" data-tname="'+esc(t.name)+'" data-event-slug="'+esc(ev.slug)+'"';
                if(t.price_cents>0){
                  if(t.stripe_payment_link){ /* direct Stripe Payment Link — works with no backend (resilient to Edge Function outages) */
                    pre+=base+' data-kt="ticket_click" data-buy="'+esc(t.stripe_payment_link)+'">🎟 '+esc(t.name)+' — '+pl+'</button>';
                  } else { /* KEEPITIL Connect checkout (auto 5% + $0.99 fee split via create-checkout) */
                    pre+=base+' data-kt="ticket_click" data-tier="'+t.id+'">🎟 '+esc(t.name)+' — '+pl+'</button>';
                  }
                }
                else { pre+=base+' data-kt="rsvp" data-free="1">🎟 '+esc(t.name)+' — RSVP Free</button>'; }
              });
              if(tr.data.some(function(t){return t.price_cents>0;})) pre+='<div style="font-size:.72rem;opacity:.6;margin:8px 0 0;flex-basis:100%">By purchasing you agree to the <a href="/v3/ticket-terms.html" style="color:var(--brand-2)">Ticket Terms</a> &amp; <a href="/v3/refund.html" style="color:var(--brand-2)">Refund Policy</a>.</div>';
              box.innerHTML = pre + box.innerHTML;
              /* every ticket/RSVP button first captures attendee data (name + email + custom questions), then proceeds to checkout / confirms RSVP */
              box.querySelectorAll('.cta-tix[data-tier],.cta-tix[data-buy],.cta-tix[data-free]').forEach(function(btn){
                btn.addEventListener('click', async function(){
                  /* require an account to get a ticket — tickets live in the buyer's KEEPITIL account (My Tickets) */
                  var sr=await sb.auth.getSession().catch(function(){return null;});
                  var sess=sr&&sr.data?sr.data.session:null;
                  if(!sess){ location.href='/v3/apply.html?next='+encodeURIComponent(location.pathname+location.search); return; }
                  buyerEmail=(sess.user&&sess.user.email)||'';
                  var tname=btn.getAttribute('data-tname')||'';
                  /* promo UI gated OFF until create-checkout applies discount_code server-side (Supabase Functions UI is mid-incident). Plumbing stays wired; flip to btn.hasAttribute('data-tier') to enable. */
                  regCapture(tname, false, function(promo){
                    if(btn.hasAttribute('data-free')){ btn.textContent='✓ You’re on the list'; btn.disabled=true; btn.style.opacity=.7; return; }
                    if(btn.hasAttribute('data-buy')){ window.open(btn.getAttribute('data-buy'),'_blank','noopener'); return; }
                    /* Stripe Connect checkout: POST create-checkout and redirect to hosted checkout (auto 5% + $0.99 split; optional promo code) */
                    btn.disabled=true; var old=btn.textContent; btn.textContent='Loading…';
                    fetch(URL+'/functions/v1/create-checkout',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({tier_id:btn.getAttribute('data-tier'),quantity:1,discount_code:promo||null})})
                      .then(function(r){return r.json();})
                      .then(function(d){ if(d&&d.url){ location.href=d.url; } else { btn.disabled=false; btn.textContent=old; alert(d&&d.error?('Tickets: '+d.error):'Could not start checkout.'); } })
                      .catch(function(){ btn.disabled=false; btn.textContent=old; alert('Could not start checkout — please try again.'); });
                  });
                });
              });
              /* KILL SWITCH (client): platform_config.ticketing_enabled='0' disables PAID buy buttons + shows a paused notice (free RSVP stays open). Fail-open on read error; create-checkout enforces it server-side regardless. */
              sb.from('platform_config').select('value').eq('key','ticketing_enabled').maybeSingle().then(function(cfgr){
                if(cfgr&&cfgr.data&&String(cfgr.data.value)==='0'){
                  box.querySelectorAll('.cta-tix[data-tier],.cta-tix[data-buy]').forEach(function(b){ b.disabled=true; b.style.opacity=.5; b.style.cursor='default'; });
                  var n=document.createElement('div'); n.style.cssText='font-size:.74rem;opacity:.8;margin:8px 0 0;flex-basis:100%'; n.textContent='⏸ Ticket sales are temporarily paused. Check back soon.'; box.appendChild(n);
                }
              }).catch(function(){});
            }
          }).catch(function(){});
        }
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
