<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" href="/v3/logo-blue-nav.png"/>
<title>My Ticket — KEEPITIL</title>
<meta name="description" content="Your KEEPITIL ticket — flyer, QR code, event info and the live event chat."/>
<link rel="stylesheet" href="/v3/v3-tokens.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text);font-family:var(--font,Inter,sans-serif);line-height:1.5;padding:22px 0 40px}
.tp{max-width:1000px;margin:0 auto;padding:0 16px}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.gate,.empty{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center}
.gate h2,.empty h2{font-size:1.3rem;font-weight:800;margin-bottom:8px}.gate p,.empty p{color:var(--muted);margin-bottom:18px}
.btnp{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:13px 22px;border-radius:999px;text-decoration:none;cursor:pointer;border:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#04121b}
.card{background:#000;border-radius:20px;padding:12px}
.tp-head{display:grid;grid-template-columns:var(--lcol,30%) 1fr;gap:12px;margin-bottom:12px}
.pill{display:flex;align-items:center;background:var(--surface,#15151f);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
/* Profile back button — neon + transparent, like the LOGIN button; fills the flyer column */
.backbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;border:1.5px solid var(--brand,#00b4ff);border-radius:12px;padding:12px 16px;color:var(--brand,#00b4ff);text-decoration:none;font-weight:800;font-size:.9rem;letter-spacing:.02em;white-space:nowrap}
.backbtn:hover{background:color-mix(in srgb,var(--brand,#00b4ff) 12%,transparent)}
/* Organizer button — neon-blue outline, display name only */
.orgbar{width:100%;justify-content:center;gap:6px;background:transparent;border:1.5px solid var(--brand,#00b4ff);border-radius:12px;padding:12px 16px;text-align:center}
.orgbar a,.orgbar span{color:var(--brand,#00b4ff);font-weight:800;text-decoration:none;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-body{display:grid;grid-template-columns:var(--lcol,30%) 1fr;gap:14px;align-items:stretch}
.tp-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.flyer{aspect-ratio:9/16;width:100%;flex:0 0 auto;border-radius:14px;background:#0a0a12 center/cover no-repeat;border:1px solid var(--line)}
.qrcard{flex:0 0 auto;width:100%;background:var(--surface,#15151f);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.qrcard img{width:100%;max-width:none;aspect-ratio:1/1;background:#fff;border-radius:12px;padding:12px;display:block}
.qrcard .cap{color:var(--muted);font-size:.7rem;margin-top:8px;font-weight:700;letter-spacing:.03em}
.qrcard .tag{display:inline-block;margin-top:6px;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.qrcard .tag.paid{background:rgba(34,227,155,.14);color:#22e39b;border:1px solid rgba(34,227,155,.4)}
.qrcard .tag.used{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.infocard{flex:0 0 auto;position:relative;background:var(--surface,#15151f);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.buymore{position:absolute;top:16px;right:16px;height:2.1rem;display:inline-flex;align-items:center;background:#6d3bf5;color:#fff;font-weight:800;font-size:.82rem;letter-spacing:.03em;text-align:center;text-decoration:none;border-radius:10px;padding:0 16px}
.buymore:hover{filter:brightness(1.1)}
.infocard h1{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;line-height:1;letter-spacing:.02em;color:#fff;margin:0 140px 10px 0}
.irow{display:flex;gap:8px;font-size:.82rem;padding:3px 0}
.irow .k{color:var(--muted);flex:0 0 auto;min-width:96px}
.irow .v{color:var(--text);font-weight:600;min-width:0}
.irow .v a{color:var(--brand-2,#22e39b)}
/* expandable "all your tickets" picker */
.tixhead{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 13px;border:1.5px solid rgba(0,180,255,.45);background:rgba(0,180,255,.09);border-radius:11px;cursor:pointer;transition:background .15s}
.tixhead:hover{background:rgba(0,180,255,.16)}
.tixhead .th-k{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-2,#22e39b);flex:0 0 auto}
.tixhead .th-v{font-size:.85rem;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tixhead .chev{color:var(--brand-2,#22e39b);font-weight:900;font-size:.9rem;flex:0 0 auto}
.tixlist{flex-direction:column;gap:7px;margin-top:8px}
.tixpick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface,#15151f);transition:border-color .15s,background .15s}
.tixpick:hover{border-color:var(--brand-2,#22e39b)}
.tixpick.on{border-color:var(--brand-2,#22e39b);background:rgba(0,180,255,.12)}
.tixpick .tp-n{font-weight:800;font-size:.86rem;color:#fff;flex:1;min-width:0}
.tixpick .tp-q{font-size:.76rem;color:var(--muted)}
.tixpick .tp-p{font-weight:800;font-size:.84rem;color:var(--brand-2,#22e39b);min-width:44px;text-align:right}
.tixpick .tp-e{flex-basis:100%;font-size:.68rem;color:var(--muted)}
.chatcard{flex:1 1 0;min-height:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0a12;display:flex}
.chatcard iframe{flex:1;width:100%;border:0;display:block}
.open-chat{display:none;width:100%;padding:15px;border-radius:14px;border:1px solid rgba(0,180,255,.4);background:rgba(0,180,255,.12);color:var(--brand-2,#22e39b);font-weight:800;font-size:.95rem;cursor:pointer;align-items:center;justify-content:center;gap:9px}
.tp-foot{margin-top:12px}
.tp-foot .pill{display:inline-flex}
.carwrap{max-width:1120px;margin:26px auto 0;padding:0 16px}
.carwrap .car-h{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 2px 12px;display:flex;align-items:center;gap:10px}
.carwrap .car-h::after{content:"";flex:1;height:1px;background:var(--line)}
.car{position:relative}
.car-row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.car-row::-webkit-scrollbar{display:none}
.car-card{position:relative;flex:0 0 200px;width:200px;aspect-ratio:2/3;background:#0a0a12;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}
.car-card:hover{transform:translateY(-4px);border-color:var(--brand,#00b4ff)}
.car-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.car-card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 4%,rgba(0,0,0,.35) 40%,transparent 68%)}
.car-card .cdate{position:absolute;top:0;left:0;right:0;padding:6px 11px;font-size:.6rem;font-weight:800;letter-spacing:.05em;color:#06120a;background:linear-gradient(90deg,rgba(0,255,136,.97),rgba(0,200,120,.55))}
.car-card .cbody{position:absolute;left:0;right:0;bottom:0;padding:12px}
.car-card .ct{color:#fff;font-weight:800;font-size:.92rem;line-height:1.15}
.car-card .cc{color:rgba(255,255,255,.82);font-size:.72rem;margin-top:2px}
.car-arrow{position:absolute;top:calc(50% - 6px);z-index:6;width:34px;height:34px;border-radius:50%;background:rgba(12,12,22,.94);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:1.35rem;cursor:pointer;display:none;align-items:center;justify-content:center}
.car-arrow:hover{border-color:var(--brand,#00b4ff);color:var(--brand,#00b4ff)}
.car-arrow.prev{left:-6px}.car-arrow.next{right:-6px}
.car.scrollable .car-arrow{display:flex}
@media(max-width:760px){
  .tp-body{grid-template-columns:1fr}
  .flyer{aspect-ratio:9/16;flex:0 0 auto;max-width:340px;margin:0 auto;width:100%}
  .qrcard{flex:0 0 auto}
  .chatcard{display:none}
  .open-chat{display:flex}
  .tp-head{grid-template-columns:1fr}
  .car.scrollable .car-arrow{display:none}
}
.chat-ov{position:fixed;inset:0;z-index:3000;background:#0a0a12;display:none;flex-direction:column}
.chat-ov.open{display:flex}
.chat-ov .ovh{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px;background:rgba(9,9,16,.98);border-bottom:1px solid rgba(255,255,255,.1)}
.chat-ov .ovh .bk{font-size:1.7rem;color:#fff;background:none;border:0;cursor:pointer;padding:2px 10px 6px}
.chat-ov .ovh .ovt{font-weight:800;font-size:.95rem}
.chat-ov iframe{flex:1;width:100%;border:0}
</style>
</head>
<body>
<div class="tp">
  <div class="loading" id="loading">Loading your ticket…</div>
  <div class="gate" id="gate" style="display:none">
    <h2>Log in to see your ticket</h2><p>Your tickets live in your KEEPITIL account.</p>
    <a class="btnp" id="loginBtn" href="/v3/apply.html">Log in / Join</a>
  </div>
  <div class="empty" id="empty" style="display:none">
    <h2>No tickets yet</h2><p>When you grab a ticket, it shows up here with your QR code and the event chat.</p>
    <a class="btnp" href="/v3/">Browse events</a>
  </div>
  <div id="ticketview" style="display:none"></div>
</div>
<div class="carwrap" id="carwrap" style="display:none"></div>

<div class="chat-ov" id="chatOv">
  <div class="ovh"><button class="bk" aria-label="Back" onclick="closeChat()">&larr;</button><span class="ovt" id="ovTitle">Event Chat</span></div>
  <iframe id="ovFrame" title="Event chat" src="about:blank"></iframe>
</div>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function enc(s){return encodeURIComponent(String(s==null?'':s));}
function fmtDate(iso){ if(!iso)return ''; var d=new Date(iso); if(isNaN(d))return ''; return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function fmtTime(iso){ if(!iso)return ''; var d=new Date(iso); if(isNaN(d))return ''; return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function shortDate(iso){ if(!iso)return ''; var d=new Date(iso); if(isNaN(d))return ''; return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

var TIX=[], ACTIVE=0, BACK='/v3/', EXPANDED=false;
function toggleTix(){ EXPANDED=!EXPANDED; var el=document.getElementById('tixlist'); var cv=document.getElementById('tixchev'); if(el) el.style.display=EXPANDED?'flex':'none'; if(cv) cv.textContent=EXPANDED?'▴':'▾'; }

function render(){
  var x=TIX[ACTIVE]; if(!x) return; var e=x.row;
  var flyerBg=e.cover_url?("background-image:url('"+String(e.cover_url).replace(/'/g,'')+"')"):"";
  var org = e.owner_handle ? ('<a href="/v3/u.html?slug='+enc(e.owner_handle)+'">'+esc(e.owner_name||e.owner_handle)+'</a>') : '<span>KEEPITIL Event</span>';
  var used=!!e.checked_in_at;
  var price=e.price_cents!=null?('$'+(e.price_cents/100).toFixed(2).replace(/\.00$/,'')):'';
  var qr='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+enc('KIL-'+(e.qr_token||e.order_id));
  var chatUrl='/v3/event-chat.html?embed=1&e='+enc(x.slug)+'&t='+enc(x.title);
  var loc=[e.venue,e.city].filter(Boolean).join(', ');
  var maps=loc?('<a href="https://www.google.com/maps/search/?api=1&query='+enc(loc)+'" target="_blank" rel="noopener">'+esc(loc)+' ↗</a>'):'—';
  var dt=fmtDate(e.starts_at)+(fmtTime(e.starts_at)?(' · '+fmtTime(e.starts_at)):'');
  /* expandable picker — only the tickets this buyer holds FOR THIS EVENT */
  var sameTix=TIX.map(function(tk,i){return {tk:tk,i:i};}).filter(function(o){return o.tk.row.event_id===e.event_id;});
  var tixItems=sameTix.map(function(o){
    var er=o.tk.row, i=o.i; var pr=er.price_cents!=null?('$'+(er.price_cents/100).toFixed(2).replace(/\.00$/,'')):'Free';
    return '<div class="tixpick'+(i===ACTIVE?' on':'')+'" onclick="setActive('+i+')">'+
      '<span class="tp-n">'+esc(er.tier_name||'General Admission')+'</span>'+
      '<span class="tp-q">Qty '+(er.qty||1)+'</span>'+
      '<span class="tp-p">'+esc(pr)+'</span>'+
      '</div>';
  }).join('');
  var tixCount=sameTix.length;
  var totQty=0, totCents=0; sameTix.forEach(function(o){ var er=o.tk.row; var q=er.qty||1; totQty+=q; totCents+=(er.price_cents||0)*q; });
  var totPrice='$'+(totCents/100).toFixed(2).replace(/\.00$/,'');

  $('ticketview').innerHTML=
  '<div class="card">'+
    '<div class="tp-head">'+
      '<a class="backbtn" href="'+BACK+'">&larr; Profile</a>'+
      '<div class="orgbar">'+org+'</div>'+
    '</div>'+
    '<div class="tp-body">'+
      '<div class="tp-col">'+
        '<div class="flyer" style="'+flyerBg+'"></div>'+
        '<div class="qrcard"><img src="'+qr+'" alt="Ticket QR code"'+(used?' style="opacity:.4;filter:grayscale(1)"':'')+'/><div class="cap">'+(used?'Already scanned':'Scan at the door')+'</div></div>'+
      '</div>'+
      '<div class="tp-col">'+
        '<div class="infocard">'+
          '<a class="buymore" href="/v3/event.html?e='+enc(x.slug)+'">BUY TICKETS</a>'+
          '<h1>'+esc(e.title||'Event')+'</h1>'+
          '<div class="irow"><span class="k">Date</span><span class="v">'+esc(dt)+'</span></div>'+
          '<div class="irow"><span class="k">Venue</span><span class="v">'+esc(e.venue||'—')+'</span></div>'+
          '<div class="irow"><span class="k">Address</span><span class="v">'+maps+'</span></div>'+
          '<div class="irow"><span class="k">Genre</span><span class="v">'+esc(e.genres||'—')+'</span></div>'+
          '<div class="tixhead" onclick="toggleTix()"><span class="th-k">Your tickets</span><span class="th-v">'+totQty+' ticket'+(totQty===1?'':'s')+' · '+totPrice+'</span><span class="chev" id="tixchev">'+(EXPANDED?'▴':'▾')+'</span></div>'+
          '<div class="tixlist" id="tixlist" style="display:'+(EXPANDED?'flex':'none')+'">'+tixItems+'</div>'+
        '</div>'+
        '<div class="chatcard"><iframe src="'+chatUrl+'" loading="lazy" title="Event chat"></iframe></div>'+
        '<button class="open-chat" onclick="openChat()">Open Event Chat</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  var others=TIX.filter(function(_,i){return i!==ACTIVE;});
  if(others.length){
    $('carwrap').style.display='';
    $('carwrap').innerHTML='<div class="car-h">More of your tickets</div>'+
      '<div class="car" id="car"><button class="car-arrow prev" aria-label="Previous" onclick="carScroll(-1)">&lsaquo;</button><div class="car-row" id="car-row">'+
      TIX.map(function(t,i){ if(i===ACTIVE) return ''; var ee=t.row;
        var im=ee.cover_url?'<img src="'+esc(ee.cover_url)+'" alt="" onerror="this.style.display=\'none\'">':'';
        return '<div class="car-card" onclick="setActive('+i+')">'+im+'<div class="shade"></div><div class="cdate">'+esc(shortDate(ee.starts_at)||'TICKET')+'</div><div class="cbody"><div class="ct">'+esc(ee.title||'Event')+'</div><div class="cc">'+esc(ee.city||'')+'</div></div></div>';
      }).join('')+'</div><button class="car-arrow next" aria-label="Next" onclick="carScroll(1)">&rsaquo;</button></div>';
    carMark();
  } else { $('carwrap').style.display='none'; }
}
function carScroll(d){ var row=$('car-row'); if(!row)return; var c=row.querySelector('.car-card'); var w=c?(c.offsetWidth+14)*Math.max(1,Math.floor(row.clientWidth/(c.offsetWidth+14))):320; row.scrollBy({left:d*w,behavior:'smooth'}); }
function carMark(){ var car=$('car'),row=$('car-row'); if(!car||!row)return; function u(){ var sc=row.scrollWidth-row.clientWidth>4; car.classList.toggle('scrollable',sc); var p=car.querySelector('.prev'),n=car.querySelector('.next'); if(p)p.disabled=row.scrollLeft<=2; if(n)n.disabled=row.scrollLeft>=row.scrollWidth-row.clientWidth-2; } u(); row.onscroll=u; }
function setActive(i){ if(i<0||i>=TIX.length)return; ACTIVE=i; render(); window.scrollTo({top:0,behavior:'smooth'}); if($('chatOv').classList.contains('open')) openChat(); }
function openChat(){ var x=TIX[ACTIVE]; if(!x)return; $('ovTitle').textContent=x.title||'Event Chat'; $('ovFrame').src='/v3/event-chat.html?embed=1&e='+enc(x.slug)+'&t='+enc(x.title); $('chatOv').classList.add('open'); document.body.style.overflow='hidden'; }
function closeChat(){ $('chatOv').classList.remove('open'); $('ovFrame').src='about:blank'; document.body.style.overflow=''; }

async function init(){
  if(!supa){ $('loading').style.display='none'; $('gate').style.display='block'; return; }
  var b=$('loginBtn'); if(b) b.href='/v3/apply.html?next='+encodeURIComponent(location.pathname+location.search);
  var r=await supa.auth.getSession().catch(function(){return null;});
  var s=r&&r.data?r.data.session:null;
  if(!s){ $('loading').style.display='none'; $('gate').style.display='block'; return; }
  try{ var ps=await supa.rpc('my_profile_slug'); if(ps&&!ps.error&&ps.data){ BACK='/v3/u.html?slug='+enc(ps.data)+'&tab=shows'; } }catch(e){}
  try{
    var o=await supa.rpc('get_my_tickets'); var rows=(o&&o.data)||[];
    if(!rows.length){ $('loading').style.display='none'; $('empty').style.display='block'; return; }
    TIX=rows.map(function(x){ return {row:x, slug:(x.slug||('event-'+x.event_id)), title:(x.title||'Event')}; });
    var want=new URLSearchParams(location.search).get('e');
    if(want){ var idx=TIX.findIndex(function(x){return x.slug===want;}); if(idx>=0) ACTIVE=idx; }
    $('loading').style.display='none'; $('ticketview').style.display='block';
    render();
  }catch(err){ $('loading').textContent='Could not load your ticket. Please refresh.'; }
}
init();
</script>
<script src="/v3/keepitil-radio.js?v=20260716" defer></script>
</body>
</html>
