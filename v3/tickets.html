<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" href="/v3/logo-blue-nav.png"/>
<title>My Ticket — KEEPITIL</title>
<meta name="description" content="Your KEEPITIL ticket — flyer, QR code, event info and the live event chat."/>
<link rel="stylesheet" href="/v3/v3-tokens.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text);font-family:var(--font,Inter,sans-serif);line-height:1.5;padding-bottom:60px}
.tp{max-width:900px;margin:0 auto;padding:0 18px}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.gate,.empty{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center}
.gate h2,.empty h2{font-size:1.3rem;font-weight:800;margin-bottom:8px}.gate p,.empty p{color:var(--muted);margin-bottom:18px}
.btnp{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:13px 22px;border-radius:999px;text-decoration:none;cursor:pointer;border:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#04121b}
.tp-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch;margin:22px 0 14px}
.backbtn{display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:.9rem;white-space:nowrap}
.backbtn:hover{border-color:var(--brand,#00b4ff)}
.orgbar{display:flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.orgbar a,.orgbar span{color:var(--brand-2,#22e39b);font-weight:800;text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgbar .lead{color:var(--muted);font-weight:600;margin-right:6px;font-size:.8rem}
.tp-body{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:16px;align-items:start}
.tp-left,.tp-right{display:flex;flex-direction:column;gap:16px;min-width:0}
.flyer{width:100%;aspect-ratio:3/4;border-radius:16px;background:#0a0a12 center/cover no-repeat;border:1px solid var(--line)}
.qrcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.qrcard img{width:100%;max-width:180px;background:#fff;border-radius:12px;padding:8px;margin:0 auto;display:block}
.qrcard .cap{color:var(--muted);font-size:.72rem;margin-top:10px;font-weight:700;letter-spacing:.04em}
.qrcard .tag{display:inline-block;margin-top:8px;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.qrcard .tag.paid{background:rgba(34,227,155,.14);color:#22e39b;border:1px solid rgba(34,227,155,.4)}
.qrcard .tag.used{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.infocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.infocard .eb{font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8fd6ff}
.infocard h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1.02;letter-spacing:.02em;color:#fff;margin:4px 0 6px}
.infocard .meta{color:var(--muted);font-size:.9rem;margin-bottom:2px}
.infocard .genre{display:inline-block;margin:8px 0 12px;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:12px;background:rgba(0,180,255,.14);color:var(--brand-2,#22e39b);border:1px solid rgba(0,180,255,.35)}
.infocard .row{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.infocard .row span{color:var(--muted)}.infocard .row b{color:var(--text)}
.chatcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a0a12;min-height:440px}
.chatcard .clbl{padding:12px 16px;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2,#22e39b);border-bottom:1px solid rgba(255,255,255,.07)}
.chatcard iframe{flex:1;width:100%;border:0;display:block;min-height:400px}
.open-chat{width:100%;padding:15px;border-radius:14px;border:1px solid rgba(0,180,255,.4);background:rgba(0,180,255,.12);color:var(--brand-2,#22e39b);font-weight:800;font-size:.95rem;cursor:pointer;display:none;align-items:center;justify-content:center;gap:9px}
.tp-foot{margin-top:16px}
.others{margin-top:26px}
.others-h{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 2px 10px}
.other{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.other:hover{border-color:var(--brand,#00b4ff)}
.other img{width:44px;height:58px;border-radius:7px;object-fit:cover;background:#0a0a12;flex:0 0 44px}
.other .ot{color:#fff;font-weight:700;font-size:.9rem}.other .od{color:var(--muted);font-size:.74rem}
@media(max-width:760px){
  .tp-head{grid-template-columns:1fr}
  .tp-body{grid-template-columns:1fr}
  .chatcard{display:none}
  .open-chat{display:flex}
}
.chat-ov{position:fixed;inset:0;z-index:3000;background:#0a0a12;display:none;flex-direction:column}
.chat-ov.open{display:flex}
.chat-ov .ovh{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px;background:rgba(9,9,16,.98);border-bottom:1px solid rgba(255,255,255,.1)}
.chat-ov .ovh .bk{font-size:1.7rem;color:#fff;background:none;border:0;cursor:pointer;padding:2px 10px 6px}
.chat-ov .ovh .ovt{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-ov iframe{flex:1;width:100%;border:0}
</style>
</head>
<body>
<div class="tp">
  <div class="loading" id="loading">Loading your ticket…</div>
  <div class="gate" id="gate" style="display:none">
    <h2>Log in to see your ticket</h2><p>Your tickets live in your KEEPITIL account.</p>
    <a class="btnp" id="loginBtn" href="/v3/apply.html">Log in / Join</a>
  </div>
  <div class="empty" id="empty" style="display:none">
    <h2>No tickets yet</h2><p>When you grab a ticket, it shows up here with your QR code and the event chat.</p>
    <a class="btnp" href="/v3/">Browse events</a>
  </div>
  <div id="ticketview" style="display:none"></div>
</div>

<div class="chat-ov" id="chatOv">
  <div class="ovh"><button class="bk" aria-label="Back" onclick="closeChat()">&larr;</button><span class="ovt" id="ovTitle">Event Chat</span></div>
  <iframe id="ovFrame" title="Event chat" src="about:blank"></iframe>
</div>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function enc(s){return encodeURIComponent(String(s==null?'':s));}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return DOW[d.getUTCDay()]+', '+MON[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear(); }

var TIX=[], ACTIVE=0, BACK='/v3/';

function render(){
  var x=TIX[ACTIVE]; if(!x){ return; } var e=x.row;
  var flyerBg=e.cover_url?("background-image:url('"+String(e.cover_url).replace(/'/g,'')+"')"):"";
  var org = e.owner_handle ? ('<span class="lead">Hosted by</span><a href="/v3/u.html?slug='+enc(e.owner_handle)+'">'+esc(e.owner_name||('@'+e.owner_handle))+'</a>') : '<span>KEEPITIL Event</span>';
  var used=!!e.checked_in_at;
  var price=e.price_cents!=null?('$'+(e.price_cents/100).toFixed(2).replace(/\.00$/,'')):'';
  var qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data='+enc('KIL-'+(e.qr_token||e.order_id));
  var chatUrl='/v3/event-chat.html?embed=1&e='+enc(x.slug)+'&t='+enc(x.title);
  var others=TIX.filter(function(_,i){return i!==ACTIVE;});
  var othersHtml = others.length ? ('<div class="others"><div class="others-h">Your other tickets</div>'+TIX.map(function(t,i){ if(i===ACTIVE) return ''; var ee=t.row; var im=ee.cover_url?'<img src="'+esc(ee.cover_url)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<img alt="">'; return '<div class="other" onclick="setActive('+i+')">'+im+'<div><div class="ot">'+esc(ee.title||'Event')+'</div><div class="od">'+esc(fmt(ee.starts_at))+(ee.city?' · '+esc(ee.city):'')+'</div></div></div>'; }).join('')+'</div>') : '';

  $('ticketview').innerHTML=
    '<div class="tp-head">'+
      '<a class="backbtn" href="'+BACK+'">&larr; Profile</a>'+
      '<div class="orgbar">'+org+'</div>'+
    '</div>'+
    '<div class="tp-body">'+
      '<div class="tp-left">'+
        '<div class="flyer" style="'+flyerBg+'"></div>'+
        '<div class="qrcard"><img src="'+qr+'" alt="Ticket QR code"'+(used?' style="opacity:.4;filter:grayscale(1)"':'')+'/><div class="cap">'+(used?'Already scanned':'Scan at the door')+'</div><div class="tag '+(used?'used':'paid')+'">'+(used?'Checked in':'Valid ticket')+'</div></div>'+
      '</div>'+
      '<div class="tp-right">'+
        '<div class="infocard"><div class="eb">KEEPITIL TICKET · '+esc(e.city||'')+'</div><h1>'+esc(e.title||'Event')+'</h1>'+
          '<div class="meta">'+esc(fmt(e.starts_at))+'</div>'+
          '<div class="meta">'+(e.venue?('📍 '+esc(e.venue)+(e.city?(', '+esc(e.city)):'')):(e.city?('📍 '+esc(e.city)):''))+'</div>'+
          (e.genres?('<span class="genre">'+esc(e.genres)+'</span>'):'')+
          '<div class="row"><span>Ticket</span><b>'+esc(e.tier_name||'General Admission')+'</b></div>'+
          '<div class="row"><span>Quantity</span><b>'+(e.qty||1)+'</b></div>'+
          (price?('<div class="row"><span>Paid</span><b>'+price+'</b></div>'):'')+
          '<div class="row"><span>Order</span><b>#KIL-'+(10000+(e.order_id||0))+'</b></div>'+
        '</div>'+
        '<div class="chatcard"><div class="clbl">Event Chat · Scene Room</div><iframe src="'+chatUrl+'" loading="lazy" title="Event chat"></iframe></div>'+
        '<button class="open-chat" onclick="openChat()">Open Event Chat</button>'+
      '</div>'+
    '</div>'+
    '<div class="tp-foot"><a class="backbtn" href="'+BACK+'">&larr; Profile</a></div>'+
    othersHtml;
}
function setActive(i){ if(i<0||i>=TIX.length)return; ACTIVE=i; render(); window.scrollTo({top:0,behavior:'smooth'}); if($('chatOv').classList.contains('open')) openChat(); }
function openChat(){ var x=TIX[ACTIVE]; if(!x)return; $('ovTitle').textContent=x.title||'Event Chat'; $('ovFrame').src='/v3/event-chat.html?embed=1&e='+enc(x.slug)+'&t='+enc(x.title); $('chatOv').classList.add('open'); document.body.style.overflow='hidden'; }
function closeChat(){ $('chatOv').classList.remove('open'); $('ovFrame').src='about:blank'; document.body.style.overflow=''; }

async function init(){
  if(!supa){ $('loading').style.display='none'; $('gate').style.display='block'; return; }
  var b=$('loginBtn'); if(b) b.href='/v3/apply.html?next='+encodeURIComponent(location.pathname+location.search);
  var r=await supa.auth.getSession().catch(function(){return null;});
  var s=r&&r.data?r.data.session:null;
  if(!s){ $('loading').style.display='none'; $('gate').style.display='block'; return; }
  try{ var ps=await supa.rpc('my_profile_slug'); if(ps&&!ps.error&&ps.data){ BACK='/v3/u.html?slug='+enc(ps.data)+'&tab=shows'; } }catch(e){}
  try{
    var o=await supa.rpc('get_my_tickets'); var rows=(o&&o.data)||[];
    if(!rows.length){ $('loading').style.display='none'; $('empty').style.display='block'; return; }
    TIX=rows.map(function(x){ return {row:x, slug:(x.slug||('event-'+x.event_id)), title:(x.title||'Event')}; });
    var want=new URLSearchParams(location.search).get('e');
    if(want){ var idx=TIX.findIndex(function(x){return x.slug===want;}); if(idx>=0) ACTIVE=idx; }
    $('loading').style.display='none'; $('ticketview').style.display='block';
    render();
  }catch(err){ $('loading').textContent='Could not load your ticket. Please refresh.'; }
}
init();
</script>
<script src="/v3/keepitil-radio.js?v=20260713" defer></script>
<script src="/v3/keepitil-ai.js" defer></script>
<script src="/v3/v3-shell.js" defer></script>
</body>
</html>
