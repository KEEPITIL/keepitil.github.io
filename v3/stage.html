<!DOCTYPE html>
<!--
  V4 STAGING PREVIEW — read-only, full-page render of a WBUILDER DRAFT (Founder 2026-07-17).
  Reads the DRAFT row only (get_page_layout p_status='draft', is_admin-gated RPC) — it can
  never show or touch the published/live page. Admin-gated + noindex. No editor chrome:
  the Founder sees the whole page at TRUE breakpoint width — the draft renders inside a
  sized srcdoc iframe (desktop 1280 / mobile 390) so the page's own media queries evaluate
  at the real breakpoint, and page CSS can't bleed into the staging bar.
  For fidelity, the live page's <style>/<link rel=stylesheet> head CSS is copied into the
  iframe so seeded snapshot content renders like the real page. The live page's SCRIPTS are
  never imported; links inside the preview are disabled (pure read-only preview).
  URL: /v3/stage.html?page=<key>&bp=desktop|mobile   (key matches WBUILDER's page picker,
  incl. "root:<file>" keys for site-root profiles/blogs.)
-->
<html lang="en" data-page-type="dashboard">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>V4 Staging — KEEPITIL</title>
<link rel="icon" type="image/png" href="/v3/logo-blue-nav.png"/>
<style>
body{background:#07070c;margin:0}
#kil-stagebar{position:fixed;top:0;left:0;right:0;z-index:2147483000;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#12121c;border-bottom:1px solid #242433;font:600 13px Inter,system-ui,sans-serif;color:#f0f0f0;box-shadow:0 6px 24px rgba(0,0,0,.5);flex-wrap:wrap}
#kil-stagebar .brand{font-weight:900;letter-spacing:.06em;color:#00b4ff}
#kil-stagebar .pgname{color:#c9cede;font-weight:700;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kil-stagebar .draftbadge{background:#ffb43c;color:#241a04;font-weight:900;font-size:.68rem;letter-spacing:.06em;border-radius:999px;padding:3px 10px}
#kil-stagebar button,#kil-stagebar a{background:#0d0d13;color:#f0f0f0;border:1px solid #2a2a3a;border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;text-decoration:none}
#kil-stagebar .bp.on{background:#00b4ff;color:#04121b;border-color:transparent;font-weight:800}
#kil-stagebar .sp{flex:1}
#kil-stagegate{max-width:420px;margin:90px auto;text-align:center;background:#12121c;border:1px solid #242433;border-radius:16px;padding:30px;font-family:Inter,system-ui,sans-serif;color:#f0f0f0}
#kil-stagegate p{color:#8a8a99;margin-top:8px;font-size:.9rem}
#kil-stagewrap{display:none;padding:64px 12px 60px}
#kil-stageframe{display:block;margin:0 auto;border:0;background:#0b0b0f;min-height:400px}
#kil-stageframe.desktop{width:1280px;max-width:100%}
#kil-stageframe.mobile{width:390px;max-width:100%;border:1px solid #2a2a3a;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
#kil-stageempty{max-width:520px;margin:110px auto;text-align:center;font-family:Inter,system-ui,sans-serif;color:#8a8a99;background:#12121c;border:1px solid #242433;border-radius:16px;padding:34px;line-height:1.6}
#kil-stageempty b{color:#f0f0f0}
</style>
</head>
<body>
<div id="kil-stagegate"><h2>V4 STAGING</h2><p>Admin sign-in required. Open this from WBUILDER's "👁 Preview full page" button.</p></div>

<div id="kil-stagebar" style="display:none">
  <span class="brand">V4 STAGING</span>
  <span class="pgname" id="pgname"></span>
  <span class="draftbadge">DRAFT — NOT LIVE</span>
  <span class="sp"></span>
  <button class="bp" id="bp-desktop">🖥 Desktop</button>
  <button class="bp" id="bp-mobile">📱 Mobile</button>
  <a id="editLink" title="Open this page's draft in the full-screen editor">✎ Edit in WBUILDER</a>
</div>

<div id="kil-stagewrap"><iframe id="kil-stageframe" class="desktop" title="V4 draft preview"></iframe></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var SB=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pageURL(v){return v.indexOf('root:')===0?'/'+v.slice(5):'/v3/'+v;}

var q=new URLSearchParams(location.search);
var PAGE=q.get('page')||'index.html';
var BP=(q.get('bp')==='mobile')?'mobile':'desktop';
if(!/^(root:)?[a-z0-9._-]+\.html$/i.test(PAGE)) PAGE='index.html';

/* renderer — same widget semantics as the public kil-layout.js, but DRAFT-only source */
function styleOf(w){
  var st=(w.props&&w.props.style)||{}; var css='';
  if(st.w)css+='width:'+st.w+';'; if(st.h)css+='height:'+st.h+';';
  if(st.pad!=null)css+='padding:'+st.pad+'px;'; if(st.margin!=null)css+='margin-bottom:'+st.margin+'px;';
  if(st.radius!=null)css+='border-radius:'+st.radius+'px;';
  if(st.align==='center')css+='margin-left:auto;margin-right:auto;';
  if(st.align==='right')css+='margin-left:auto;margin-right:0;';
  return css;
}
function renderW(w){
  var p=w.props||{}, st=p.style||{};
  if(w.type==='heading') return '<div style="'+styleOf(w)+'font-family:\'Bebas Neue\',Inter,sans-serif;font-size:'+(st.fs||34)+'px;font-weight:900;text-align:'+(st.textAlign||'left')+';color:'+(st.color||'#f0f0f0')+'">'+esc(p.text||'')+'</div>';
  if(w.type==='text') return '<div style="'+styleOf(w)+'font-size:'+(st.fs||15)+'px;line-height:1.6;text-align:'+(st.textAlign||'left')+';color:'+(st.color||'#c9cede')+'">'+(p.html||'')+'</div>';
  if(w.type==='image'){
    if(!p.src) return '';
    var crop=p.crop||{};
    var frame='overflow:hidden;position:relative;width:100%;'+(crop.aspect&&crop.aspect!=='free'?'aspect-ratio:'+crop.aspect+';':'height:'+(st.h||'220px')+';')+'border-radius:'+(st.radius!=null?st.radius:10)+'px;';
    return '<div style="'+styleOf(w)+frame+'"><img src="'+esc(p.src)+'" alt="'+esc(p.alt||'')+'" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover;object-position:'+(crop.ox!=null?crop.ox:50)+'% '+(crop.oy!=null?crop.oy:50)+'%;transform:scale('+((crop.zoom||100)/100)+')"></div>';
  }
  if(w.type==='button') return '<div style="'+styleOf(w)+'text-align:'+(st.textAlign||'left')+'"><a href="'+esc(p.href||'#')+'" style="display:inline-block;background:'+(st.bg||'#00b4ff')+';color:'+(st.color||'#04121b')+';font-weight:800;font-size:'+(st.fs||14)+'px;padding:'+(st.padV!=null?st.padV:11)+'px '+(st.padH!=null?st.padH:22)+'px;border-radius:'+(st.radius!=null?st.radius:999)+'px;text-decoration:none;'+(st.w?'width:'+st.w+';text-align:center;':'')+'">'+esc(p.label||'')+'</a></div>';
  if(w.type==='spacer') return '<div style="height:'+(p.h||32)+'px"></div>';
  if(w.type==='embed') return '<div style="'+styleOf(w)+'">'+(p.html||'')+'</div>';
  return '';
}
function renderTree(tree){
  return tree.map(function(s){
    return '<section style="background:'+((s.props&&s.props.bg)||'transparent')+';padding:'+((s.props&&s.props.pad)!=null?s.props.pad:14)+'px">'+(s.children||[]).map(renderW).join('')+'</section>';
  }).join('');
}

/* fidelity: copy the LIVE page's head CSS (style tags + stylesheet/font links) so seeded
   snapshot content renders like the real page. Read-only fetch; live scripts NEVER copied. */
var HEAD_CACHE={};
function pageHead(cb){
  if(HEAD_CACHE[PAGE]!=null){ cb(HEAD_CACHE[PAGE]); return; }
  fetch(pageURL(PAGE)).then(function(r){return r.text();}).then(function(html){
    var head='', bodyCls='';
    try{
      var doc=new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('head link[rel="stylesheet"],head link[rel="preconnect"],head style').forEach(function(n){ head+=n.outerHTML; });
      bodyCls=(doc.body&&doc.body.getAttribute('class'))||'';
    }catch(e){}
    HEAD_CACHE[PAGE]={head:head,bodyCls:bodyCls};
    cb(HEAD_CACHE[PAGE]);
  }).catch(function(){ HEAD_CACHE[PAGE]={head:'',bodyCls:''}; cb(HEAD_CACHE[PAGE]); });
}

function sizeFrame(){
  var f=$('kil-stageframe');
  try{
    var d=f.contentDocument;
    if(d&&d.documentElement) f.style.height=Math.max(400,d.documentElement.scrollHeight)+'px';
  }catch(e){}
}

function loadDraft(){
  $('pgname').textContent=PAGE+' · '+BP;
  $('bp-desktop').classList.toggle('on',BP==='desktop');
  $('bp-mobile').classList.toggle('on',BP==='mobile');
  $('editLink').href='/v3/wbuilder.html?page='+encodeURIComponent(PAGE)+'&bp='+BP;
  try{ history.replaceState(null,'','/v3/stage.html?page='+encodeURIComponent(PAGE)+'&bp='+BP); }catch(e){}
  SB.rpc('get_page_layout',{p_page:PAGE,p_breakpoint:BP,p_status:'draft'}).then(function(r){
    var d=(r&&r.data)||{};
    var tree=Array.isArray(d.layout)?d.layout:[];
    var f=$('kil-stageframe');
    f.className=BP;
    var old=$('kil-stageempty'); if(old) old.remove();
    if(!tree.length){
      f.style.display='none';
      var e=document.createElement('div'); e.id='kil-stageempty';
      e.innerHTML='No <b>'+esc(BP)+'</b> V4 draft exists yet for <b>'+esc(PAGE)+'</b>.<br><br>Open it in WBUILDER, click “⤓ Load current page content”, then Save draft — and preview it here.';
      document.body.appendChild(e);
      return;
    }
    f.style.display='block';
    pageHead(function(h){
      /* the iframe is the page: its own viewport = the breakpoint width, so the page's
         media queries evaluate correctly; a tiny guard script disables link navigation. */
      f.srcdoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">'
        +h.head
        +'<\/head><body class="'+esc(h.bodyCls)+'">'
        +renderTree(tree)
        +'<script>document.addEventListener("click",function(e){var n=e.target;while(n&&n.tagName!=="A")n=n.parentElement;if(n){e.preventDefault();e.stopPropagation();}},true);<\/script>'
        +'<\/body><\/html>';
      f.onload=function(){ sizeFrame(); setTimeout(sizeFrame,500); setTimeout(sizeFrame,1500); setTimeout(sizeFrame,3500); };
    });
  });
}
$('bp-desktop').onclick=function(){ if(BP!=='desktop'){ BP='desktop'; loadDraft(); } };
$('bp-mobile').onclick=function(){ if(BP!=='mobile'){ BP='mobile'; loadDraft(); } };

(function boot(){
  if(!SB) return;
  SB.auth.getSession().then(function(res){
    var s=res&&res.data&&res.data.session;
    if(!s) return;
    SB.rpc('is_admin').then(function(r){
      if(!(r&&r.data)) return;
      $('kil-stagegate').style.display='none';
      $('kil-stagebar').style.display='flex';
      $('kil-stagewrap').style.display='block';
      loadDraft();
    });
  });
})();
</script>
</body>
</html>
