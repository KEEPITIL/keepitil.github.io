<title>Culture — The Community Feed | KEEPITIL</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--panel:rgba(255,255,255,.035);--brd:rgba(255,255,255,.09);--ink:#f4f2fb;--ink2:#9a94b4;--ink3:#6b6588;--purple:var(--purple-2);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;--fs:'Fraunces',serif}
html{scroll-behavior:smooth}
body{background:var(--bg,#0a0a0f);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:80px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
/* uniform pillar sub-nav */
.hubnav{position:relative;z-index:20;background:color-mix(in srgb,var(--bg,#0a0a0f) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line,rgba(255,255,255,.08))}
.hubnav .in{max-width:920px;margin:0 auto;display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.hubnav .in::-webkit-scrollbar{display:none}
.hubnav a{flex:1 1 0;text-align:center;justify-content:center;font-size:.82rem;font-weight:800;letter-spacing:.02em;padding:9px 8px;border-radius:999px;border:1px solid var(--line,rgba(255,255,255,.12));color:var(--muted,#9aa0b0);white-space:nowrap;text-decoration:none}
.hubnav a:hover{color:var(--text,#f0f0f0)}
.hubnav a.on{background:linear-gradient(90deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));color:#04121b;border-color:transparent}
@media(max-width:640px){.hubnav .in{overflow-x:auto}.hubnav a{flex:0 0 auto;padding:8px 15px}}
/* hero banner */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg,#0a0a0f) url('/v3/culture-hero.jpg') center/cover no-repeat;opacity:1}
html.has-season body::before{display:none!important} /* seasonal image takes over the hero backdrop on its dates */
:root{--brand:#a855f7;--brand-2:#c084fc;--glow:#a855f7} /* Culture = neon purple accent */
/* layout */
.wrap{max-width:1360px;margin:0 auto;padding:0 26px}
.chero-intro{min-height:calc(100vh - 132px);min-height:calc(100dvh - 132px);display:flex;align-items:flex-end;justify-content:center;padding:0 20px 42px}
.chero-cue{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;opacity:.82;text-shadow:0 2px 12px rgba(0,0,0,.55);cursor:pointer}
.chero-cue span{font-family:var(--fh,inherit);font-size:.72rem;letter-spacing:.26em;font-weight:800}
.chero-cue .arw{font-size:1.5rem;line-height:1;animation:cbounce 1.8s ease-in-out infinite}
@keyframes cbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@media(max-width:940px){.chero-intro{min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);padding-bottom:34px}}
/* V3.1 = FEED ONLY (immutable template): one centered column, no discovery rail */
.merge{display:block;max-width:600px;margin:22px auto 40px}
@media(max-width:940px){.merge{grid-template-columns:1fr}}
/* LEFT feed */
.feedcol{position:static}
@media(max-width:940px){.feedcol{position:static}}
.feedhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:56px;box-sizing:border-box;padding:8px 8px 8px 18px;background:rgba(14,13,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.34)}
/* DESKTOP: hide the +/All/Feed-Following row entirely — mobile keeps it (Founder 2026-07-18) */
@media(min-width:861px){.feedhd{display:none}}
.feedhd h2{font-family:var(--fs);font-weight:900;font-size:1.4rem;color:#fff;display:flex;align-items:center;gap:11px}
.feedhd h2::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));box-shadow:0 0 10px color-mix(in srgb,var(--brand,#00b4ff) 70%,transparent);flex:0 0 auto}
.feedhd .now{font-family:var(--fh);letter-spacing:.1em;font-size:.8rem;color:var(--purple)}
.toggle{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px;gap:2px}
.feeddd{position:relative;margin-left:auto}
.feeddd-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--fh);font-weight:800;letter-spacing:.12em;font-size:.9rem;color:#a06bff;background:transparent;border:1.5px solid #a06bff;border-radius:11px;padding:9px 18px;cursor:pointer;box-shadow:0 0 10px rgba(160,107,255,.5),inset 0 0 8px rgba(160,107,255,.14);text-shadow:0 0 6px rgba(160,107,255,.5)}
.feeddd-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:80;background:#15151f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.feeddd-menu.open{display:block}
.feeddd-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8e8f0;font-size:.92rem;font-weight:700;letter-spacing:.02em;padding:11px 12px;border-radius:8px;cursor:pointer}
.feeddd-menu button.on,.feeddd-menu button:hover{background:rgba(255,255,255,.09);color:#fff}
.toggle button{font-family:var(--fh);letter-spacing:.1em;font-size:.82rem;color:var(--ink2);background:none;border:0;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .18s}
.toggle button:hover{color:#fff}
.toggle button.on{background:linear-gradient(90deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));color:#04121b;box-shadow:0 2px 12px color-mix(in srgb,var(--brand,#00b4ff) 42%,transparent)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed::-webkit-scrollbar{display:none;width:0;height:0}
@media(max-width:940px){.feed{max-height:none;overflow:visible}}
/* Mobile = FEEDs only (Founder directive 2026-07-16): hide intro + discovery column; "+" add-post and ♥ notifications appear in the feed header */
.cul-add,.cul-heart{display:none;align-items:center;justify-content:center;flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font-size:1.25rem;font-weight:800;line-height:1;text-decoration:none;cursor:pointer}
.cul-heart svg{width:20px;height:20px}
/* Culture mobile top bar — gear (logged-in Type/Filter) + full-width dropdown (Founder 2026-07-29) */
.cul-gear{display:none;align-items:center;justify-content:center;flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font-size:1.2rem;line-height:1;cursor:pointer}
.cul-gear-menu{display:none;position:absolute;top:calc(100% + 6px);left:8px;z-index:85;background:#15151f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px;min-width:240px;max-width:82vw;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.cul-gear-menu.open{display:block}
.cul-gear-menu .gm-h{font:800 .6rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8a8a99;margin:4px 4px 6px}
.cul-gear-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8e8f0;font-size:.9rem;font-weight:600;padding:9px 11px;border-radius:8px;cursor:pointer}
.cul-gear-menu button small{display:block;font-weight:400;color:#8a8a99;font-size:.72rem;margin-top:1px}
.cul-gear-menu button.on,.cul-gear-menu button:hover{background:rgba(255,255,255,.09);color:#fff}
.cul-gear-menu hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:9px 0}
/* Filter A — content-type bar, scroll L/R (Founder 2026-07-31) */
.cul-typebar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0 12px;margin:0 0 6px}
.cul-typebar::-webkit-scrollbar{display:none}
.cul-typebar button{flex:0 0 auto;font-family:var(--fh,inherit);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:#cfc9e6;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .15s}
.cul-typebar button:hover{color:#fff;border-color:rgba(160,107,255,.5)}
.cul-typebar button.on{background:linear-gradient(90deg,#00b4ff,#5cc8ff);border-color:transparent;color:#04121b}
/* FILTERS REMOVED FROM CULTURE — Founder 2026-08-19: "the culture page on the desktop does not
   have the filters and the mobile version should match that as well."
   Desktop lost them on 2026-08-18; mobile kept #culMTabs and .cul-typebar, so the two
   breakpoints disagreed. Hidden here rather than deleted because the mount code, the tab-gate
   thresholds and the swipe handler all still reference these ids — ripping the markup out would
   mean touching five call sites to remove one bar. One rule, no orphaned references. */
.cul-typebar,#culMTabs{display:none!important}
/* Desktop subpage tabs (Feed / Radio / VS) — Founder 2026-08-04 */
.cul-subpages{display:none}
@media(min-width:861px){
  .cul-subpages{display:flex;gap:8px;margin:0 0 14px}
  .cul-subpages .csp{flex:0 0 auto;font-family:var(--fh);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.82rem;color:#cfc9e6;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 20px;cursor:pointer;transition:all .15s}
  .cul-subpages .csp:hover{color:#fff;border-color:rgba(160,107,255,.5)}
  .cul-subpages .csp.on{background:linear-gradient(90deg,#a855f7,#c084fc);border-color:transparent;color:#0a0710}
}
/* Vertical content-type rail — desktop only (Founder 2026-08-04): icons that expand to reveal their label on hover */
.cul-vrail{display:none}
@media(min-width:861px){
  .cul-vrail{display:flex;flex-direction:column;gap:9px;position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40}
  .cul-vrail .cvr{display:flex;align-items:center;gap:13px;width:58px;height:58px;padding:0 15px;overflow:hidden;white-space:nowrap;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(14,13,22,.82);backdrop-filter:blur(12px);color:#cfc9e6;cursor:pointer;transition:width .18s ease;box-sizing:border-box}
  .cul-vrail .cvr .ic{font-size:1.55rem;flex:0 0 auto;line-height:1;width:26px;text-align:center}
  .cul-vrail .cvr .tx{font-family:var(--fh);font-weight:800;letter-spacing:.08em;font-size:.9rem;opacity:0;transition:opacity .12s}
  .cul-vrail:hover .cvr{width:180px}
  /* subpage dropdown (Founder 2026-08-04): one icon for Feed/Radio/VS */
  .cul-vrail{overflow:visible}
  .cul-vrail .vr-subdd{position:absolute;right:66px;top:0;display:none;flex-direction:column;gap:2px;background:#15131f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px;min-width:150px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .cul-vrail .vr-subdd.open{display:flex}
  .cul-vrail .vr-subdd button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#e6e2f2;font-size:.95rem;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
  .cul-vrail .vr-subdd button .ic{font-size:1.2rem}
  .cul-vrail .vr-subdd button:hover{background:rgba(255,255,255,.09);color:#fff}
  .cul-vrail:hover .cvr .tx{opacity:1}
  .cul-vrail .cvr.on{background:linear-gradient(90deg,#a855f7,#c084fc);border-color:transparent;color:#0a0710}
  .cul-vrail .vr-div{width:34px;height:1px;background:rgba(255,255,255,.2);align-self:flex-end;margin:4px 6px 4px 0}
  .cul-vrail .cvr.sp.on{background:linear-gradient(90deg,#7c3aed,#a855f7);border-color:transparent;color:#fff}
  .cul-vrail .cvr.sf.on{background:linear-gradient(90deg,#3aa5ff,#5cc8ff);border-color:transparent;color:#04121b}
}
/* ── MOBILE (Founder 2026-08-02): the EXPLORE page-dropdown fills the top; a horizontal swipe
   cycles the subfilter (type) pages of the current section. Bottom nav is untouched. ── */
@media(max-width:860px){
  .feedhd{flex-wrap:wrap;row-gap:10px}
  #feedDD{margin-left:0;order:5;flex:1 1 100%;width:100%}
  #feedDD .feeddd-btn{display:flex;width:100%;justify-content:center}
  #feedDD .feeddd-menu{left:0;right:0;width:100%;min-width:0}
  .cul-sw-toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;background:rgba(6,6,12,.9);color:#fff;border:1px solid #a06bff;border-radius:14px;padding:13px 26px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.95rem;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}
  .cul-sw-toast.on{opacity:1}
}
/* Full-screen scroll (Founder 2026-07-31): one item per screen, snap to next.
   Enabled on mobile via body.cul-fs; toggled by the Feed section. */
body.cul-fs .feedcol{scroll-snap-type:y mandatory;overflow-y:auto}
@media(max-width:860px){
  body.cul-fs #community-feed>.fcard,body.cul-fs #feed>.fcard{scroll-snap-align:start;scroll-snap-stop:always;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);display:flex;flex-direction:column;justify-content:center}
}
/* Givebacks / VS section panels */
#cul-section-panel .cul-sec-h{font-family:var(--fs);font-weight:900;font-size:1.5rem;color:#fff;margin:6px 0 4px}
#cul-section-panel .cul-sec-sub{color:var(--ink2,#9aa);font-size:.9rem;margin-bottom:16px}
.gb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gb-card{display:block;background:rgba(12,12,20,.85);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;text-decoration:none;color:#fff;transition:border-color .2s,transform .2s}
.gb-card:hover{border-color:rgba(0,180,255,.45);transform:translateY(-2px)}
.gb-card .gb-k{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#00e0a4}
.gb-card h3{font-size:1.05rem;margin:6px 0 4px}
.gb-card p{color:var(--ink2,#9aa);font-size:.82rem;line-height:1.4}
@media(max-width:860px){
  .chero-intro,.discovercol{display:none!important}
  /* Founder 2026-07-16: mobile Culture nav = "+ | FEED | FOLLOW | ♥" + one even row of 5 pillar icons */
  .hubnav{display:none!important}
  /* MOBILE: keep the +/toggle/bell row and LOCK it to the top of the page (Founder 2026-07-18) */
  .feedhd{position:sticky;top:0;z-index:60;margin:0 -26px 10px;border-radius:0;background:#0a0a0f;border-left:0;border-right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 26px 12px}
  .feedhd h2{display:none}
  .feedhd .feeddd{flex:1;margin:0 8px!important}
  .feedhd .feeddd-btn{width:100%;justify-content:center}
  .feedhd .feeddd-menu{left:50%;right:auto;transform:translateX(-50%);min-width:210px}
  .feedhd .toggle{flex:1;justify-content:center}
  .feedhd .toggle button{flex:1;text-transform:uppercase;letter-spacing:.12em}
  .cul-pillars{display:flex!important}
}
.cul-pillars{display:none;align-items:center;justify-content:space-around;gap:4px;margin:0 0 14px;padding:10px 6px;background:rgba(14,13,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:14px}
.cul-pillars a{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;min-width:0;color:#cfd3e0;text-decoration:none;font-size:1.25rem;line-height:1}
.cul-pillars a small{font-size:.56rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.fcard{display:block;flex:0 0 auto;background:rgba(12,12,20,.93);border:1px solid var(--brd);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s}
/* MOBILE ONLY — Founder-tuned 2026-08-15: card height 160% of width, radius 5, gap 5, title 15px.
   Desktop keeps its 16px radius and natural height. Also scoped to :not(.cul-fs): full-screen
   mode sets its own min-height per slide and a fixed aspect-ratio would fight it. The thumbnail
   flexes into whatever the body leaves, so the card hits the ratio exactly rather than being
   the sum of two independent boxes. */
@media(max-width:860px){
  .fcard{border-radius:5px}
  .feed{gap:5px}
  .fcard h3{font-size:15px}
  body:not(.cul-fs) .fcard{aspect-ratio:100/160;display:flex;flex-direction:column}
  body:not(.cul-fs) .fcard .th{flex:1 1 auto;aspect-ratio:auto;min-height:0}
  body:not(.cul-fs) .fcard .bd{flex:0 0 auto}
}
.fcard:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
.fcard .th{width:100%;aspect-ratio:16/9;background:#0a0a0f url('/v3/blog-default.jpg') center/cover;background-size:cover;background-position:center;transition:aspect-ratio .25s}
.fcard.exp .th{aspect-ratio:16/7}
.fcard .bd{padding:15px 17px 17px}
.fcard .cc{font-family:var(--fh);font-size:.7rem;letter-spacing:.13em;color:#07070c;background:var(--ac);border-radius:20px;padding:3px 11px;display:inline-block}
.fcard h3{font-family:var(--fs);font-weight:600;font-size:1.2rem;line-height:1.18;color:#fff;margin-top:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard.exp h3{-webkit-line-clamp:unset}
.fcard .hint{font-family:var(--fh);letter-spacing:.08em;font-size:.66rem;color:var(--ink3);margin-top:9px}
/* FB-parity card chrome (Founder 2026-07-18) */
.fbcard{cursor:default}
.fb-head{display:flex;align-items:center;gap:10px;padding:11px 14px;justify-content:space-between}
.fb-more{background:none;border:0;color:var(--ink2,#9a94b4);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 8px;flex:0 0 auto;border-radius:8px}
.fb-more:hover{color:#fff;background:rgba(255,255,255,.07)}
.fb-pmenu{position:absolute;z-index:9000;min-width:170px;background:#12121c;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.fb-pmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:#eceefb;font:600 .88rem Inter,sans-serif;padding:10px 12px;border-radius:8px;cursor:pointer}
.fb-pmenu button:hover{background:rgba(255,255,255,.08)}
.fb-av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#0a0a0f}
.fb-who{flex:1;min-width:0;line-height:1.25}.fb-who b{display:block;font-size:.9rem;color:#fff}.fb-who span{font-size:.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
/* SAME square card as before — only change: contain (whole image fits inside the card) instead of cover */
.fb-media{display:block;width:100%;aspect-ratio:1/1.02;background:#000 url('/v3/blog-default.jpg') center/contain no-repeat;overflow:hidden}
.fb-media>img,.fb-media>video{width:100%;height:100%;object-fit:contain!important;display:block}
.fb-cap{padding:11px 14px 2px;font-size:.92rem;line-height:1.5;color:#cfd3df;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.fb-cap.open{display:block;-webkit-line-clamp:unset}.fb-cap.open .fb-more-txt{display:none}
.fb-cap b{font-family:var(--fs);font-weight:600;color:#fff}
.fb-more-txt{color:var(--ink3)}
.fb-cap .fx{max-height:none;margin-top:10px;display:none}.fb-cap.open .fx{display:block}
.fb-actions{display:flex;align-items:center;gap:4px;padding:6px 10px 10px}
.fba{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:#cfd3df;cursor:pointer;padding:7px 10px;border-radius:9px;font:700 .8rem Inter,sans-serif;text-decoration:none}
.fba svg{width:21px;height:21px}.fba:hover{color:#fff;background:rgba(255,255,255,.06)}
.fba.on{color:#ff4d8d}.fb-save.on{color:var(--brand,#00b4ff)}
.fcard.exp .hint{display:none}
.fcard .fx{max-height:0;overflow:hidden;transition:max-height .25s}
.fcard.exp .fx{max-height:70px;margin-top:13px}
.fcard a.open{display:inline-block;background:var(--brand);color:#04121b;font-weight:800;font-size:.82rem;padding:9px 17px;border-radius:999px}
.gate{background:var(--panel);border:1px dashed var(--brd);border-radius:16px;padding:40px 24px;text-align:center}
.gate .i{font-size:2.4rem}.gate h3{font-family:var(--fs);font-weight:600;font-size:1.3rem;color:#fff;margin:8px 0 6px}
.gate p{color:var(--ink2);font-size:.9rem;max-width:300px;margin:0 auto 16px}

}

/* K5 — PIX matched nothing.
   It tested kind==='photo'||'image', and profile_content has no such kind: the values are
   post, event and article. So the Pix tab was live in the nav and returned an empty feed,
   while 201 rows DO carry an image — at data.img, not as a kind. That is why the directive
   lists PIX at 201 while the tab showed zero.
   Takes the whole row now, because "has a picture" is a property of the row, not of its kind. */
function _culTypeMatch(row){
  if(culContentType==='all') return true;
  var k=String((row&&row.kind)||'').toLowerCase();
  if(culContentType==='article') return k==='article';
  if(culContentType==='image'){
    /* data.img ONLY, deliberately. Falling back to data.cover as well matched 252 rows — the
       201 posts plus 51 events whose cover art happens to be an image. That turns Pix from
       "pictures people posted" into "anything with a picture attached", which fills a photo
       feed with event promos. Measured against all 628 live rows: img alone = 201, exactly
       the figure in the directive. */
    var d=(row&&row.data)||{};
    var img=d.img;
    return typeof img==='string' && img.trim()!=='';
  }
  return true;
}
function applyCulFilters(){

     videos out of every signed-in render. */
  var rows=(window.__culMerged || window.__culAllRows || []).slice();
  /* Filter A — content type */
  /* Archived rows are removed content and must never render. The feed never filtered
     them: 280 of 628 rows — 45% of what Culture showed — were archived. Live totals are
     article 294, event 43, post 11. */
  rows=rows.filter(function(x){ return !x.archived; });
  rows=rows.filter(function(x){ return _culTypeMatch(x); });
  /* Filter (gear) */
  if(culFilter==='articles'){ rows=rows.filter(function(x){ return x.kind==='article' && CUL_AGENTS[String(x.profile_slug||'').toLowerCase()]; }); }
  else if(culFilter==='user'){ rows=rows.filter(function(x){ return !CUL_AGENTS[String(x.profile_slug||'').toLowerCase()]; }); }
  /* Type (gear) — all / following / followers / circle */
  var fg=window.__culFollowing||{}, fr=window.__culFollowers||{};
  if(culType==='following'){ rows=rows.filter(function(x){ return fg[String(x.profile_slug||'').toLowerCase()]; }); }

      +'<div class="fb-head"><a class="fb-head-l" href="'+url+'" style="text-decoration:none;display:flex;align-items:center;gap:10px;flex:1;min-width:0"><img class="fb-av" src="'+h(r.author_avatar||'/v3/logo-blue-nav.png')+'" onerror="this.src=\'/v3/logo-blue-nav.png\'" alt=""><div class="fb-who"><b>'+h(r.author_name||r.profile_slug)+'</b></div></a><button class="fb-more" aria-label="More options" onclick="culPostMenu(event,\''+h(r.profile_slug)+'\',\''+url+'\')">⋯</button></div>'
      +'<div class="fb-media" style="background:#000">'+m+'</div>'
      +'<div class="fb-cap" onclick="this.classList.toggle(\'open\');var fx=this.querySelector(\'.fx\');if(fx)fx.style.display=this.classList.contains(\'open\')?\'block\':\'none\'"><b>'+h(d.t||'')+'</b>'+(d.html?'<span class="fb-more-txt">… more</span><div class="fx" style="display:none">'+d.html+'</div>':'')+'</div>'
      +(d.buy_url?('<div style="padding:2px 15px 8px"><a href="'+h(d.buy_url)+'" target="_blank" rel="noopener sponsored nofollow" data-kt="affiliate_click" data-agent="'+h(r.profile_slug||'')+'" style="display:block;text-align:center;background:#ff9900;color:#111;font-weight:800;letter-spacing:.03em;padding:11px;border-radius:10px;text-decoration:none">🛒 '+h(d.buy_label||'Buy on Amazon')+'</a><div style="font-size:.68rem;color:var(--ink3,#9aa);text-align:center;margin-top:5px">'+h(d.disclosure||'#ad · affiliate')+'</div></div>'):'')
      +acts
    +'</div>';
  }
  function boot(n){
    var sb=window.__culSB;
    if(!sb){ if(n<30){ setTimeout(function(){boot(n+1);},400); } return; }
    function run(viewer){
      /* ranked feed: server-side score = engagement velocity + recency/quality + personalization (follows + affinity) */
      sb.rpc('get_culture_feed', viewer?{p_limit:20,p_viewer:viewer}:{p_limit:20}).then(function(r){
        var rows=(r&&r.data)||[];
        var box=document.getElementById('community-feed'); if(!box) return;
        rows=rows.filter(function(x){ return !(x.kind==='event' && /^venue-/.test(x.profile_slug||'')); }); /* event shows once (owner copy); venue copy lives on the venue page */
        window.__culAllRows=rows;
        /* render function used by both initial paint and the gear Type/Filter (Founder 2026-07-29) */
        /* §D.2: the pager renders ONE row per slide, so it needs the same card builder the feed
           uses. Exposed rather than duplicated — a second card renderer would drift. */
        window.__culCard=card;
        window.__culRenderRows=function(list){ var b=document.getElementById('community-feed'); if(!b)return;
          if(!list||!list.length){ b.innerHTML=''; return; }
          b.innerHTML=list.map(card).join('');
          try{ if(window.__culHydrate) window.__culHydrate(); }catch(e){} };
        /* MEDIA WAS NEVER RENDERED (Founder 2026-08-19: "i do not see the youtube videos only
           the events"). __culMediaRows was fetched only to count inventory for the tab gate and
           was merged in culLiveRows(), which nothing on the render path called — so approved
           videos existed, were queried, and were then dropped on the floor. Load media, merge it
           with the ranked feed and sort by date so a video sits in the timeline rather than in a
           separate tab nobody opens. */
        function paint(){
          var merged = (window.__culAllRows||[]).concat(window.__culMediaRows||[])
            .filter(function(x){ return !x.archived; })
            .sort(function(a,b){ return Date.parse(b.created_at||0) - Date.parse(a.created_at||0); });
          window.__culMerged = merged;
          if(typeof applyCulFilters==='function' && (window.__culSignedIn)){
            try{ if(typeof loadCulRelations==='function') loadCulRelations(); }catch(e){}
            applyCulFilters();
          } else { window.__culRenderRows(merged); }
        }
        /* Paint the feed immediately, then repaint once media arrives — a slow videos query must
           never delay the text feed, and must never blank it if it fails. */
        paint();
        /* culLoadMedia() is declared in a LATER <script> block (line ~871) than this one, so at
           boot time it is frequently not defined yet. The first version of this call was wrapped
           in a bare try/catch, which swallowed the ReferenceError in silence: the feed painted,
           the videos never loaded, and nothing anywhere said why. Same failure class as the
           `.catch()` that took /create down — a defensive catch hiding a real fault.
           Now: wait for the function to exist, and if it never does, SAY SO. Broken must never
           look like empty. */
        (function waitForMedia(n){
          if(typeof culLoadMedia !== 'function'){
            if(n < 40) return setTimeout(function(){ waitForMedia(n+1); }, 250);
            console.error('[culture] culLoadMedia never became available — video feed cannot load');
            return;
          }
          culLoadMedia().then(paint).catch(function(e){
            console.error('[culture] media load failed', e);
          });
        })(0);
      }).catch(function(){});
    }
    try{ sb.rpc('my_profile_slug').then(function(rr){ run(rr&&!rr.error&&rr.data?rr.data:null); }).catch(function(){ run(null); }); }catch(e){ run(null); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){boot(0);});
  else boot(0);
})();
</script>

<script>
/* MOBILE CULTURE enhancer — additive, ≤860px only. Above 860px every branch below no-ops. */
(function(){

/* ── §D.2 / §D4 — which Culture filters exist today ───────────────────────────────────────
   FEED and ARTICLE always mount: FEED is the surface itself, ARTICLE is in-house content with
   294 live rows. VIDEO and PIXLE are gated on live inventory, so an empty filter is never
   mounted at all rather than mounted-and-hidden.

   §E.2 changed the maths. The source is KEEPITIL's OWN @keepitil accounts — self-syndication,
   one known account per platform — so a 5-creator gate is unreachable by construction and is
   dropped for these two. Item count and category count stand, read from platform_config so the
   owner moves the bar without a deploy.

   BROKEN != EMPTY: if the config cannot be read, the gated filters do not mount and the reason
   is recorded. "No VIDEO tab because there are no videos" and "no VIDEO tab because the config
   read failed" are different facts. */
window.CULTURE_TAB_GATE_NOTE = 'not-evaluated';

function culTabThresholds(){
  var sb = window.__culSB;
  if(!sb) return Promise.resolve(null);
  return sb.from('platform_config').select('key,value')
    .in('key',['culture_tab_min_items','culture_tab_min_creators','culture_tab_min_categories'])
    .then(function(r){
      if(r.error || !r.data) return null;
      var c={}; r.data.forEach(function(row){ c[row.key]=parseInt(row.value,10); });
      if(!isFinite(c.culture_tab_min_items)) return null;
      return { items:c.culture_tab_min_items, categories:c.culture_tab_min_categories };
    }).catch(function(){ return null; });
}

/* §J — VIDEO and PIXLE do not live in profile_content.
   The feed RPC returns kinds post / event / article, so the old `x.kind==='video'` test could
   never match anything: the tab was gated on an inventory that was structurally always zero.
   Media records live in their own `videos` table, so they are loaded separately and mapped into
   the same row shape the rest of this page already understands.

   media_kind is what separates the two tabs — VIDEO reads 'video', PIXLE reads 'photo' — and it
   is OUR column, not the provider's, because TikTok's oEmbed could not be verified to
   distinguish a Photo Mode post from a video one. */
window.__culMediaRows = window.__culMediaRows || [];

function culMediaToRow(v){
  return {
    id: 'media-' + v.id,
    kind: v.media_kind === 'photo' ? 'pixle' : 'video',
    media_kind: v.media_kind,
    title: v.title,
    created_at: v.published_at,
    archived: false,
    profile_slug: null,
    author_name: v.creator_name,
    /* §L (§19) — third-party media carries creator, platform, source URL and an
       open-on-platform action. own_content is false unless the source says otherwise, so a row
       that forgot the flag over-attributes rather than stripping someone's credit. */
    own_content: v.own_content === true,
    creator_profile_url: v.creator_profile_url || '',
    source_platform: ({youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram'})[v.provider] || v.provider,
    data: {
      /* Thumbnail-first: the card shows an image and only the ACTIVE pager slide mounts a
         player, so a column of fifteen shorts does not start fifteen iframes. */
      img: v.thumbnail_url || '',
      cover: v.thumbnail_url || '',
      embed_url: v.embed_url || '',
      source_url: v.source_url || '',
      provider: v.provider,
      category: v.provider
    }
  };
}

/* The supabase client is created by a boot loop that polls for window.supabase for up to ~14s,
   so it very often does NOT exist when the pager first resolves its filters. Returning early in
   that window loaded no media, counted zero items and held VIDEO shut — which is the exact bug
   this wiring was written to fix, and it shipped anyway because the test asserted the call
   ORDER (culLoadMedia before the gate) and not that the data actually arrives. Wait for the
   client on the same budget the page gives itself. */
function culAwaitSB(tries){
  tries = tries || 0;
  if(window.__culSB) return Promise.resolve(window.__culSB);
  if(tries >= 40) return Promise.resolve(null);
  return new Promise(function(res){
    setTimeout(function(){ res(culAwaitSB(tries + 1)); }, 350);
  });
}

function culLoadMedia(){
  if(window.__culMediaLoaded) return Promise.resolve(window.__culMediaRows);
  return culAwaitSB().then(function(sb){
    /* Deliberately does NOT set __culMediaLoaded when the client never arrived — that would
       latch the empty result in and a later, healthier call could never fix it. */
    if(!sb) return window.__culMediaRows;
    return culFetchMedia(sb);
  });
}

function culFetchMedia(sb){
  window.__culMediaLoaded = true;
  /* RLS already restricts anon reads to approved + active, so this is defence in depth rather
     than the only gate — but an unapproved or dead embed must never reach a surface even if a
     policy is later loosened. */
  return sb.from('videos')
    .select('id,provider,media_kind,title,creator_name,creator_profile_url,source_url,embed_url,thumbnail_url,published_at,own_content')
    .eq('review_status','approved').eq('embed_status','active')
    .order('published_at',{ascending:false}).limit(100)
    .then(function(r){
      if(r.error || !r.data) return window.__culMediaRows;
      window.__culMediaRows = r.data.map(culMediaToRow);
      return window.__culMediaRows;
    }).catch(function(){ return window.__culMediaRows; });
}

function culLiveRows(){
  var feed = (window.__culAllRows||[]).filter(function(x){ return !x.archived; });
  return feed.concat(window.__culMediaRows||[]);
}

function culInventory(test){
  var rows = culLiveRows().filter(test);
  var cats = {};
  rows.forEach(function(x){
    var d=x.data||{}; var c=d.category||d.genre||x.kind;
    if(c) cats[String(c).toLowerCase()]=1;
  });
  return { items:rows.length, categories:Object.keys(cats).length };
}

/* Owner's labels and spelling: FEED · ARTICLE · VIDEO · PIXLE. */
var CUL_FILTERS = [
  { id:'feed',    label:'Feed',    gated:false, test:function(){ return true; } },
  { id:'article', label:'Article', gated:false, test:function(x){ return x.kind==='article'; } },
  /* These two read media_kind, not kind — the distinction the ingester carries so that PIXLE and
     VIDEO can never show each other's content. Testing kind alone would let a photo record whose
     kind happens to read 'video' cross the boundary. */
  { id:'video',   label:'Video',   gated:true,  test:function(x){ return x.media_kind==='video'; } },
  { id:'pixle',   label:'Pixle',   gated:true,  test:function(x){ return x.media_kind==='photo'; } }
];

/* Resolves to the filters that should exist right now. */
function culResolveFilters(){
  /* Media MUST be loaded before the gate is evaluated. Resolving filters against an empty
     __culMediaRows counts zero items for VIDEO and PIXLE and holds both tabs — which is exactly
     the bug this wiring fixes, reintroduced one tick earlier. */
  return culLoadMedia().then(culTabThresholds).then(function(t){
    var open=[], held=[];
    CUL_FILTERS.forEach(function(f){
      if(!f.gated){ open.push(f); return; }
      if(!t){ held.push(f.id+': threshold-unavailable'); return; }
      var inv=culInventory(f.test);
      if(inv.items>=t.items && inv.categories>=t.categories){ open.push(f); }
      else held.push(f.id+': '+inv.items+'/'+t.items+' items, '+inv.categories+'/'+t.categories+' categories');
    });
    window.CULTURE_TAB_GATE_NOTE =
      'mounted: ' + open.map(function(f){return f.id;}).join(' · ') +
      (held.length ? '. held: ' + held.join(' | ') : '. none held');
    return open;
  });
}

  function isMob(){ try{ return window.matchMedia('(max-width:860px)').matches; }catch(e){ return false; } }
  function sync(){ document.body.classList.toggle('cul-m', isMob()); }
  sync(); window.addEventListener('resize', sync);
  if(!isMob()) return;

  /* 1 — §D.2: Culture becomes a full-screen pager. The mobile tab row and the type bar are
     both replaced by the pager's locked single-filter header, so neither is built here any
     more. Radio is not a Culture filter — it is a global destination since K1. */
  (function mountCulturePager(attempt){
    attempt = attempt || 0;
    if(!window.KIL_PAGER){ if(attempt<40) setTimeout(function(){ mountCulturePager(attempt+1); }, 250); return; }
    /* Rows arrive from Supabase, so the first pass is usually empty. */
    if(!Array.isArray(window.__culAllRows) || !window.__culAllRows.length || !window.__culCard){
      if(attempt<40){ setTimeout(function(){ mountCulturePager(attempt+1); }, 300); return; }
      window.CULTURE_TAB_GATE_NOTE = 'not-evaluated: feed rows never loaded';
      try{ console.warn('[culture] '+window.CULTURE_TAB_GATE_NOTE); }catch(e){}
      return;
    }

    culResolveFilters().then(function(open){
      /* SNAPSHOT per filter: the pager asks for items() on every settle, and a live query over
         a mutating list would give it a different answer each time. Radio hit exactly this. */
      var snap = {};
      var filters = open.map(function(f){
        return {
          id: f.id,
          label: f.label,
          items: function(){
            if(!snap[f.id]) snap[f.id] = culLiveRows().filter(f.test);
            return snap[f.id];
          },
          render: function(row, el){
            if(!row) return;
            el.innerHTML = window.__culCard(row);
            try{ if(window.__culHydrate) window.__culHydrate(); }catch(e){}
          }
        };
      });

      window.KIL_PAGER.mount({
        filters: filters,
        emptyFor: function(f){
          return { title:'Nothing in ' + f.label + ' yet',
                   body:'New posts appear here as they publish.' };
        }
      });

      /* The surfaces the pager replaces. */
      ['culMTabs','culTypeBar','culSwToast'].forEach(function(id){
        var el=document.getElementById(id); if(el) el.remove();

      card.classList.toggle('capopen');

  },true);

  function addBuy(){

      c.appendChild(a);
    });
  }
  /* 4 — 6th rail action: More (…) → the existing culPostMenu (view profile / copy / report) */
  function addMore(){
    if(!isMob()) return;
    [].forEach.call(document.querySelectorAll('.fcard .fb-actions'),function(act){
      if(act.querySelector('.fba-more')) return;
      var card=act.closest('.fcard'); if(!card) return;

      b.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if(typeof window.culPostMenu==='function') window.culPostMenu(ev, slug, location.origin+'/blog-'+slug+'.html');
      });
      act.appendChild(b);
    });
  }
  function enhance(){ addBuy(); addMore(); }
  enhance();
  new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
})();
