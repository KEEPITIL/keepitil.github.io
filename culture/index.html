<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--panel:rgba(255,255,255,.035);--brd:rgba(255,255,255,.09);--ink:#f4f2fb;--ink2:#9a94b4;--ink3:#6b6588;--purple:var(--purple-2);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;--fs:'Fraunces',serif}
html{scroll-behavior:smooth}
body{background:var(--bg,#0a0a0f);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:80px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
/* A flex-column body makes every child a flex item, and a flex item defaults to
   min-width:auto — it will not shrink below its own max-content width. Measured at
   375px: .wrap computed to 1120px while body{overflow-x:hidden} clipped the excess,
   hiding the overflow instead of fixing it. Releasing min-width is what lets the
   locked-footer flex body and a nowrap rail coexist. */
body>*{min-width:0}

a{color:inherit;text-decoration:none}
/* uniform pillar sub-nav */
.hubnav{position:relative;z-index:20;background:color-mix(in srgb,var(--bg,#0a0a0f) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line,rgba(255,255,255,.08))}
.hubnav .in{max-width:920px;margin:0 auto;display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.hubnav .in::-webkit-scrollbar{display:none}
.hubnav a{flex:1 1 0;text-align:center;justify-content:center;font-size:.82rem;font-weight:800;letter-spacing:.02em;padding:9px 8px;border-radius:999px;border:1px solid var(--line,rgba(255,255,255,.12));color:var(--muted,#9aa0b0);white-space:nowrap;text-decoration:none}
.hubnav a:hover{color:var(--text,#f0f0f0)}
.hubnav a.on{background:linear-gradient(90deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));color:#04121b;border-color:transparent}
@media(max-width:640px){.hubnav .in{overflow-x:auto}.hubnav a{flex:0 0 auto;padding:8px 15px}}
/* hero banner */
/* Founder 2026-08-24 artwork, one file per orientation — same pattern as /create and /earn.
   The mobile file is the 9:16 crop; without it, `cover` on a 16:9 image at phone width crops
   away both edges of the collage and leaves only the empty middle. Never darken it: the
   backdrop ships at full brightness site-wide (Founder 2026-08-23). */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg,#0a0a0f) url('/assets/images/culture-hero.jpg?v=20260824') center/cover no-repeat;opacity:1}
@media(max-width:860px){body::before{background-image:url('/assets/images/culture-hero-m.jpg?v=20260824')}}
html.has-season body::before{display:none!important} /* seasonal image takes over the hero backdrop on its dates */
:root{--brand:#a855f7;--brand-2:#c084fc;--glow:#a855f7} /* Culture = neon purple accent */
/* layout */
/* width:100% IS LOAD-BEARING — DO NOT DROP IT (KODE 2026-08-20, restored by Atlas 08-21).
   body is a flex column here, so .wrap is a flex ITEM. `margin:0 auto` is a cross-axis auto
   margin, and a cross-axis auto margin cancels align-items:stretch — .wrap then sizes to
   fit-content, which for a flex-wrap:nowrap card rail is wider than the phone. Mobile Safari
   responds by zooming the whole page out to fit. max-width:1120px still caps it on desktop.
   This was lost once already when a push overwrote the file; if it goes missing again the
   symptom is "the page is zoomed out", not a layout error. */
.wrap{max-width:1360px;margin:0 auto;padding:0 26px;width:100%}
/* ── LANDING PANEL (Founder 2026-08-24: "culture needs to have the same setup as a landing
   page similar to all the other pages. title and metric. same position. the page theme
   color is purple") ────────────────────────────────────────────────────────────────────────
   Identical geometry to /connect, /create and /earn so the four pillars open the same way:
   a full-viewport panel over the fixed backdrop, type dropped to the FOOT of it, then the
   content scrolls up into place.
   The 130px subtracted is the fixed top nav (70) + the radio bar (60) — that is what keeps
   the title and metrics readable above the player instead of tucked behind it. Do not
   "simplify" it to 100dvh. svh comes first so a collapsing iOS URL bar cannot resize the
   panel mid-scroll. */
/* width:100% IS LOAD-BEARING — DO NOT DROP IT. Same trap as .wrap below (see its comment).
   body is a flex column on THIS page only, so .hero is a flex ITEM. `margin:0 auto` is a
   cross-axis auto margin, and a cross-axis auto margin cancels align-items:stretch — .hero
   then sizes to fit-content, which is just the width of the title. The block collapses to the
   middle of the screen and the title and metrics read as centred, while /connect, /create and
   /earn (whose bodies are NOT flex) sit correctly on the left. width:100% restores the
   stretch; max-width:1360px still caps it. Founder 2026-08-24. */
/* LEFT EDGE IS /create's (Founder 2026-08-26: "title row, metric row, measurement space
   from the left of the screen" must match). Every landing panel now shares ONE measure —
   1120px with 16px side padding, which is what /create's .wrap gives .ce-hero. The pages
   had drifted to four different insets: create 1120/16, earn 1120/16, connect and culture
   1360/30, discovery 1180/24. Same-looking titles, four different left edges. */
.hero{position:relative;padding:6px 16px 40px;max-width:1120px;margin:0 auto;width:100%;overflow:hidden;
  min-height:calc(100svh - 130px);min-height:calc(100dvh - 130px);
  display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;}
.hero::before{content:"";position:absolute;top:-160px;left:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.32),transparent 62%);filter:blur(20px);z-index:-1;}
.hero::after{content:"";position:absolute;top:-90px;right:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.20),transparent 62%);filter:blur(20px);z-index:-1;}
.hero-head{width:max-content;max-width:100%;}
/* CULTURE is neon purple — the page theme (Founder 2026-08-24). CONNECT is green, so the
   gradient stops are the only thing that differs between the two heroes. */
.hero h1{font-family:var(--fh);font-size:clamp(3.6rem,13vw,8rem);line-height:.88;letter-spacing:.02em;filter:drop-shadow(0 4px 26px rgba(0,0,0,.7));background:linear-gradient(120deg,#EBD9FF 12%,#C084FC 48%,#A855F7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{max-width:640px;color:var(--ink2);margin-top:12px;font-size:1.02rem;}
.stats{display:flex;gap:46px;margin-top:22px;flex-wrap:wrap;}
.stat b{font-family:var(--fh);font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:.02em;line-height:1;display:block;text-shadow:0 2px 18px rgba(0,0,0,.7);color:#C084FC;}
.stat span{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#c9c2e0;margin-top:5px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7);}
.stat.articles b{color:#EBD9FF;}.stat.photos b{color:#C084FC;}.stat.videos b{color:#A855F7;}
/* MOBILE METRICS — one centred row, matching /connect, /create and /earn.
   ⚠ THIS BLOCK MUST STAY BELOW THE BASE .stats/.stat RULES. A media query adds no
   specificity, so above them the base `gap:46px;flex-wrap:wrap` wins on source order and the
   metrics wrap to two rows on a phone. */
@media(max-width:860px){
  /* align-items must flip too — the desktop rule pins children to flex-start, which would
     defeat the centring that `text-align` and the auto margins are doing here. */
  /* Founder 2026-08-24 — see connect/index.html for why the base 130px is wrong on a phone.
     Culture's hero is hidden below (the swipe feed owns mobile), but the rule stays correct so
     the four surfaces do not drift if that ever changes. */
  .hero{text-align:center;padding:42px 18px 14px;align-items:center;
    min-height:calc(var(--kil-vh,100dvh) + var(--kil-safe-top,0px));}
  .hero-head{width:auto;margin:0 auto;}
  .hero p{margin-left:auto;margin-right:auto;}
  .stats{display:flex;flex-wrap:nowrap;justify-content:center;gap:min(6vw,26px);margin-top:18px;}
  .stat{flex:0 1 auto;min-width:0;text-align:center;}
  .stat b{font-size:clamp(1.4rem,6.5vw,2rem);}
  .stat span{font-size:.56rem;letter-spacing:.09em;margin-top:4px;}
}
.chero-intro{min-height:calc(100vh - 132px);min-height:calc(100dvh - 132px);display:flex;align-items:flex-end;justify-content:center;padding:0 20px 42px}
.chero-cue{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;opacity:.82;text-shadow:0 2px 12px rgba(0,0,0,.55);cursor:pointer}
.chero-cue span{font-family:var(--fh,inherit);font-size:.72rem;letter-spacing:.26em;font-weight:800}
.chero-cue .arw{font-size:1.5rem;line-height:1;animation:cbounce 1.8s ease-in-out infinite}
@keyframes cbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@media(max-width:940px){.chero-intro{min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);padding-bottom:34px}}
/* V3.1 = FEED ONLY (immutable template): one centered column, no discovery rail */
.merge{display:block;max-width:600px;margin:22px auto 40px}
@media(max-width:940px){.merge{grid-template-columns:1fr}}
/* LEFT feed */
.feedcol{position:static}
@media(max-width:940px){.feedcol{position:static}}
.feedhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:56px;box-sizing:border-box;padding:8px 8px 8px 18px;background:rgba(14,13,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.34)}
/* DESKTOP: hide the +/All/Feed-Following row entirely — mobile keeps it (Founder 2026-07-18) */
@media(min-width:861px){.feedhd{display:none}}
.feedhd h2{font-family:var(--fs);font-weight:900;font-size:1.4rem;color:#fff;display:flex;align-items:center;gap:11px}
.feedhd h2::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));box-shadow:0 0 10px color-mix(in srgb,var(--brand,#00b4ff) 70%,transparent);flex:0 0 auto}
.feedhd .now{font-family:var(--fh);letter-spacing:.1em;font-size:.8rem;color:var(--purple)}
.toggle{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px;gap:2px}
.feeddd{position:relative;margin-left:auto}
.feeddd-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--fh);font-weight:800;letter-spacing:.12em;font-size:.9rem;color:#a06bff;background:transparent;border:1.5px solid #a06bff;border-radius:11px;padding:9px 18px;cursor:pointer;box-shadow:0 0 10px rgba(160,107,255,.5),inset 0 0 8px rgba(160,107,255,.14);text-shadow:0 0 6px rgba(160,107,255,.5)}
.feeddd-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:80;background:#15151f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.feeddd-menu.open{display:block}
.feeddd-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8e8f0;font-size:.92rem;font-weight:700;letter-spacing:.02em;padding:11px 12px;border-radius:8px;cursor:pointer}
.feeddd-menu button.on,.feeddd-menu button:hover{background:rgba(255,255,255,.09);color:#fff}
.toggle button{font-family:var(--fh);letter-spacing:.1em;font-size:.82rem;color:var(--ink2);background:none;border:0;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .18s}
.toggle button:hover{color:#fff}
.toggle button.on{background:linear-gradient(90deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));color:#04121b;box-shadow:0 2px 12px color-mix(in srgb,var(--brand,#00b4ff) 42%,transparent)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed::-webkit-scrollbar{display:none;width:0;height:0}
@media(max-width:940px){.feed{max-height:none;overflow:visible}}
/* Mobile = FEEDs only (Founder directive 2026-07-16): hide intro + discovery column; "+" add-post and ♥ notifications appear in the feed header */
.cul-add,.cul-heart{display:none;align-items:center;justify-content:center;flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font-size:1.25rem;font-weight:800;line-height:1;text-decoration:none;cursor:pointer}
.cul-heart svg{width:20px;height:20px}
/* Culture mobile top bar — gear (logged-in Type/Filter) + full-width dropdown (Founder 2026-07-29) */
.cul-gear{display:none;align-items:center;justify-content:center;flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font-size:1.2rem;line-height:1;cursor:pointer}
.cul-gear-menu{display:none;position:absolute;top:calc(100% + 6px);left:8px;z-index:85;background:#15151f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px;min-width:240px;max-width:82vw;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.cul-gear-menu.open{display:block}
.cul-gear-menu .gm-h{font:800 .6rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8a8a99;margin:4px 4px 6px}
.cul-gear-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8e8f0;font-size:.9rem;font-weight:600;padding:9px 11px;border-radius:8px;cursor:pointer}
.cul-gear-menu button small{display:block;font-weight:400;color:#8a8a99;font-size:.72rem;margin-top:1px}
.cul-gear-menu button.on,.cul-gear-menu button:hover{background:rgba(255,255,255,.09);color:#fff}
.cul-gear-menu hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:9px 0}
/* Filter A — content-type bar, scroll L/R (Founder 2026-07-31) */
.cul-typebar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0 12px;margin:0 0 6px}
.cul-typebar::-webkit-scrollbar{display:none}
.cul-typebar button{flex:0 0 auto;font-family:var(--fh,inherit);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:#cfc9e6;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .15s}
.cul-typebar button:hover{color:#fff;border-color:rgba(160,107,255,.5)}
.cul-typebar button.on{background:linear-gradient(90deg,#00b4ff,#5cc8ff);border-color:transparent;color:#04121b}
/* FILTERS REMOVED FROM CULTURE — Founder 2026-08-19: "the culture page on the desktop does not
   have the filters and the mobile version should match that as well."
   Desktop lost them on 2026-08-18; mobile kept #culMTabs and .cul-typebar, so the two
   breakpoints disagreed. Hidden here rather than deleted because the mount code, the tab-gate
   thresholds and the swipe handler all still reference these ids — ripping the markup out would
   mean touching five call sites to remove one bar. One rule, no orphaned references. */
.cul-typebar,#culMTabs{display:none!important}
/* Desktop subpage tabs (Feed / Radio / VS) — Founder 2026-08-04 */
.cul-subpages{display:none}
@media(min-width:861px){
  .cul-subpages{display:flex;gap:8px;margin:0 0 14px}
  .cul-subpages .csp{flex:0 0 auto;font-family:var(--fh);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.82rem;color:#cfc9e6;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 20px;cursor:pointer;transition:all .15s}
  .cul-subpages .csp:hover{color:#fff;border-color:rgba(160,107,255,.5)}
  .cul-subpages .csp.on{background:linear-gradient(90deg,#a855f7,#c084fc);border-color:transparent;color:#0a0710}
}
/* Vertical content-type rail — desktop only (Founder 2026-08-04): icons that expand to reveal their label on hover */
.cul-vrail{display:none}
@media(min-width:861px){
  .cul-vrail{display:flex;flex-direction:column;gap:9px;position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40}
  .cul-vrail .cvr{display:flex;align-items:center;gap:13px;width:58px;height:58px;padding:0 15px;overflow:hidden;white-space:nowrap;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(14,13,22,.82);backdrop-filter:blur(12px);color:#cfc9e6;cursor:pointer;transition:width .18s ease;box-sizing:border-box}
  .cul-vrail .cvr .ic{font-size:1.55rem;flex:0 0 auto;line-height:1;width:26px;text-align:center}
  .cul-vrail .cvr .tx{font-family:var(--fh);font-weight:800;letter-spacing:.08em;font-size:.9rem;opacity:0;transition:opacity .12s}
  .cul-vrail:hover .cvr{width:180px}
  /* subpage dropdown (Founder 2026-08-04): one icon for Feed/Radio/VS */

  .cul-vrail .vr-subdd{position:absolute;right:66px;top:0;display:none;flex-direction:column;gap:2px;background:#15131f;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px;min-width:150px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .cul-vrail .vr-subdd.open{display:flex}
  .cul-vrail .vr-subdd button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#e6e2f2;font-size:.95rem;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
  .cul-vrail .vr-subdd button .ic{font-size:1.2rem}
  .cul-vrail .vr-subdd button:hover{background:rgba(255,255,255,.09);color:#fff}
  .cul-vrail:hover .cvr .tx{opacity:1}
  .cul-vrail .cvr.on{background:linear-gradient(90deg,#a855f7,#c084fc);border-color:transparent;color:#0a0710}
  .cul-vrail .vr-div{width:34px;height:1px;background:rgba(255,255,255,.2);align-self:flex-end;margin:4px 6px 4px 0}
  .cul-vrail .cvr.sp.on{background:linear-gradient(90deg,#7c3aed,#a855f7);border-color:transparent;color:#fff}
  .cul-vrail .cvr.sf.on{background:linear-gradient(90deg,#3aa5ff,#5cc8ff);border-color:transparent;color:#04121b}
}
/* ── MOBILE (Founder 2026-08-02): the EXPLORE page-dropdown fills the top; a horizontal swipe
   cycles the subfilter (type) pages of the current section. Bottom nav is untouched. ── */
@media(max-width:860px){

  #feedDD .feeddd-btn{display:flex;width:100%;justify-content:center}

}

/* Givebacks / VS section panels */

.gb-card .gb-k{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#00e0a4}
.gb-card h3{font-size:1.05rem;margin:6px 0 4px}
.gb-card p{color:var(--ink2,#9aa);font-size:.82rem;line-height:1.4}
@media(max-width:860px){
  .chero-intro,.discovercol{display:none!important}
  /* ⚠ The hero was `display:none!important` here from 2026-08-22 until 2026-08-24. That was
     correct ONLY while #community-feed was position:fixed over the viewport — a panel under a
     fixed feed is covered, not scrolled past. The feed is back in normal flow now, so the
     panel works and the Founder has asked for it:
       "the culture page needs to start like the other pages with a title and metric only and

/* ── FILTER BAR: DIRECTIONAL OVERLAY, MOBILE ONLY (Founder 2026-08-28) ────────────────────
   Forward through the feed (finger up, content moves up, scrollTop RISING) -> hide at once.
   Reversing back toward the top (finger down, scrollTop FALLING)           -> reveal briefly.
   No interaction within HIDE_MS -> it leaves on its own.

   Desktop is deliberately untouched: the CSS overlay rules live inside @media(max-width:860px)
   and this controller returns early above that width, so the desktop bar stays the sticky
   in-flow control it already was.

   The threshold is not decoration. iOS reports sub-pixel scroll deltas during momentum and at
   the rubber-band limits, and without it a single flick toggles the bar several times — which
   is the flicker the Founder asked to avoid. 6px is below the smallest deliberate drag and
   above the noise. */
(function(){
  var HIDE_MS = 1800;   /* Founder: "roughly 1.5-2 seconds ... intentional rather than flickering" */
  /* ⚠ THE TWO THRESHOLDS ARE DELIBERATELY ASYMMETRIC.
     Hiding is cheap and should be instant, so any real downward movement triggers it.
     REVEALING must survive a snap settle. This feed is scroll-snap-type:y mandatory with
     full-viewport cards, so every forward swipe ENDS in the browser animating the card into
     place — and that settle can overshoot and correct UPWARD by a few pixels. Under one
     symmetric threshold that upward correction reads as "the user reversed" and the bar would
     flash at the end of every single swipe forward, which is precisely the flicker this is
     meant to avoid. So a reveal needs sustained upward travel, accumulated across events,
     not one upward frame. A deliberate reverse swipe moves hundreds of pixels; a settle
     correction moves tens at most. */
  var DOWN_HIDE  = 6;    /* any real forward movement hides at once */
  var UP_REVEAL  = 28;   /* cumulative upward travel required to reveal */
  function mob(){ try{ return window.matchMedia('(max-width:860px)').matches; }catch(e){ return false; } }

  var bar = null, timer = null, upAcc = 0;
  var lastY = window.pageYOffset || document.documentElement.scrollTop || 0;

  function el(){ return bar && document.contains(bar) ? bar : (bar = document.getElementById('culTypeBar')); }
  function hide(){
    if(timer){ clearTimeout(timer); timer = null; }
    upAcc = 0;                   /* a new reveal must earn its travel again */
    document.body.classList.remove('cul-fbar');
  }
  function arm(){ if(timer) clearTimeout(timer); timer = setTimeout(hide, HIDE_MS); }
  function show(){
    if(!el()) return;
    document.body.classList.add('cul-fbar');
    arm();                       /* every reveal restarts the clock */
  }

  window.addEventListener('scroll', function(){
    if(!mob()) return;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var d = y - lastY;
    lastY = y;
    if(d > DOWN_HIDE){                    /* moving forward through the feed */
      hide();                             /* (hide() also clears upAcc) */
    } else if(d < 0){                     /* heading back up */
      upAcc += -d;
      if(upAcc >= UP_REVEAL){ upAcc = 0; show(); }
    }
  }, {passive:true});

  /* Touching the bar means the visitor is using it — do not pull it away mid-decision.
     Choosing a filter dismisses it, because the choice is made and the feed underneath is
     what they want to see. */
  document.addEventListener('pointerdown', function(e){
    var b = el(); if(!b || !document.body.classList.contains('cul-fbar')) return;
    if(b.contains(e.target)) arm();
  }, {passive:true, capture:true});
  document.addEventListener('click', function(e){
    var b = el(); if(!b || !b.contains(e.target)) return;
    if(e.target.closest('button')) setTimeout(hide, 260);   /* let the .on state paint first */
    else arm();
  }, true);

  /* A filter chosen from the METRIC row (the other door) happens while the overlay is hidden;
     nothing to reveal, and nothing to keep open. */
  window.addEventListener('resize', function(){ if(!mob()) hide(); });
})();

/* Keyboard parity for the metric row: it is role="button", so it must answer Enter and Space. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var st=e.target && e.target.closest && e.target.closest('.stats .stat'); if(!st) return;

/* K5 — PIX matched nothing.
   It tested kind==='photo'||'image', and profile_content has no such kind: the values are
   post, event and article. So the Pix tab was live in the nav and returned an empty feed,
   while 201 rows DO carry an image — at data.img, not as a kind. That is why the directive
   lists PIX at 201 while the tab showed zero.
   Takes the whole row now, because "has a picture" is a property of the row, not of its kind. */
function _culTypeMatch(row){
  /* ⚠ THE THREE FEEDS ARE MUTUALLY EXCLUSIVE (Founder 2026-08-28: "articles needs to only be
     in the article filter feed / photos only stay on the photo filter feed / videos should be
     the default feed").
     THE BUG THIS REPLACES: there was no 'video' branch at all. The function ended in
     `return true`, so ANY filter other than all/article/image matched every row — and since
     culContentType defaults to 'video', the default feed was silently "everything". Measured
     on production at 375px: culContentType==='video' with 133 cards rendered, of which 33 were
     not videos. Articles and posts were sitting in the video feed for exactly this reason.
     The tail is now `return false`: an unrecognised filter shows NOTHING rather than
     everything, so the next filter added here fails loudly instead of leaking every row. */
  var k  = String((row && row.kind) || '').toLowerCase();
  var mk = String((row && row.media_kind) || '').toLowerCase();
  var d  = (row && row.data) || {};

  if(culContentType === 'all') return true;

  if(culContentType === 'article') return k === 'article';

  if(culContentType === 'video'){
    /* culMediaToRow() maps media_kind 'photo' -> kind 'pixle' and everything else -> 'video',
       so kind alone separates the media feeds. embed_url is required as well: a video row with
       no embed cannot play, and a card that cannot play does not belong in a video feed.
       CREATE work is excluded even when it is a video — it has its own stream now. */
    if(k !== 'video') return false;
    var em = d.embed_url;
    return typeof em === 'string' && em.trim() !== '';
  }

  if(culContentType === 'create'){
    /* ⚠ CREATE REPLACED PHOTO (Founder 2026-08-28 §2/§5): "Culture now has exactly three
       content filters: ARTICLE · CREATE · VIDEO. Remove PHOTO."
       A CREATE item is submitted creative work tied to a valid CREATE entry — identified by
       the entry relationship, never by "it happens to be an image". That distinction is the
       whole point: ordinary profile photos and stray Culture images must not appear here.
       Legacy photo rows are NOT deleted (§2) — they simply no longer have a surface. */
    return k === 'create' && !!row.vs_entry_id;
  }

  return false;
}
function applyCulFilters(){
  var box=document.getElementById('community-feed'); if(!box||!window.__culRenderRows) return;
  var cf=document.getElementById('community-feed'); if(cf)cf.style.display='';

     videos out of every signed-in render. */
  var rows=(window.__culMerged || window.__culAllRows || []).slice();
  /* Filter A — content type */
  /* Archived rows are removed content and must never render. The feed never filtered
     them: 280 of 628 rows — 45% of what Culture showed — were archived. Live totals are
     article 294, event 43, post 11. */
  rows=rows.filter(function(x){ return !x.archived; });
  rows=rows.filter(function(x){ return _culTypeMatch(x); });
  /* Filter (gear) */
  if(culFilter==='articles'){ rows=rows.filter(function(x){ return x.kind==='article' && CUL_AGENTS[String(x.profile_slug||'').toLowerCase()]; }); }

            thumb:media.src||d.img||d.cover||r.author_avatar||'/assets/images/blog-default.jpg',
            aspect:'1/1.02', fit:'contain',
            video:(media.mtype==='video'&&media.src)?media.src:'', poster:d.cover||'',
            title:d.t||'',
            name:r.author_name||r.profile_slug, avatar:r.author_avatar, creatorHref:url,
            meta:'', caption:d.html||'',
            cta: d.buy_url ? {label:'\ud83d\uded2 '+(d.buy_label||'Buy on Amazon'), href:d.buy_url,
                              bg:'#ff9900', fg:'#111', external:true, rel:'noopener sponsored nofollow',
                              note:d.disclosure||'#ad \u00b7 affiliate'} : null };
    }
    return kvRenderCard(n);
  }
  function boot(n){
    var sb=window.__culSB;
    if(!sb){ if(n<30){ setTimeout(function(){boot(n+1);},400); } return; }
    function run(viewer){
      /* ranked feed: server-side score = engagement velocity + recency/quality + personalization (follows + affinity) */
      sb.rpc('get_culture_feed', viewer?{p_limit:20,p_viewer:viewer}:{p_limit:20}).then(function(r){
        var rows=(r&&r.data)||[];
        var box=document.getElementById('community-feed'); if(!box) return;
        rows=rows.filter(function(x){ return !(x.kind==='event' && /^venue-/.test(x.profile_slug||'')); }); /* event shows once (owner copy); venue copy lives on the venue page */
        window.__culAllRows=rows;
        /* render function used by both initial paint and the gear Type/Filter (Founder 2026-07-29) */
        /* §D.2: the pager renders ONE row per slide, so it needs the same card builder the feed
           uses. Exposed rather than duplicated — a second card renderer would drift. */
        window.__culCard=card;
        window.__culRenderRows=function(list){ var b=document.getElementById('community-feed'); if(!b)return;
          if(!list||!list.length){ b.innerHTML=''; return; }
          /* ONE BAD CARD MUST NOT EMPTY THE FEED. list.map(card) is a single expression: if card()
             throws on row 7 of 120, the whole map throws and the page renders nothing — which is
             exactly what happened on 2026-08-21 when a renderer referenced a variable that had not
             been assigned yet, and every YouTube video disappeared. Each card is now built in
             isolation; a failure drops that one row and says so in the console. */
          b.innerHTML=list.map(function(row){
            try{ return card(row); }
            catch(e){ console.error('[culture] card failed to render', (row&&row.id), e); return ''; }
          }).join('');
          try{ if(window.__culHydrate) window.__culHydrate(); }catch(e){} };
        /* MEDIA WAS NEVER RENDERED (Founder 2026-08-19: "i do not see the youtube videos only
           the events"). __culMediaRows was fetched only to count inventory for the tab gate and
           was merged in culLiveRows(), which nothing on the render path called — so approved
           videos existed, were queried, and were then dropped on the floor. Load media, merge it
           with the ranked feed and sort by date so a video sits in the timeline rather than in a
           separate tab nobody opens. */
        function paint(){
          var merged = (window.__culAllRows||[])
            .concat(window.__culMediaRows||[])
            .concat(window.__culArticleRows||[])
            .filter(function(x){ return !x.archived; })
            .sort(function(a,b){ return Date.parse(b.created_at||0) - Date.parse(a.created_at||0); });
          window.__culMerged = merged;
          /* ⚠ THE FILTER APPLIES TO EVERYONE, SIGNED IN OR NOT (Founder 2026-08-28).
             This was gated on __culSignedIn: a signed-out visitor went straight to
             __culRenderRows(merged) and the content-type filter was never applied at all.
             Measured on production right after the exclusive-feed fix shipped: culContentType
             was 'video' and the feed still rendered 20 cards, every one of them a non-video —
             because nothing on the signed-out path ever consulted the filter. Fixing
             _culTypeMatch alone could not have shown up here; the function was not being called.
             loadCulRelations() stays signed-in-only (it needs a viewer); the RENDER does not. */
          if(window.__culSignedIn){
            try{ if(typeof loadCulRelations==='function') loadCulRelations(); }catch(e){}
          }
          if(typeof applyCulFilters==='function'){
            try{ applyCulFilters(); }
            catch(e){ console.error('[culture] applyCulFilters threw', e); window.__culRenderRows(merged); }
          } else { window.__culRenderRows(merged); }
          /* SELF-HEAL — Founder 2026-08-20: "the culture page has no content. its empty."
             The signed-in path routes through applyCulFilters(), and if any filter in that chain
             yields nothing (or something later re-renders over it) the page goes blank while the
             data sits in memory — 120 rows loaded, 0 shown. An empty feed with rows available is
             ALWAYS a bug, never a legitimate state, so render them directly rather than leave a
             visitor staring at nothing. */
          /* ⚠ THE GUARD MUST RESPECT THE FILTER (Founder 2026-08-28).
             Its premise — "an empty feed with rows available is ALWAYS a bug" — was true when
             no content-type filter actually worked. It is false now: Photos legitimately
             matches 0 of 133 rows, and the first paint runs before the videos have loaded, so
             the video feed is briefly empty too. In both cases this fired and re-rendered the
             WHOLE merged list unfiltered, which put articles and posts straight back into the
             video feed and reset the video player to the first card. Observed on production
             three times in one session: "[culture] feed rendered empty with 20 rows — forcing
             direct render".
             The real invariant is narrower: never blank the feed when rows PASS THE CURRENT
             FILTER. If nothing passes, an empty feed is the correct answer, not a fault. */
          try{
            var box=document.getElementById('community-feed');
            var passing = merged.filter(function(x){
              try{ return !x.archived && _culTypeMatch(x); }catch(e){ return false; }
            });
            if(passing.length && box && box.children.length===0){
              console.warn('[culture] feed rendered empty with '+passing.length+
                           ' rows passing the '+culContentType+' filter — forcing direct render');
              window.__culRenderRows(passing);   /* the FILTERED list, never the raw merge */
            }
          }catch(e){ console.error('[culture] repaint guard failed', e); }
        }
        /* Paint the feed immediately, then repaint once media arrives — a slow videos query must
           never delay the text feed, and must never blank it if it fails. */
        paint();
        /* culLoadMedia() is declared in a LATER <script> block (line ~871) than this one, so at
           boot time it is frequently not defined yet. The first version of this call was wrapped
           in a bare try/catch, which swallowed the ReferenceError in silence: the feed painted,
           the videos never loaded, and nothing anywhere said why. Same failure class as the
           `.catch()` that took /create down — a defensive catch hiding a real fault.
           Now: wait for the function to exist, and if it never does, SAY SO. Broken must never
           look like empty. */
        (function waitForMedia(n){
          if(typeof culLoadMedia !== 'function'){
            if(n < 40) return setTimeout(function(){ waitForMedia(n+1); }, 250);
            console.error('[culture] culLoadMedia never became available — video feed cannot load');
            return;
          }
          culLoadMedia().then(paint).catch(function(e){
            console.error('[culture] media load failed', e);
          });
        })(0);
        /* Articles load on the same pattern and for the same reason: declared in a later script
           block, so wait for the function rather than swallowing a ReferenceError. A failure
           here must be LOUD — a silently empty article feed is exactly how the eleven live
           article pages stayed invisible for weeks. */
        (function waitForArticles(n){
          if(typeof culLoadArticles !== 'function'){
            if(n < 40) return setTimeout(function(){ waitForArticles(n+1); }, 250);
            console.error('[culture] culLoadArticles never became available — article feed cannot load');
            return;
          }
          culLoadArticles().then(paint).catch(function(e){
            console.error('[culture] article load failed', e);
          });
        })(0);
      }).catch(function(e){ console.error('[culture] feed boot failed', e); });
    }
    try{ sb.rpc('my_profile_slug').then(function(rr){ run(rr&&!rr.error&&rr.data?rr.data:null); }).catch(function(){ run(null); }); }catch(e){ run(null); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){boot(0);});
  else boot(0);
})();
</script>

<!-- ══════════════════════════════════════════════════════════════════════════════════════
     MOBILE CULTURE (Founder 2026-08-04, handoff #44) — story-format feed.
     STRICTLY ≤860px. Desktop is untouched: every rule is inside the media query and the JS
     no-ops above 860px. Reuses the EXISTING .fb-actions buttons as the vertical rail, so
     like/comment/repost/share/save/more stay wired to the live backend with no rewiring.
     Values are proportional to the Founder's locked 302x600 frame.
     ══════════════════════════════════════════════════════════════════════════════════════ -->
<style>
@media(max-width:860px){

    background:#0a0a0f;height:46px;align-items:center}

    background:rgba(255,255,255,.05);color:#e8e6f2;font:800 .82rem/1 var(--fh,Inter),sans-serif;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  #culMTabs button.on{background:linear-gradient(90deg,var(--brand,#00b4ff),var(--brand-2,#5cc8ff));
    border-color:transparent;color:#04121b}
  /* the old wrap-around header is replaced by the tabs on mobile */
  body.cul-m .feedhd{display:none!important}

  /* ── subfilter carousel: transparent, directly below the tabs (6,44 290x30) ── */
  body.cul-m .cul-typebar{position:sticky;top:46px;z-index:65;background:transparent;
    margin:0 0 4px;padding:2px 0 6px;height:36px;align-items:center}
  body.cul-m .cul-typebar button{background:rgba(255,255,255,.06);font-size:.72rem;padding:6px 13px}

  /* full-bleed: cards run edge-to-edge so the rail/caption land on the screen edges the
     Founder measured against (otherwise the column padding insets everything) */
  body.cul-m .wrap{padding-left:0!important;padding-right:0!important}
  body.cul-m .feedcol,body.cul-m .merge{max-width:none!important;padding-left:0!important;padding-right:0!important}
  body.cul-m #community-feed,body.cul-m #feed{padding-left:0!important;padding-right:0!important}
  /* the tabs + subfilter row keep their own inset so they don't sit flush to the bezel */
  body.cul-m #culMTabs,body.cul-m .cul-typebar{padding-left:2%;padding-right:2%}
  /* ── SWIPE UP / DOWN BETWEEN POSTS (Founder 2026-08-21) ────────────────────────────────
     Built with CSS scroll-snap on the normal document scroll, NOT by re-enabling the pager.
     The pager took every card out of the document and drove them itself, which is what
     collapsed all 91 cards on top of each other on 2026-08-20. Snap points give the same
     one-post-per-swipe feel while every card stays in normal flow, so if the CSS is ever
     dropped the page degrades to an ordinary scrolling feed instead of breaking.
     scroll-snap-stop:always is what makes a fast flick advance ONE post rather than five. */
  /* ONE POST, LOCKED TO THE SCREEN (Founder 2026-08-22/23) ─────────────────────────────
     FIXED BOX, NOT VIEWPORT MATH. This was calc(100dvh - --kil-bnav-h - safe-area) and it did
     not fit: --kil-bnav-h is measured at runtime and already includes the bottom safe-area, so
     subtracting the inset a second time made every card the wrong height, and on the first paint
     the variable is not set at all. Anchoring the scroller to the viewport edges instead means
     the browser does the arithmetic — it cannot be off, and it lands exactly on top of the nav
     whatever height that nav turns out to be. */
  /* ⚠ #community-feed ONLY — NOT #feed. Both containers are shown together, and #feed sits
     AFTER #community-feed in the DOM, so making both position:fixed stacked the blog list
     directly on top of the video feed and hid every video behind it. That is why the videos
     "would not load" on mobile: they were rendering, painting, and being covered. */
  /* ── THE CARD OWNS THE VIEWPORT (Founder 2026-08-24) ──────────────────────────────────
     "A Culture card should occupy exactly: bottom of status bar -> top of bottom navigation.
      No unexplained black band above the media. No black band below the interaction area.
      No page-level vertical margin. Think TikTok/Reels rather than a conventional webpage."

     The offsets are the SHELL's published variables, not env() and not a guess. --kil-safe-top
     is the measured height of the black status layer and --kil-bnav-h the measured height of
     the nav, so this frame is identical in Safari, in the Home Screen PWA and in a native
     wrapper — the three contexts that report three different insets for the same phone. The
     old `top:env(safe-area-inset-top)` was only correct in one of them.
     background:#000 is load-bearing: the feed used to be transparent, so any pixel the card
     did not cover showed the purple backdrop through it — that is the band the Founder saw
     under the comments row. */
  /* ── CULTURE OPENS LIKE EVERY OTHER PAGE (Founder 2026-08-24) ─────────────────────────────
     "the culture page needs to start like the other pages with a title and metric only and
      then swipe scroll up by content."

     This REVERSES the 2026-08-22 design. The feed was `position:fixed` over the whole viewport,
     which is why the hero had to be hidden — a landing panel under a fixed feed is covered, not
     scrolled past. A fixed feed and a landing panel cannot coexist, so the feed comes back into
     NORMAL FLOW and the snapping moves to the document scroller.
     Consequences, all deliberate:
       · the hero is no longer hidden (see the rule below)
       · body{overflow:hidden} is gone — the document is the scroller again
       · each card is a snap point sized to --kil-vh, so it lands in the same frame every time
       · the hero is itself the FIRST snap point, so the page opens on title + metrics and one
         swipe moves to the first post
     The IntersectionObserver needs no change: it already re-points its root to the viewport
     when #community-feed stops being an `overflow-y:auto` scroller. */
  body.cul-m #community-feed{
    position:static;margin:0;padding:0;background:#000}
  /* justify-content was `center`, which is what put equal dead bands above the media and below
     the actions whenever the content was shorter than the frame. The card is now a column that
     FILLS: the media well takes every pixel the body does not, so there is nothing left over to
     distribute. Next swipe snaps into the identical frame because every card is exactly 100%. */
  /* height is --kil-vh, NOT 100% — the parent is no longer a fixed box with a known height, so
     a percentage would resolve against `auto` and collapse. --kil-vh is the shell's measured
     status-layer-to-nav band, which is exactly the frame the Founder specified. This also
     closes the gap between the last card and the nav: the card ENDS where the nav begins
     instead of being sized against a viewport unit that ignores the nav. */
  body.cul-m #community-feed>.fcard{
    scroll-snap-align:start;scroll-snap-stop:always;
    /* R4.4 — the FALLBACK now computes what the shell would, instead of guessing 62px.
       --kil-vh is published after the shell measures; until then the card fell back to
       100dvh - 62px, which is short by the safe area, so the next card's head bled in above
       the nav. env() is readable from CSS immediately, so the card is correct on first paint
       and identical once --kil-vh arrives.
       ⚠ env(safe-area-inset-BOTTOM) is deliberately absent: --kil-bnav-h already contains it,
       and double-counting it is the exact defect that produced three earlier bugs here. */
    /* ⚠ DO NOT "UNIFY" THIS WITH --kil-vh. It looks like a duplicate of the shell's variable
       and it is not — the two are both correct, in different contexts, and merging them breaks
       signed-off pages. Decision recorded R7, 2026-08-24:
         · A LANDING PANEL (the heroes on /, /connect, /create, /earn) is seen at load with the
           URL bar EXPANDED. --kil-vh is a JS snapshot of innerHeight taken at that moment, which
           is the true band while a hero is on screen. Re-deriving it from dvh would size every
           hero for a collapsed URL bar it has not reached yet, growing each one ~40px and
           pushing the metrics behind the nav on four pages the Founder has signed off.
         · THIS CARD is seen mid-scroll with the URL bar COLLAPSED. 100dvh is correct here, and
           the load-time snapshot is 40px short — which was the next-card bleed.
       The shell keeps publishing --kil-vh for the heroes; this stays on dvh. See the same note
       in keepitil-shell.js's publishBarHeight (to be added next time the shell ships).
       R4.4 — MEASURED, not assumed. With ?kildebug=1 on an iPhone 17 Pro in Safari:
         safe-top 0px · bnav-h 59px · innerH 754 · navTop 695 · --kil-vh 655 · card 655
       The true band is 754-0-59 = 695, and navTop confirms 695. --kil-vh was 655 — short by
       exactly 40px, which is the strip the next card was bleeding through. The shell computes
       --kil-vh once from innerHeight; Safari's innerHeight grows by ~40px as the URL bar
       collapses, so the published value is stale from that moment on.
       100dvh IS the dynamic viewport and tracks that change by definition, so the card is
       correct at every URL-bar state without the shell having to re-measure. --kil-vh is
       deliberately no longer consulted for this height.
       ⚠ env(safe-area-inset-BOTTOM) stays absent: --kil-bnav-h already contains it. */
    height:calc(100dvh - env(safe-area-inset-top,0px) - var(--kil-bnav-h,62px));
    min-height:0;margin:0;padding:0;
    border-radius:0;border:0;background:#000;
    display:flex;flex-direction:column;justify-content:flex-start}
  /* THE CARD MUST FILL THE SCREEN (Founder 2026-08-23: "does not fill the screen either").
     The card was full height but the PLAYER inside it kept its own aspect-ratio — a 16:9 clip in
     a tall card leaves a band of dead space above and below. On this feed the media is the card,
     so the well takes whatever height is left after the caption row and the frame covers it. */
  body.cul-m #community-feed>.fcard .kil-vid-well{
    flex:1 1 auto;min-height:0;aspect-ratio:auto!important;max-height:none!important;margin:0!important;
    position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
  /* THE INTENTIONAL BACKGROUND (Founder 2026-08-24: "For landscape or images, use an
     intentional background treatment rather than exposing arbitrary page gaps").
     The clip's own still, blown up, blurred and dimmed, fills whatever the player cannot —
     the letterbox reads as part of the design instead of as a hole in the page. */
  body.cul-m #community-feed>.fcard .kil-vid-well::before{
    content:"";position:absolute;inset:-8%;z-index:0;
    background:var(--kv-poster,none) center/cover no-repeat;
    filter:blur(26px) brightness(.42) saturate(1.2)}
  /* MAXIMIZE WITHIN THE RATIO, DO NOT STRETCH (Founder 2026-08-24: "the video should maximize
     available space while maintaining aspect ratio").
     `object-fit:cover` was the previous fix and it cannot work on an IFRAME — object-fit has no
     effect on a nested browsing context, so YouTube kept its own letterbox and painted its grey
     inside our black. Sizing the element to the ratio is the only thing an iframe honours:
     aspect-ratio + max-width/height 100% grows it until whichever axis runs out first, which is
     exactly "as big as it fits". A 9:16 Short now fills a phone edge to edge. */
  /* ⚠ `width:auto` + `aspect-ratio` ON AN IFRAME RESOLVES TO 300x150, NOT TO THE CONTAINER.
     That was the bug behind "landscape youtube is not fitted to the mobile screen. its shrunk"
     (Founder 2026-08-24). An <iframe> is a replaced element with an INTRINSIC default size of
     300x150; with `width:auto;height:auto` there is nothing for aspect-ratio to scale, so the
     player rendered at its intrinsic size in the middle of a full-screen card. `max-width:100%`
     never fired because 300px was already under the cap.
     One axis must be pinned to the container, and WHICH axis depends on the clip:
       landscape (16:9) in a portrait phone -> pin WIDTH, height follows the ratio
       portrait  (9:16) in a portrait phone -> pin HEIGHT, width follows the ratio
     Pinning the wrong one overflows and gets clamped, which breaks the ratio — so this is
     driven off .kv-short, the class kvRenderCard already sets from `is_short`. */
  body.cul-m #community-feed>.fcard .kil-vid-well>iframe,
  body.cul-m #community-feed>.fcard .kil-vid-well>video,
  body.cul-m #community-feed>.fcard .kil-vid-well>img{
    position:relative!important;z-index:1;inset:auto!important;
    width:100%!important;height:auto!important;max-width:100%!important;max-height:100%!important;
    aspect-ratio:var(--kv-ar,16 / 9)!important;border:0;display:block;object-fit:contain!important;margin:0!important}
  /* Portrait clip: fill the height instead, so a Short runs edge to edge top to bottom. */
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>iframe,
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>video,
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>img{
    width:auto!important;height:100%!important}
  /* !important is not decoration here. mountVid() writes the iframe's geometry as an inline
     cssText (position:absolute;inset:0;width:100%;height:100%) and the card template does the
     same on the thumbnail — an inline declaration outranks any selector, so without this the
     rule above would be computed and then discarded. The inline styles are correct for desktop,
     which is why they stay; this overrides them for the full-bleed frame only. */
  /* The play overlay is a sibling of the media and must stay pinned to the whole well. */
  body.cul-m #community-feed>.fcard .kil-vid-well>.kil-vid-play,
  body.cul-m #community-feed>.fcard .kil-vid-well>.kv-badge{z-index:2}
  /* ── R4.1 — THE MEDIA IS THE CARD (Founder: "the videos ... its shrunk inside the content
     page"). .kil-vid-well and .kv-body were SIBLINGS splitting the card's height, so the
     player only ever got what the caption row left over — that, not the aspect ratio, is why
     it read as shrunk. Reels/TikTok model: the well takes the whole card and the meta floats
     over it on a scrim. */
  body.cul-m #community-feed>.fcard{position:relative}
  body.cul-m #community-feed>.fcard .kil-vid-well{
    position:absolute!important;inset:0!important;flex:none!important;width:auto!important;height:auto!important}
  body.cul-m #community-feed>.fcard .kv-body{
    position:absolute;left:0;right:0;bottom:0;z-index:3;background:none;
    background-image:linear-gradient(to top,rgba(0,0,0,.94) 0%,rgba(0,0,0,.74) 52%,rgba(0,0,0,0) 100%);
    padding-bottom:12px}
  /* COVER, not contain. object-fit cannot reach inside an iframe, so the iframe itself is sized
     to the CLIP's aspect and the well clips the overflow. Landscape pins HEIGHT (width spills
     past the sides); a Short pins WIDTH (a little is cropped top and bottom). Both are centred.
     Note this is the opposite of the earlier contain rules and must come after them. */
  /* >img is included deliberately. Measured with ?kildebug=1: well 402x695, iframe
     "(not mounted)" — only the most-visible card gets a player, so on every other card the
     thing filling the frame is the POSTER. Leaving img out of the cover rule meant the older
     contain rule (which does list >img) still governed it, and the poster stayed letterboxed.
     That poster is what the Founder has been calling shrunk. */
  body.cul-m #community-feed>.fcard .kil-vid-well>iframe,
  body.cul-m #community-feed>.fcard .kil-vid-well>video,
  body.cul-m #community-feed>.fcard .kil-vid-well>img{
    position:absolute!important;top:50%!important;left:50%!important;
    transform:translate(-50%,-50%)!important;
    height:100%!important;width:auto!important;aspect-ratio:var(--kv-ar,16 / 9)!important;
    max-width:none!important;max-height:none!important;object-fit:cover!important}
  /* An <img> has genuine intrinsic dimensions, so it can simply be told to fill and crop —
     no aspect maths, and it cannot fall into the 300x150 replaced-element default that
     bit the iframes in R3.4. */
  /* R6.1 — SCOPED TO .kv-short. This was applying to every card, and because it comes later
     in source it beat the landscape rule below. The poster is what is on screen for every card
     that is not the most-visible one, so a cover poster meant the Founder still saw a zoomed
     frame even with the iframe rule correct. Same trap as R4.1, opposite direction. */
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>img{
    width:100%!important;height:100%!important;aspect-ratio:auto!important;
    object-fit:cover!important;object-position:center!important}
  /* Portrait clip: the well is very slightly wider than 9:16, so pinning width is what fills. */
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>iframe,
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>video,
  body.cul-m #community-feed>.fcard.kv-short .kil-vid-well>img{
    width:100%!important;height:auto!important;aspect-ratio:9 / 16!important}
  /* ── R6.1 — LANDSCAPE PINS WIDTH, NOT HEIGHT ────────────────────────────────────────────
     Founder: "the landscape videos are zoomed in and not fitted to the width of the screen.
     the other 9:16 videos fits perfectly."
     Cover was implemented correctly and is the wrong outcome here: height:100% on a 16:9 clip
     in a 402x695 well computes 1236px wide — 3x the screen — so it reads as a zoomed crop
     through the middle. Landscape is fitted to the width and letterboxed vertically; the
     blurred --kv-poster ::before fills the bands, which is why contain is not a hole.
     .kv-short is deliberately untouched — it fits perfectly and is signed off. */
  body.cul-m #community-feed>.fcard:not(.kv-short) .kil-vid-well>iframe,

  /* THE DOCUMENT IS THE SCROLLER AGAIN (Founder 2026-08-24). `overflow:hidden` existed only to

  /* The landing panel is the FIRST snap point, so the page opens on title + metrics and one

     scrollingElement === documentElement. Symptom: a fast flick settled BETWEEN two cards,

  /* scroll-padding-top matches the snapport to the VISIBLE band. scroll-snap-align:start

  body.cul-m.cul-fs .fcard .fb-head{position:absolute;top:8px;left:8px;right:56px;z-index:4;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);border:0;padding:6px 8px;border-radius:10px}
  body.cul-m.cul-fs .fcard .fb-media{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto!important;
    background-size:cover!important;background-position:center!important;background-repeat:no-repeat;border-radius:14px}
  body.cul-m.cul-fs .fcard .fb-caro,body.cul-m.cul-fs .fcard .fb-caro>*{height:100%!important}
