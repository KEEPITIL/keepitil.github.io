<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>WiFi Remote — Your Unlock Code</title>
<style>
  :root {
    --bg: #0A0E17; --panel: #10182A; --accent: #2BE4C6;
    --text: #E8EDF5; --muted: #8FA3C8;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
  main { max-width: 480px; margin: 0 auto; padding: 72px 24px 96px; text-align: center; }
  h1 { font-size: 24px; color: #fff; margin-bottom: 8px; }
  p.sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
  .code {
    font-size: 30px; font-weight: 800; letter-spacing: 2px; color: var(--accent);
    background: var(--panel); border: 1px solid rgba(43,228,198,0.3);
    border-radius: 16px; padding: 24px; margin-bottom: 20px; word-break: break-all;
  }
  .steps { text-align: left; color: var(--muted); font-size: 14px; margin-top: 28px; }
  .steps li { margin-bottom: 8px; }
  a { color: var(--accent); }
</style>

<link rel="canonical" href="https://keepitil.com/wifi-remote-success.html"/>
</head>
<body>
<main>
  <h1 id="title">Retrieving your unlock code…</h1>
  <p class="sub" id="sub"></p>
  <div class="code" id="code" style="display:none;"></div>

  <ol class="steps" id="steps" style="display:none;">
    <li>Open WiFi Remote on your iPhone</li>
    <li>Go to Settings → Redeem Code</li>
    <li>Enter the code above to remove ads</li>
  </ol>

  <p class="sub" id="fallback" style="display:none;">
    Didn't get your code, or lost this page? Email
    <a href="mailto:fobbinhard@gmail.com">fobbinhard@gmail.com</a> with your
    payment email and we'll look it up.
  </p>
</main>

<script>
  const FUNCTION_URL = "https://ovmqtzjfpzrbzrlkxwgw.supabase.co/functions/v1/wifi-remote-get-license";
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  const codeEl = document.getElementById("code");
  const steps = document.getElementById("steps");
  const fallback = document.getElementById("fallback");

  async function poll(attempt = 0) {
    if (!sessionId) {
      title.textContent = "Missing session";
      sub.textContent = "This page needs a valid checkout session link.";
      fallback.style.display = "block";
      return;
    }
    try {
      const res = await fetch(`${FUNCTION_URL}?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      if (data.ok && data.code) {
        title.textContent = "You're all set 🎉";
        sub.textContent = "Here's your ad-free unlock code:";
        codeEl.textContent = data.code;
        codeEl.style.display = "block";
        steps.style.display = "block";
        return;
      }
    } catch (e) {}

    if (attempt < 8) {
      // Stripe webhook can take a couple seconds to land — retry briefly.
      setTimeout(() => poll(attempt + 1), 1500);
    } else {
      title.textContent = "Almost there";
      sub.textContent = "Your payment went through, but the code is still generating.";
      fallback.style.display = "block";
    }
  }

  poll();
</script>
</body>
</html>
