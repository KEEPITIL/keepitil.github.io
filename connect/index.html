<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--panel:rgba(255,255,255,.035);--panel-brd:rgba(255,255,255,.09);--ink:#f4f2fb;--ink2:#9a94b4;--ink3:#6b6588;--artist:var(--purple-2);--brand:#00e0a4;--organizer:#ff8a3d;--venue:var(--brand);--cyan:var(--brand);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;}
html{scroll-behavior:smooth;}
/* KODE 2026-08-20, Part C #2: the 128pt green band under the footer is body::before — a
   position:fixed backdrop showing through because the page content is shorter than the
   viewport, so nothing paints over the bottom. Footer padding can never fix that.
   /create does NOT have the band, and the reason is this exact rule: it is a flex column at
   min-height:100dvh with footer{margin-top:auto}, so the footer is pushed to the bottom and
   covers the backdrop. Same treatment here. padding-bottom moves to the footer, because on a
   flex column body padding leaves a gap BELOW the footer — the bug fixed on 2026-08-19. */
/* overflow-x:clip, NOT hidden (Atlas 2026-08-21). `overflow-x:hidden` on body computes
   overflow-y:auto, which turns BODY into a scroll container. position:sticky then resolves
   against body instead of the viewport, and because the page actually scrolls on the
   viewport the bar never sticks — the filter bars were correctly declared sticky and simply
   could not work. `clip` clips the same overflow WITHOUT creating a scroll container, so
   sticky resolves against the viewport again. `hidden` is kept first as the fallback for
   anything that predates `clip`. */
body{background:var(--bg,#0a0a0f);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:var(--bg,#0a0a0f) url('/assets/images/scene-hero.jpg') center/cover no-repeat;opacity:1}
html.has-season body::before{display:none!important} /* seasonal image takes over the hero backdrop on its dates */
a{color:inherit;text-decoration:none;}
nav#main-nav{position:sticky;top:0;z-index:200;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);padding:0 24px;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;padding:0 32px;height:66px;}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-logo img{height:44px;width:auto;filter:drop-shadow(0 0 6px var(--brand));mix-blend-mode:screen;}
.nav-brand{font-family:var(--fh);font-size:1.5rem;letter-spacing:.13em;color:#fff;}
.nav-links{display:flex;list-style:none;flex:1;justify-content:space-evenly;margin:0;padding:0;}
.nav-links li{list-style:none;}
.nav-links a{font-family:var(--fh);font-size:1.05rem;letter-spacing:.14em;color:rgba(255,255,255,.75);transition:color .2s;white-space:nowrap;}
.nav-links a:hover,.nav-links a.active{color:#fff;}
.nav-inner>a.nav-cta{font-family:var(--fh);font-size:1rem;letter-spacing:.14em;color:var(--brand)!important;background:transparent!important;border:2px solid var(--brand);padding:7px 22px;border-radius:4px;flex-shrink:0;transition:background .2s,color .2s;white-space:nowrap;}
.nav-inner>a.nav-cta:hover{background:var(--brand)!important;color:#000!important;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;margin-left:14px;}
.nav-hamburger span{display:block;width:24px;height:2px;background:#fff;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:66px;left:0;right:0;background:rgba(10,10,18,.98);z-index:199;flex-direction:column;padding:14px 26px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:var(--fh);font-size:1.3rem;letter-spacing:.12em;color:rgba(255,255,255,.8);padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.mobile-menu a:last-child{border-bottom:none;color:var(--brand)!important;}
@media(max-width:820px){.nav-links{display:none;}.nav-inner>a.nav-cta{display:none;}.nav-hamburger{display:flex;margin-left:auto;}}
/* BACKGROUND FIRST, CONTENT SCROLLS UP (Founder 2026-08-21: "every page except culture
   should start like the homepage. background image first, than everything else can scroll up
   into place"). The homepage does this with .hero{min-height:100dvh} — a full-viewport opening
   panel over the fixed backdrop. Same here. svh first so the iOS URL bar collapsing does not
   change the height mid-scroll; dvh is the fallback for anything without svh. */
/* BOTTOM-WEIGHTED LANDING PANEL (Founder 2026-08-21: "titles and metrics needs to be bigger
   and towards the bottom of the landing page and also match the color theme of that page").
   justify-content:flex-end drops the block to the foot of the full-viewport panel, so the
   artwork owns the top two thirds and the type sits over the darkest part of the scrim where
   it is most legible. */
/*   The 130px is /create's value and is now the standard (Founder 2026-08-21: "create is the
   best example on positioning. it sits above the radio so it is readable on the landing page.
   the filter sits right behind the radio bar"). It is the fixed top nav (70) plus the radio bar
   (60): subtracting both keeps the title and metrics clear of the player instead of sitting
   under it, and lets the filter bar settle behind the bar as you scroll. */
/* LEFT EDGE IS /create's (Founder 2026-08-26: "title row, metric row, measurement space
   from the left of the screen" must match). Every landing panel now shares ONE measure —
   1120px with 16px side padding, which is what /create's .wrap gives .ce-hero. The pages
   had drifted to four different insets: create 1120/16, earn 1120/16, connect and culture
   1360/30, discovery 1180/24. Same-looking titles, four different left edges. */
.hero{position:relative;padding:6px 16px 40px;max-width:1120px;margin:0 auto;overflow:hidden;
  min-height:calc(100svh - 130px);min-height:calc(100dvh - 130px);
  display:flex;flex-direction:column;justify-content:flex-end;}
.hero::before{content:"";position:absolute;top:-160px;left:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,255,.30),transparent 62%);filter:blur(20px);z-index:-1;}
.hero::after{content:"";position:absolute;top:-90px;right:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(0,224,164,.18),transparent 62%);filter:blur(20px);z-index:-1;}
.hero-head{width:max-content;max-width:100%;}
.eyebrow{font-family:var(--fh);font-size:1.1rem;color:var(--cyan);margin-bottom:10px;display:block;text-align:justify;text-align-last:justify;letter-spacing:.42em;}
/* CONNECT is neon green (Founder 2026-08-23) — was white-to-purple. */
.hero h1{font-family:var(--fh);font-size:clamp(3.6rem,13vw,8rem);line-height:.88;letter-spacing:.02em;filter:drop-shadow(0 4px 26px rgba(0,0,0,.7));background:linear-gradient(120deg,#CFFFE4 12%,#39FF9E 48%,#00E0A4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{max-width:640px;color:var(--ink2);margin-top:12px;font-size:1.02rem;}
.stats{display:flex;gap:46px;margin-top:22px;flex-wrap:wrap;}
.stat b{font-family:var(--fh);font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:.02em;line-height:1;display:block;text-shadow:0 2px 18px rgba(0,0,0,.7);}
.stat span{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#c9c2e0;margin-top:5px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7);}
.stat.artist b{color:var(--artist);}.stat.brand b{color:var(--brand);}.stat.organizer b{color:var(--organizer);}.stat.venue b{color:var(--venue);}
/* MOBILE METRICS — one centred row, matching /create and /earn (Founder 2026-08-22/23).
   ⚠ THIS BLOCK MUST STAY BELOW THE BASE .stats/.stat RULES. A media query adds no specificity,
   so when it sat above them the base `.stats{gap:46px;flex-wrap:wrap}` simply won on source
   order and the stats kept wrapping to two rows on a phone. That is why the earlier fix looked
   like it had not applied. */
@media(max-width:860px){
  /* ── LANDING FILLS THE PHONE EXACTLY (Founder 2026-08-24) ─────────────────────────────
     "the page title and metric always sits on top of the bottom nav bar ... filters need to
     start behind the bottom nav bar only."
     The base rule subtracts 130px — the desktop top nav (70) plus the radio bar (60). NEITHER
     EXISTS ON A PHONE: the shell hides the top nav below 861px and pushes the radio bar off
     screen. So the panel came up 130px short, which lifted the metrics away from the nav and
     dragged the filter deck up into view on first paint. That is the whole bug.
     --kil-vh is the shell's measured usable band (status layer -> nav top); adding
     --kil-safe-top back accounts for the panel starting at y=0, underneath the black layer.
     Result: metrics land exactly on the nav and the deck begins one pixel below the fold. */
  .hero{text-align:center;
    min-height:calc(var(--kil-vh,100dvh) + var(--kil-safe-top,0px));
    padding-bottom:14px;}
  .hero-head{width:auto;margin:0 auto;}
  .hero p{margin-left:auto;margin-right:auto;}
  .stats{display:flex;flex-wrap:nowrap;justify-content:center;gap:min(6vw,26px);margin-top:18px;}
  .stat{flex:0 1 auto;min-width:0;text-align:center;}
  .stat b{font-size:clamp(1.4rem,6.5vw,2rem);}
  .stat span{font-size:.56rem;letter-spacing:.09em;margin-top:4px;}
}
/* FULL-BLEED AND OPAQUE (Founder 2026-08-21): "filling the entire top of the sheet ... no
   background image visible above or behind it when scrolling."
   It was a 1360px centred card at 90% opacity, so the backdrop showed through it AND down both
   sides of it while the page scrolled underneath. The BAR now spans the viewport and is solid;
   the CONTROLS inside it keep the page's 1360px measure so they still line up with the grid.
   The top:-1px/border trick closes the hairline the browser leaves above a sticky element. */
.controls{position:sticky;top:70px;z-index:100;background:#0b0b12;max-width:none;width:100%;
  margin:20px 0 0;padding:12px 0;border-top:1px solid rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 10px 24px rgba(0,0,0,.45);}
.controls-row,.subfilters{max-width:1360px;margin-left:auto;margin-right:auto;padding-left:30px;padding-right:30px;}
.controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--panel-brd);border-radius:12px;padding:4px;flex-wrap:wrap;}
.seg button{font-family:var(--fh);font-size:.98rem;letter-spacing:.09em;color:var(--ink2);background:none;border:0;cursor:pointer;padding:8px 16px;border-radius:9px;transition:all .18s;}
.seg button:hover{color:#fff;}
/* [data-k=all] removed with the ALL tab (2026-08-31). */
/* ══ COMMUNITY (Founder 2026-08-31) ══════════════════════════════════════════════════════
   Community is a filter inside CONNECT, not a sixth destination. It replaces the directory
   grid when its tab is selected and hands the grid back when another tab is. Mobile-first;
   desktop widens the same components rather than running a second code path. */
#commPane{display:none}
body.comm-on #grid{display:none}
body.comm-on #commPane{display:block}
body.comm-on .subfilters{display:none}
/* Community brings its own search, scoped to communities. Leaving the directory's
   'name, city or genre' box above it puts two search fields on screen that do different
   things. The count belongs to the directory too. */
body.comm-on .controls-row .search,body.comm-on #count{display:none}
/* ⚠ body ON THIS PAGE IS display:flex, so a bare max-width leaves the pane sized by its
   CONTENT as a flex item — measured 722px inside a 375px viewport, which is horizontal
   overflow on every phone. width:100% and min-width:0 are what actually bind it to the
   viewport; max-width still centres it on desktop. */
#commPane{width:100%;min-width:0;flex:0 1 auto;max-width:1120px;margin:0 auto;padding:0 16px 40px;box-sizing:border-box}
/* search */
.comm-search{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:11px 14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line,#242433);border-radius:12px}
.comm-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink,#f4f2fb);
  font:500 .95rem Inter,system-ui,sans-serif}
.comm-search input::placeholder{color:#6b6588}
/* topic chips — horizontal scroll, never a wrapped block that pushes cards off screen */
.comm-chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:0 0 4px;margin:0 0 16px}
.comm-chips::-webkit-scrollbar{display:none}
.comm-chips button{flex:0 0 auto;height:32px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line,#242433);background:rgba(255,255,255,.05);color:#cfd3df;
  font:800 .68rem/1 Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.comm-chips button.on{background:linear-gradient(90deg,#0f6e56,#00e0a4);border-color:transparent;color:#04120a}
/* cards */
/* ⚠ minmax(0,1fr) NOT 1fr. A grid item's min-width defaults to auto, so a card carrying a long
   community name forces its track to min-content and the whole page scrolls sideways. Measured
   at 320px: body scrollWidth 740 with the card grid present, 320 with it hidden. 375px happened
   to survive it, which is why it was not caught the first time. */
.comm-cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.comm-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.comm-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.comm-card{display:flex;gap:12px;align-items:flex-start;min-width:0;padding:14px;border-radius:14px;
  background:var(--panel,rgba(18,18,28,.7));border:1px solid var(--line,#242433);cursor:pointer;
  transition:border-color .15s,transform .15s;text-align:left;width:100%;color:inherit;font:inherit}
.comm-card:hover{border-color:rgba(0,224,164,.45);transform:translateY(-1px)}
.comm-ic{flex:0 0 52px;width:52px;height:52px;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,#0f6e56,#00e0a4);display:flex;align-items:center;
  justify-content:center;color:#04120a;font:900 1.1rem Inter,sans-serif}
.comm-ic img{width:100%;height:100%;object-fit:cover}
.comm-body{flex:1;min-width:0}
.comm-name{font:800 .98rem/1.2 Inter,system-ui,sans-serif;color:#fff;margin:0 0 3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comm-desc{font:400 .82rem/1.35 Inter,system-ui,sans-serif;color:#a9b3c4;margin:0 0 7px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.comm-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font:800 .6rem/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#7d8b9c}
.comm-topic{padding:3px 8px;border-radius:999px;background:rgba(0,224,164,.12);color:#7ff5d0}
.comm-join{flex:0 0 auto;align-self:center;height:32px;padding:0 14px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(0,224,164,.45);background:rgba(0,224,164,.12);color:#7ff5d0;
  font:800 .64rem/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.comm-join.joined{background:rgba(255,255,255,.06);border-color:var(--line,#242433);color:#9aa6b6}
.comm-join:disabled{opacity:.5;cursor:default}
/* empty states — an empty PLATFORM and an empty SEARCH are different sentences */
.comm-empty{padding:40px 18px;text-align:center;border:1px dashed var(--line,#242433);border-radius:14px}
.comm-empty b{display:block;font:800 1.05rem Inter,sans-serif;color:#eafff7;margin-bottom:6px}
.comm-empty span{font:400 .88rem/1.45 Inter,sans-serif;color:#a9b3c4}
/* ── DETAIL ─────────────────────────────────────────────────────────────────────────── */
.comm-back{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;padding:7px 12px;
  border-radius:9px;border:1px solid var(--line,#242433);background:rgba(255,255,255,.05);
  color:#cfd3df;font:800 .66rem/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.comm-head{display:flex;gap:13px;align-items:center;padding:14px;border-radius:14px;margin:0 0 14px;
  background:var(--panel,rgba(18,18,28,.7));border:1px solid var(--line,#242433)}
.comm-head .comm-ic{flex:0 0 56px;width:56px;height:56px}
.comm-head h2{font:900 1.15rem/1.15 var(--fh,Inter),sans-serif;letter-spacing:.03em;color:#fff;margin:0 0 3px}
.comm-tabs{display:flex;gap:6px;margin:0 0 16px}
.comm-tabs button{flex:1 1 0;height:38px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line,#242433);background:rgba(255,255,255,.05);color:#cfd3df;
  font:800 .68rem/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.comm-tabs button.on{background:linear-gradient(90deg,#0f6e56,#00e0a4);border-color:transparent;color:#04120a}
/* feed */
.cpost{padding:13px 14px;border-radius:13px;margin:0 0 10px;
  background:var(--panel,rgba(18,18,28,.7));border:1px solid var(--line,#242433)}
.cpost.removed{opacity:.55;border-style:dashed}
.cpost h4{font:800 .92rem/1.25 Inter,sans-serif;color:#fff;margin:0 0 5px}
.cpost p{font:400 .87rem/1.45 Inter,sans-serif;color:#c8d1de;margin:0 0 8px;white-space:pre-wrap}
.cpost img.cmedia{width:100%;border-radius:10px;margin:0 0 8px;display:block}
.cmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font:700 .64rem/1 Inter,sans-serif;letter-spacing:.06em;color:#7d8b9c}
.cmeta button{background:none;border:0;color:#7ff5d0;cursor:pointer;font:inherit;padding:0}
.cmeta .danger{color:#ff8f8f}
.creply{margin:8px 0 0 14px;padding:9px 11px;border-left:2px solid rgba(0,224,164,.3);
  background:rgba(255,255,255,.03);border-radius:0 9px 9px 0}
/* Two levels of visual depth and no more: a phone cannot show a deep tree without the text
   column collapsing to nothing. */
.creply .creply{margin-left:12px}
.creply .creply .creply{margin-left:0}
.creply p{font:400 .84rem/1.4 Inter,sans-serif;color:#c8d1de;margin:0 0 5px;white-space:pre-wrap}
.ccomp{display:flex;gap:8px;margin:0 0 14px}
.ccomp textarea,.ccomp input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.05);
  border:1px solid var(--line,#242433);border-radius:10px;padding:10px 12px;color:var(--ink,#f4f2fb);
  font:400 .88rem Inter,sans-serif;outline:none;resize:vertical}
.ccomp button{flex:0 0 auto;padding:0 16px;border-radius:10px;border:0;cursor:pointer;
  background:linear-gradient(90deg,#0f6e56,#00e0a4);color:#04120a;font:800 .68rem Inter,sans-serif;
  letter-spacing:.1em;text-transform:uppercase}
.ccomp button:disabled{opacity:.5;cursor:default}
/* chat */
#cchat{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:4px 2px;margin:0 0 12px}
.cmsg{display:flex;gap:9px;margin:0 0 10px}
.cav{flex:0 0 30px;width:30px;height:30px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#0f6e56,#00e0a4);display:flex;align-items:center;
  justify-content:center;color:#04120a;font:900 .72rem Inter,sans-serif}
.cav img{width:100%;height:100%;object-fit:cover}
.cmsg-b{flex:1;min-width:0}
.cmsg-h{font:800 .66rem/1 Inter,sans-serif;color:#7ff5d0;margin-bottom:3px}
.cmsg-h time{color:#6b7787;font-weight:600;margin-left:7px}
.cmsg-t{font:400 .87rem/1.4 Inter,sans-serif;color:#c8d1de;white-space:pre-wrap;word-break:break-word}
/* resources */
.cres{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:12px;margin:0 0 9px;
  background:var(--panel,rgba(18,18,28,.7));border:1px solid var(--line,#242433)}
.cres-k{flex:0 0 auto;padding:4px 9px;border-radius:999px;background:rgba(0,224,164,.12);color:#7ff5d0;
  font:800 .58rem/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.cres b{display:block;font:800 .89rem/1.25 Inter,sans-serif;color:#fff;margin-bottom:3px}
.cres span{font:400 .8rem/1.4 Inter,sans-serif;color:#a9b3c4}
.cres a{color:#7ff5d0;text-decoration:none;font:700 .78rem Inter,sans-serif}
.comm-note{font:400 .82rem/1.45 Inter,sans-serif;color:#a9b3c4;padding:14px;text-align:center}
/* ── ACCOUNT GATE (Founder 2026-09-01) ──────────────────────────────────────────────────
   Community discovery is public; entering one is not. A signed-out tap explains that and
   offers the two ways forward, rather than failing or bouncing the visitor somewhere generic.
   position:fixed so the directory underneath keeps its search, topic and scroll position —
   closing returns to exactly where they were. */
#commGate{position:fixed;inset:0;z-index:1300;display:none;background:rgba(4,8,7,.86);
  backdrop-filter:blur(6px);align-items:center;justify-content:center;
  padding:calc(var(--kil-safe-top,0px) + 18px) 18px 18px}
#commGate.on{display:flex}
#commGate .g-panel{width:min(420px,100%);background:#0d1613;border:1px solid var(--line,#242433);
  border-radius:16px;padding:22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.6);position:relative}
#commGate h3{font:900 1.15rem/1.2 var(--fh,Inter),sans-serif;letter-spacing:.03em;color:#fff;margin:0 0 8px}

<script>
// roster reset 2026-07-21 — rebuild from Google Sheet + web research. Seeded with the 2 gold standards.
/* ARTISTS COME FROM ARTICLES (Founder 2026-08-26: "public view profiles will not be on the
   connected page. just article artist template").
   The seed used to hardcode Groove Trooper with a SoundCloud avatar and a link to
   /profile.html. Both are gone: the roster is now whatever has an artist article, the
   picture is his current profile picture, and the card opens the article. Empty here so
   there is exactly one source of truth — see the blog_articles fetch below. */
const ART=[],BRND=[],ORG=[],VEN=[
  /* BLEU — corrected 2026-08-20. Was hardcoded here with an image from bleuxo.net named
     BleuDailyMeals.jpg: a MEAL-PREP graphic, not the event space, and the wrong city
     (Santa Ana; BLEU is in Westminster). This seed overrode the venues table, which has held
     the correct logo at /venues/bleu-logo.png since 2026-08-18 — the reason the card kept
     showing food no matter how many times the database was fixed.
     Kept as a seed so the card renders before the Supabase fetch returns, but every field now
     matches the venues row. */
  {name:'BLEU',city:'Westminster',county:'Orange County',genre:'Event Space / Live Music',ig:'xoeventspace',img:'/venues/bleu-2x3.jpg?v=20260823',color:'var(--brand)',blog:'/venue.html?v=bleu',keepitil:true,type:'Event Space'}
];
// Each item carries kinds=[...]; multi-category profiles (once claimed) can list several.
let DATA=[].concat(
  ART.map(x=>Object.assign({},x,{kinds:['artist']})),
  BRND.map(x=>Object.assign({},x,{kinds:['brand']})),
  ORG.map(x=>Object.assign({},x,{kinds:['organizer']})),
  VEN.map(x=>Object.assign({},x,{kinds:['venue']}))
);
const KL={artist:'Artist',brand:'Brand',organizer:'Organizer',venue:'Venue'};
/* BRANDS ABSORBS ORGANIZERS at the filter level (Founder 2026-08-31). One place decides what
   a tab matches, so the count in the header and the list in the grid can never disagree. */
const KIND_MATCH={artist:['artist'],brand:['brand','organizer'],venue:['venue'],community:['community']};
const matchesKind=(x,k)=>(KIND_MATCH[k]||[k]).some(kk=>(x.kinds||[]).includes(kk));
const cnt=k=>DATA.filter(x=>matchesKind(x,k)).length;
cA.textContent=cnt('artist');cB.textContent=cnt('brand');cO.textContent=cnt('community');cV.textContent=cnt('venue');
// ---- genre buckets (tightened) ----
const BUCKETS=[['House',['house','tech house','deep house','bass house','latin house','jackin house','soulful house','organic house','disco tech','afro house','afro','disco']],
['Techno',['techno','hard techno','minimal techno','deep techno','dark techno','acid techno','ambient techno','melodic techno','peak-time','hypnotic','industrial','minimal','deep tech','psychedelic industrial techno','acid']],
['Bass',['bass','bass music','dubstep','riddim','tearout','hybrid trap','heavy bass']],
['Drum & Bass',['dnb','drum and bass','jungle','breaks']],
['Trance',['trance','tech trance','progressive']],
['Hard',['hardcore','hardstyle','hard']],
['UKG / Garage',['ukg','uk garage','garage','speed garage','uk bass','bassline','club','bounce','ghetto-tech']],
['Experimental',['experimental','leftfield','electronica','electro','future bass','ambient']]];
function splitv(s){return (s||'').split('/').map(t=>t.trim()).filter(Boolean);}
function bucketOf(g){g=g.toLowerCase();for(const[b,l]of BUCKETS){if(l.includes(g))return b;}return 'Other';}
function artistBuckets(){const items=DATA.filter(x=>x.kinds.includes('artist'));const present=new Set();items.forEach(x=>splitv(x.genre).forEach(g=>present.add(bucketOf(g))));return BUCKETS.map(b=>b[0]).concat(['Other']).filter(b=>present.has(b));}
function typeValues(kind){const items=DATA.filter(x=>matchesKind(x,kind));return [...new Set(items.flatMap(x=>splitv(x.category||x.type)))].sort();}
/* DEFAULT IS COMMUNITY, ALWAYS (Founder 2026-08-31, confirmed after review).
   An earlier version fell back to 'artist' while the Community dataset was empty. That was
   overruled: the default category is a product decision, not a function of how much data
   happens to exist today. An empty Community shows a building state — it does not hand the
   landing slot to another category and then silently take it back later. */
let kind='community',q='',sub=null; // sub={facet:'genre'|'type',val}
function initials(n){return (n||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function desc(x){return x.genre||x.category||x.type||'';}
function card(x){
  const d=desc(x);const ig=x.ig?('@'+x.ig):'';
  /* No dead links (Atlas 2026-07-16): internal profile if it exists, else the org's Instagram (new tab), else a non-clickable card. Never href="#". */
  const igurl=x.ig?('https://instagram.com/'+String(x.ig).replace(/^@/,'').trim()):'';
  /* blog already starts with "/"; only add a leading slash if it's missing. A double slash ("//path") is a protocol-relative URL and sends every card to a dead domain. */
  const href=x.blog?(String(x.blog).charAt(0)==='/'?x.blog:'/'+x.blog):(igurl||'');
  const ext=!x.blog && !!igurl;
  const img=x.img?('<img loading="lazy" referrerpolicy="no-referrer" src="'+x.img+'" alt="" onerror="this.style.display=\'none\'"/>'):'';
  const fb='<div class="fallback" style="background:linear-gradient(135deg,'+(x.color||'#6d28d9')+',#111)">'+initials(x.name)+'</div>';
  const chips=x.kinds.map(k=>'<span class="kind '+k+'">'+KL[k]+'</span>').join('');
  const inner='<div class="imgw"><div class="kinds">'+chips+'</div>'+img+fb+'</div>'
    +'<div class="body"><div class="nm">'+(x.name||'')+'</div><div class="desc">'+d+'</div>'
    +(x.city?'<div class="loc">◍ '+x.city+(x.county?' · '+x.county.replace(' County',' Co.'):'')+'</div>':'')
    +(ig?'<div class="ig">'+ig+(ext?' ↗':'')+'</div>':'')+'</div>';
  if(href) return '<a class="card" href="'+href+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+inner+'</a>';
  return '<div class="card nolink" style="cursor:default">'+inner+'</div>';
}
function renderSubs(){
  const box=document.getElementById('subs');
  if(!kind){box.classList.remove('show');box.innerHTML='';return;}
  const parts=[];
  if(kind==='artist'){
    const gb=artistBuckets();
    if(gb.length>1){parts.push('<span class="sf-label">Genre</span>');gb.forEach(v=>parts.push('<button class="chip'+(sub&&sub.facet==='genre'&&sub.val===v?' on':'')+'" data-f="genre" data-v="'+v+'">'+v+'</button>'));}
  } else {
    const tv=typeValues(kind);
    if(tv.length>1){parts.push('<span class="sf-label">Type</span>');tv.forEach(v=>parts.push('<button class="chip'+(sub&&sub.facet==='type'&&sub.val===v?' on':'')+'" data-f="type" data-v="'+v.replace(/"/g,'')+'">'+v+'</button>'));}
  }
  box.innerHTML=parts.join('');box.classList.toggle('show',parts.length>0);
}
function matchSub(x){
  if(!sub)return true;
  if(sub.facet==='genre'){return splitv(x.genre).some(g=>bucketOf(g)===sub.val);}
  return ((x.type||'')+' '+(x.category||'')).toLowerCase().includes(sub.val.toLowerCase());
}
function render(){
  /* COMMUNITY takes over the main area; the directory grid is not a fit for it and the two
     must not both be on screen. body.comm-on is the single switch. */
  document.body.classList.toggle('comm-on', kind==='community');
  if(kind==='community'){
    document.getElementById('count').textContent='';
    if(window.__commActivate) window.__commActivate();
    return;
  }
  const ql=q.trim().toLowerCase();
  const list=DATA.filter(x=>{
    if(!matchesKind(x,kind))return false;
    if(!matchSub(x))return false;
    if(ql){const h=((x.name||'')+' '+(x.city||'')+' '+desc(x)).toLowerCase();if(!h.includes(ql))return false;}
    return true;
  });
  /* ARTISTS LEAD (Founder 2026-08-26: "by default all artist profile at the top of the connect
     page"). Applies to the default All view; once a specific category is selected the list is
     already single-kind and this is a no-op. Stable sort — within artists, and within everything
     else, the existing order (articles newest-first, then venues) is preserved. */
  /* The artists-lead sort applied to the ALL view, which no longer exists: every view is now
     single-category, so there is nothing left to lead with. */
  const g=document.getElementById('grid');
  /* BROKEN != EMPTY. Community has no rows until its own phase ships; saying "No matches"
     there would read as a search failure rather than a section that has not opened yet. */
  var emptyHtml = (kind==='community' && cnt('community')===0)
    ? '<div class="empty"><div class="big">Community is opening soon</div>'
      + '<div>Learn, ask and share with other creators — communities for DJing, production, '
      + 'writing, art, events and more.</div></div>'
    : '<div class="empty"><div class="big">No matches</div><div>Try another search or filter.</div></div>';
  g.innerHTML=list.length?list.map(card).join(''):emptyHtml;
  document.getElementById('count').textContent=list.length+' of '+DATA.length;
}

(function(){

    var j=JSON.parse(m[1]); var rows=(j.table&&j.table.rows)||[]; var live=[];
    rows.forEach(function(row){
      var c=row.c||[]; var kind=cell(c,1).toLowerCase().trim(); var name=cell(c,2).trim();

<!-- COMMUNITY: its own tag. The module was briefly placed INSIDE the shell's
     <script src> element, where inline content is ignored by the browser, so it
     silently never ran. -->
<script>
/* ── COMMUNITY ── */
/* ══ COMMUNITY MODULE ════════════════════════════════════════════════════════════════════
   Landing (search + topics + cards) and detail (FEED / CHAT / RESOURCES) for the COMMUNITY
   filter inside CONNECT.

   ⚠ THE SERVER IS THE AUTHORITY, NOT THIS FILE. Every control below is drawn from a role the
   database reported, and every write is a plain PostgREST call that RLS accepts or rejects on
   its own. Hiding a button is a courtesy to the reader; it is never the check. The Phase 4
   tests proved the policies hold with the UI removed entirely.

   State lives in one object so backing out of a community can restore the search text, the
   selected topic and the scroll position rather than dumping the visitor at the top. */
(function(){
  var U='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
  var K=window.__KIL_ANON||'';
  var SB=null, SES=null, ME=null;
  var pane=document.getElementById('commPane');
  if(!pane) return;

  var S={ q:'', topic:'', scroll:0, view:'list', slug:null, tab:'feed',
          list:[], topics:[], mine:{}, cur:null, role:null };

  /* ── plumbing ───────────────────────────────────────────────────────────────────────── */
  function hdrs(){
    var h={apikey:K,'Content-Type':'application/json'};
    h.Authorization='Bearer '+((SES&&SES.access_token)||K);
    return h;
  }
  function rest(path,opt){
    opt=opt||{};
    return fetch(U+'/rest/v1/'+path,{method:opt.method||'GET',headers:Object.assign(hdrs(),opt.headers||{}),
      body:opt.body?JSON.stringify(opt.body):undefined})
      .then(function(r){ return r.text().then(function(t){
        var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
        return {ok:r.ok,status:r.status,data:j};
      });});
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(t){
    try{ var d=new Date(t), m=Math.floor((Date.now()-d)/60000);
      if(m<1) return 'now'; if(m<60) return m+'m'; if(m<1440) return Math.floor(m/60)+'h';
      return d.toLocaleDateString([], {month:'short',day:'numeric'});
    }catch(e){ return ''; }
  }
  function initial(n){ return (String(n||'?').trim()[0]||'?').toUpperCase(); }

  /* ── data ───────────────────────────────────────────────────────────────────────────── */
  function loadTopics(){
    return rest('community_topics?select=key,label&enabled=is.true&order=sort_order')
      .then(function(r){ S.topics=(r.data||[]); });
  }
  function loadCommunities(){
    var p='communities?select=id,slug,name,description,topic_key,tags,icon_url,member_count,visibility'
         +'&archived=is.false&order=member_count.desc,name.asc&limit=100';
    return rest(p).then(function(r){
      S.list=(r.data||[]);
      /* The hero COMMUNITY stat counts the communities TABLE. cnt('community') reads the
         directory array, which has no community rows in it and always reported 0. */
      var el=document.getElementById('cO'); if(el) el.textContent=String(S.list.length);
    });
  }
  /* Membership comes from the DATABASE every time. A local "joined" flag would be a lie the
     moment the same account opened another device. */
  function loadMine(){
    S.mine={};
    if(!SES) return Promise.resolve();
    return rest('community_members?select=community_id,role&user_id=eq.'+SES.user.id)
      .then(function(r){ (r.data||[]).forEach(function(m){ S.mine[m.community_id]=m.role; }); });
  }

  /* ── landing ────────────────────────────────────────────────────────────────────────── */
  function visible(){
    var q=S.q.trim().toLowerCase();
    return S.list.filter(function(c){
      if(S.topic && c.topic_key!==S.topic) return false;
      if(!q) return true;
      var hay=[c.name,c.description,c.topic_key].concat(c.tags||[]).join(' ').toLowerCase();
      return hay.indexOf(q)>-1;
    });
  }
  function renderList(){
    var rows=visible();
    var chips='<div class="comm-chips" id="commChips">'
      +'<button data-t="" class="'+(S.topic?'':'on')+'">All</button>'
      +S.topics.map(function(t){
         return '<button data-t="'+esc(t.key)+'" class="'+(S.topic===t.key?'on':'')+'">'+esc(t.label)+'</button>';
       }).join('')+'</div>';
    var body;
    if(!rows.length){
      /* An empty PLATFORM and an empty SEARCH are different sentences. Saying "no matches"
         when nothing has been created yet reads as a broken search. */
      body = S.list.length===0
        ? '<div class="comm-empty"><b>Communities are opening soon</b><span>Learn, ask and share with other creators — communities for DJing, production, writing, art, events and more.</span></div>'
        : '<div class="comm-empty"><b>No communities match your search</b><span>Try a different word, or clear the topic filter.</span></div>';
    } else {
      body='<div class="comm-cards">'+rows.map(cardHtml).join('')+'</div>';
    }
    pane.innerHTML=
      '<div class="comm-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6588" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'
      +'<input id="commQ" type="text" placeholder="Search communities…" value="'+esc(S.q)+'"/></div>'
      +chips+body;
    var qi=document.getElementById('commQ');
    if(qi) qi.addEventListener('input',function(){ S.q=this.value; var at=this.selectionStart; renderList();
      var n=document.getElementById('commQ'); if(n){ n.focus(); try{n.setSelectionRange(at,at);}catch(e){} } });
  }
  function cardHtml(c){
    var joined=!!S.mine[c.id];
    var topic=(S.topics.filter(function(t){return t.key===c.topic_key;})[0]||{}).label||'';
    return '<div class="comm-card" data-slug="'+esc(c.slug)+'">'
      +'<div class="comm-ic">'+(c.icon_url?'<img src="'+esc(c.icon_url)+'" alt=""/>':esc(initial(c.name)))+'</div>'
      +'<div class="comm-body">'
        +'<div class="comm-name">'+esc(c.name)+'</div>'
        +(c.description?'<div class="comm-desc">'+esc(c.description)+'</div>':'')
        +'<div class="comm-meta">'
          +(topic?'<span class="comm-topic">'+esc(topic)+'</span>':'')
          /* member_count is a database counter maintained by a trigger. No invented
             "active now" or "trending" number appears anywhere in this UI. */
          +'<span>'+(c.member_count||0)+' member'+((c.member_count===1)?'':'s')+'</span>'
          +(c.visibility!=='public'?'<span>'+esc(c.visibility)+'</span>':'')
        +'</div>'
      +'</div>'
      +'<button class="comm-join'+(joined?' joined':'')+'" data-join="'+esc(c.id)+'">'+(joined?'Joined':'Join')+'</button>'
      +'</div>';
  }
  window.__commRenderList=renderList;

  /* ── join / leave ───────────────────────────────────────────────────────────────────── */
  function needAuth(){
    if(SES) return false;
    location.href='/apply.html?next='+encodeURIComponent(location.pathname+location.search);
    return true;
  }
  function toggleJoin(cid,btn){
    if(needAuth()) return;
    var joined=!!S.mine[cid];
    btn.disabled=true;
    var p = joined
      ? rest('community_members?community_id=eq.'+cid+'&user_id=eq.'+SES.user.id,{method:'DELETE'})
      : rest('community_members',{method:'POST',body:{community_id:cid,user_id:SES.user.id,role:'member'},
              headers:{Prefer:'return=minimal'}});
    p.then(function(r){
      /* The server decides. On refusal the button goes back to what the DATABASE says it is,
         so a denied join can never leave the UI claiming membership. */
      if(!r.ok) throw new Error('denied '+r.status);
      return loadMine().then(loadCommunities);
    }).then(function(){
      /* ⚠ REFRESH THE ROLE, NOT JUST THE BUTTON. S.role is set when a community is opened and
         was never updated after a join, so joining from the detail header flipped the label to
         "Joined" while the feed composer and chat stayed locked until a page reload — the user
         is a member and the page still treats them as a visitor. Found with a real verified
         session; the API call had always succeeded. */
      if(S.cur) S.role = S.mine[S.cur.id] || null;
      if(S.view==='detail') renderDetail(); else renderList();
    }).catch(function(){
      btn.disabled=false;
      btn.textContent=S.mine[cid]?'Joined':'Join';
      alert(joined?'Could not leave — please try again.':'Could not join. This community may be invite-only.');
    });
  }

  /* ── detail ─────────────────────────────────────────────────────────────────────────── */
  function openCommunity(slug){
    S.scroll=window.pageYOffset||0;      /* remembered for the back button */
    S.view='detail'; S.slug=slug; S.tab='feed';
    pane.innerHTML='<div class="comm-note">Loading…</div>';
    rest('communities?select=id,slug,name,description,topic_key,icon_url,cover_url,member_count,visibility,owner_id&slug=eq.'+encodeURIComponent(slug))
      .then(function(r){
        S.cur=(r.data||[])[0]||null;
        if(!S.cur){ pane.innerHTML='<div class="comm-empty"><b>Community not found</b><span>It may have been archived.</span></div>'; return; }
        S.role=S.mine[S.cur.id]||null;
        /* Fetched once per community rather than on every tab switch. */
        S.opps='';
        rest('rpc/community_active_competitions?p_community_slug='+encodeURIComponent(slug))
          .then(function(o){ S.opps=oppsHtml(o.data||[]); if(S.tab==='feed') renderFeed(); });
        /* instant, not smooth: html{scroll-behavior:smooth} animates this, and the visitor
           lands on a community header that is still sliding. Measured: opening from
           scrollY 260 left the page at 260. */
        try{ window.scrollTo({top:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
        renderDetail();
      });
  }
  function headHtml(){
    var c=S.cur, joined=!!S.mine[c.id];
    return '<button class="comm-back" id="commBack">&#8249; Community</button>'
      +'<div class="comm-head">'
        +'<div class="comm-ic">'+(c.icon_url?'<img src="'+esc(c.icon_url)+'" alt=""/>':esc(initial(c.name)))+'</div>'
        +'<div class="comm-body"><h2>'+esc(c.name)+'</h2>'
          +(c.description?'<div class="comm-desc">'+esc(c.description)+'</div>':'')
          +'<div class="comm-meta"><span>'+(c.member_count||0)+' member'+((c.member_count===1)?'':'s')+'</span>'
          +(S.role?'<span class="comm-topic">'+esc(S.role)+'</span>':'')+'</div>'
        +'</div>'
        +'<button class="comm-join'+(joined?' joined':'')+'" data-join="'+esc(c.id)+'">'+(joined?'Joined':'Join')+'</button>'
      +'</div>'
      +'<div class="comm-tabs" id="commTabs">'
        +['feed','chat','resources'].map(function(t){
            return '<button data-tab="'+t+'" class="'+(S.tab===t?'on':'')+'">'+t.toUpperCase()+'</button>';
          }).join('')
      +'</div>';
  }
  function renderDetail(){
    if(!S.cur) return;
    pane.innerHTML=headHtml()+'<div id="commTabBody"><div class="comm-note">Loading…</div></div>';
    if(S.tab==='feed') renderFeed();
    else if(S.tab==='chat') renderChat();
    else renderResources();
  }
  var isMod=function(){ return S.role==='owner'||S.role==='moderator'; };
  var canWrite=function(){ return !!S.role; };

  /* ── FEED ───────────────────────────────────────────────────────────────────────────── */
  /* COMMUNITY -> CREATE. Shown above the feed so a live opportunity is visible without
     hunting for it, and only when there is one. */
  function oppsHtml(rows){
    if(!rows||!rows.length) return '';
    return '<div class="copps">'+rows.map(function(o){
      return '<a class="copp" href="/create/?c='+encodeURIComponent(o.slug)+'">'
        +'<div style="min-width:0"><span>Open on CREATE</span><b>'+esc(o.title)+'</b></div></a>';
    }).join('')+'</div>';
  }
  function renderFeed(){
    var box=document.getElementById('commTabBody'); if(!box) return;
    Promise.all([
      rest('community_posts?select=id,author_id,title,body,kind,media_url,link_url,pinned,locked,removed,reply_count,created_at&community_id=eq.'+S.cur.id+'&order=pinned.desc,created_at.desc&limit=50'),
      rest('community_replies?select=id,post_id,parent_id,author_id,body,removed,created_at&community_id=eq.'+S.cur.id+'&order=created_at.asc&limit=300')
    ]).then(function(res){
      var posts=res[0].data||[], reps=res[1].data||[];
      var byPost={}; reps.forEach(function(r){ (byPost[r.post_id]=byPost[r.post_id]||[]).push(r); });
      var comp = canWrite()
        ? '<div class="ccomp"><textarea id="cpBody" rows="2" placeholder="Ask a question or share something…"></textarea>'
          +'<button id="cpSend">Post</button></div>'
        : '<div class="comm-note">'+(SES?'Join this community to post.':'Sign in and join to post.')+'</div>';
      box.innerHTML = (S.opps||'') + comp + (posts.length
        ? posts.map(function(p){ return postHtml(p,byPost[p.id]||[]); }).join('')
        : '<div class="comm-empty"><b>No posts yet</b><span>Be the first to start a discussion here.</span></div>');
    });
  }
  function postHtml(p,reps){
    var mine=SES&&p.author_id===SES.user.id;
    var ctl=[];
    /* Controls are drawn from the role the DATABASE reported. The server rejects the write
       regardless of what is drawn — proven by the Phase 4 negative tests. */
    if(canWrite() && !p.locked) ctl.push('<button data-reply="'+esc(p.id)+'">Reply</button>');
    if(mine||isMod()) ctl.push('<button class="danger" data-rm="'+esc(p.id)+'">'+(p.removed?'Restore':'Remove')+'</button>');
    if(isMod()) ctl.push('<button data-lock="'+esc(p.id)+'">'+(p.locked?'Unlock':'Lock')+'</button>',
                         '<button data-pin="'+esc(p.id)+'">'+(p.pinned?'Unpin':'Pin')+'</button>');
    var top=reps.filter(function(r){ return !r.parent_id; });
    return '<div class="cpost'+(p.removed?' removed':'')+'" data-post="'+esc(p.id)+'">'
      +(p.pinned?'<div class="comm-meta"><span class="comm-topic">Pinned</span></div>':'')
      +(p.title?'<h4>'+esc(p.title)+'</h4>':'')
      +(p.body?'<p>'+esc(p.body)+'</p>':'')
      +(p.kind==='image'&&p.media_url?'<img class="cmedia" src="'+esc(p.media_url)+'" alt="" loading="lazy"/>':'')
      +(p.kind==='link'&&p.link_url?'<div class="cmeta"><a href="'+esc(p.link_url)+'" target="_blank" rel="noopener">'+esc(p.link_url)+'</a></div>':'')
      +'<div class="cmeta"><time>'+when(p.created_at)+'</time><span>'+(p.reply_count||0)+' repl'+((p.reply_count===1)?'y':'ies')+'</span>'
        +(p.locked?'<span>Locked</span>':'')+(p.removed?'<span>Removed</span>':'')+ctl.join('')+'</div>'
      +top.map(function(r){ return replyHtml(r,reps,1); }).join('')
      +'<div class="ccomp" data-rbox="'+esc(p.id)+'" style="display:none;margin-top:9px">'
        +'<input type="text" placeholder="Write a reply…"/><button data-rsend="'+esc(p.id)+'">Send</button></div>'
      +'</div>';
  }
  function replyHtml(r,all,depth){
    var kids=all.filter(function(x){ return x.parent_id===r.id; });
    var mine=SES&&r.author_id===SES.user.id;
    var ctl='';
    if(mine||isMod()) ctl='<button class="danger" data-rrm="'+esc(r.id)+'">'+(r.removed?'Restore':'Remove')+'</button>';
    /* Depth is capped at two visually. Deeper replies still exist and still render, they just
       stop indenting — an infinitely nested thread on a 320px screen ends with a column two
       words wide. */
    return '<div class="creply">'
      +'<p>'+esc(r.body)+'</p>'
      +'<div class="cmeta"><time>'+when(r.created_at)+'</time>'
      +(canWrite()?'<button data-reply2="'+esc(r.id)+'" data-post="'+esc(r.post_id)+'">Reply</button>':'')+ctl+'</div>'
      +(depth<2?kids.map(function(k){ return replyHtml(k,all,depth+1); }).join(''):'')
      +'</div>';
  }

  /* ── CHAT ───────────────────────────────────────────────────────────────────────────── */
  /* Members only, even when the community is public. Enforced by the RLS SELECT policy — this
     branch only decides what to draw for someone the server will refuse anyway. */
  function renderChat(){
    var box=document.getElementById('commTabBody'); if(!box) return;
    if(!S.role){
      box.innerHTML='<div class="comm-empty"><b>Chat is for members</b><span>'
        +(SES?'Join this community to read and take part in the chat.':'Sign in and join this community to take part in the chat.')
        +'</span></div>';
      return;
    }
    loadChat(null);
  }
  function loadChat(before){
    var box=document.getElementById('commTabBody'); if(!box) return;
    var p='community_chat_messages?select=id,user_id,handle,body,image_url,removed,created_at'
         +'&community_id=eq.'+S.cur.id+'&order=created_at.desc&limit=30';
    if(before) p+='&created_at=lt.'+encodeURIComponent(before);
    rest(p).then(function(r){
      var rows=(r.data||[]).slice().reverse();
      var older = rows.length===30
        ? '<div style="text-align:center;margin:0 0 10px"><button class="comm-back" id="cmore">Load older</button></div>' : '';
      var list = rows.length ? rows.map(msgHtml).join('')
        : '<div class="comm-note">No messages yet. Say hello.</div>';
      if(before){
        var cur=document.getElementById('cchat');
        if(cur){ var h0=cur.scrollHeight; cur.insertAdjacentHTML('afterbegin',older+list);
                 cur.scrollTop=cur.scrollHeight-h0; wire(); return; }
      }
      box.innerHTML='<div id="cchat">'+older+list+'</div>'
        +'<div class="ccomp"><input id="cmBody" type="text" placeholder="Message…" maxlength="1000"/>'
        +'<button id="cmSend">Send</button></div>';
      var c=document.getElementById('cchat'); if(c) c.scrollTop=c.scrollHeight;
      wire();
    });
  }
  function msgHtml(m){
    var mine=SES&&m.user_id===SES.user.id;
    var ctl=(mine||isMod())?'<button class="danger" data-mrm="'+esc(m.id)+'">Remove</button>':'';
    return '<div class="cmsg" data-msg="'+esc(m.id)+'" data-at="'+esc(m.created_at)+'">'
      +'<div class="cav">'+esc(initial(m.handle))+'</div>'
      +'<div class="cmsg-b"><div class="cmsg-h">'+esc(m.handle||'member')+'<time>'+when(m.created_at)+'</time>'+ctl+'</div>'
      +'<div class="cmsg-t">'+(m.removed?'<em style="color:#7d8b9c">message removed</em>':esc(m.body))+'</div></div></div>';
  }

  /* ── RESOURCES ──────────────────────────────────────────────────────────────────────── */
  function renderResources(){
    var box=document.getElementById('commTabBody'); if(!box) return;
    rest('community_resources?select=id,title,description,kind,url,body,added_by,removed,sort_order,created_at'
        +'&community_id=eq.'+S.cur.id+'&order=sort_order.asc,created_at.desc&limit=100')
      .then(function(r){
        var rows=r.data||[];
        /* Publishing is owner/moderator only — the RLS INSERT policy requires it, and a plain
           member's attempt was refused in testing. The form is only drawn for those roles. */
        var form = isMod()
          ? '<div class="ccomp"><input id="crTitle" type="text" placeholder="Resource title"/>'
            +'<input id="crUrl" type="text" placeholder="https://…"/><button id="crAdd">Add</button></div>'
          : '';
        box.innerHTML = form + (rows.length
          ? rows.map(function(x){
              return '<div class="cres'+(x.removed?' removed':'')+'" data-res="'+esc(x.id)+'">'
                +'<span class="cres-k">'+esc(x.kind)+'</span><div style="flex:1;min-width:0">'
                +'<b>'+esc(x.title)+'</b>'
                +(x.description?'<span>'+esc(x.description)+'</span>':'')
                +(x.url?'<div><a href="'+esc(x.url)+'" target="_blank" rel="noopener">Open &#8599;</a></div>':'')
                +(isMod()?'<div class="cmeta"><button class="danger" data-resrm="'+esc(x.id)+'">'+(x.removed?'Restore':'Remove')+'</button></div>':'')
                +'</div></div>';
            }).join('')
          : '<div class="comm-empty"><b>No resources yet</b><span>'
            +(isMod()?'Add a guide, link or template to get this started.':'Guides and links pinned by the moderators will appear here.')
            +'</span></div>');
      });
  }

  /* ── writes ─────────────────────────────────────────────────────────────────────────── */
  function post(body){ return rest('community_posts',{method:'POST',body:body,headers:{Prefer:'return=minimal'}}); }
  function refuse(r,what){
    if(r.ok) return true;
    /* An RLS refusal is reported, not swallowed. Silently doing nothing is how a permission
       bug looks exactly like a broken button. */
    alert('That was not permitted'+(what?' ('+what+')':'')+'. You may need to join, or you may not have that role.');
    return false;
  }

  /* ── one delegated handler ──────────────────────────────────────────────────────────── */
  function wire(){}
  pane.addEventListener('click', function(e){
    var t=e.target;
    var j=t.closest&&t.closest('[data-join]');
    if(j){ e.stopPropagation(); toggleJoin(j.getAttribute('data-join'),j); return; }
    if(t.closest&&t.closest('#commBack')){ backToList(); return; }
    var chip=t.closest&&t.closest('#commChips button');
    if(chip){ S.topic=chip.getAttribute('data-t')||''; renderList(); return; }
    var tab=t.closest&&t.closest('#commTabs button');
    if(tab){ S.tab=tab.getAttribute('data-tab'); renderDetail(); return; }
    var card=t.closest&&t.closest('.comm-card');
    if(card && S.view==='list'){
      /* Discovery is public; entry is not. The database refuses the interior content to a
         signed-out caller regardless — this is the explanation, not the enforcement. */
      if(!SES){ openGate(card.getAttribute('data-slug')); return; }
      openCommunity(card.getAttribute('data-slug'));
      return;
    }

    if(t.id==='cmore'){ var first=pane.querySelector('.cmsg'); loadChat(first?first.getAttribute('data-at'):null); return; }

    var rb=t.closest&&t.closest('[data-reply]');
    if(rb){ var box=pane.querySelector('[data-rbox="'+rb.getAttribute('data-reply')+'"]');
            if(box){ box.style.display='flex'; box.querySelector('input').focus(); } return; }
    var rb2=t.closest&&t.closest('[data-reply2]');
    if(rb2){ var pid=rb2.getAttribute('data-post');
             var b2=pane.querySelector('[data-rbox="'+pid+'"]');
             if(b2){ b2.style.display='flex'; b2.dataset.parent=rb2.getAttribute('data-reply2'); b2.querySelector('input').focus(); } return; }

    if(t.id==='cpSend'){ sendPost(); return; }
    var rs=t.closest&&t.closest('[data-rsend]');
    if(rs){ sendReply(rs.getAttribute('data-rsend')); return; }
    if(t.id==='cmSend'){ sendChat(); return; }
    if(t.id==='crAdd'){ addResource(); return; }

    var rm=t.closest&&t.closest('[data-rm]');
    if(rm){ modSet('community_posts',rm.getAttribute('data-rm'),{removed:rm.textContent==='Remove'},renderFeed); return; }
    var lk=t.closest&&t.closest('[data-lock]');
    if(lk){ modSet('community_posts',lk.getAttribute('data-lock'),{locked:lk.textContent==='Lock'},renderFeed); return; }
    var pn=t.closest&&t.closest('[data-pin]');
    if(pn){ modSet('community_posts',pn.getAttribute('data-pin'),{pinned:pn.textContent==='Pin'},renderFeed); return; }
    var rr=t.closest&&t.closest('[data-rrm]');
    if(rr){ modSet('community_replies',rr.getAttribute('data-rrm'),{removed:rr.textContent==='Remove'},renderFeed); return; }
    var mr=t.closest&&t.closest('[data-mrm]');
    if(mr){ modSet('community_chat_messages',mr.getAttribute('data-mrm'),{removed:true},function(){loadChat(null);}); return; }
    var xr=t.closest&&t.closest('[data-resrm]');
    if(xr){ modSet('community_resources',xr.getAttribute('data-resrm'),{removed:xr.textContent==='Remove'},renderResources); return; }
  });
  function modSet(table,id,patch,after){
    rest(table+'?id=eq.'+id,{method:'PATCH',body:patch,headers:{Prefer:'return=minimal'}})
      .then(function(r){ if(refuse(r,'moderation')) after(); });
  }
  function sendPost(){
    var ta=document.getElementById('cpBody'); if(!ta) return;
    var v=(ta.value||'').trim(); if(!v) return;
    var btn=document.getElementById('cpSend'); if(btn) btn.disabled=true;
    post({community_id:S.cur.id,author_id:SES.user.id,body:v,kind:'text'})
      .then(function(r){ if(btn) btn.disabled=false; if(refuse(r,'post')) renderFeed(); });
  }
  function sendReply(postId){
    var box=pane.querySelector('[data-rbox="'+postId+'"]'); if(!box) return;
    var inp=box.querySelector('input'), v=(inp.value||'').trim(); if(!v) return;
    var parent=box.dataset.parent||null;
    rest('community_replies',{method:'POST',headers:{Prefer:'return=minimal'},
      body:{post_id:postId,community_id:S.cur.id,author_id:SES.user.id,body:v,parent_id:parent}})
      .then(function(r){ delete box.dataset.parent; if(refuse(r,'reply')) renderFeed(); });
  }
  function sendChat(){
    var inp=document.getElementById('cmBody'); if(!inp) return;
    var v=(inp.value||'').trim(); if(!v) return;
    inp.value='';
    rest('community_chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},
      body:{community_id:S.cur.id,user_id:SES.user.id,handle:(ME&&ME.handle)||null,body:v}})
      .then(function(r){ if(refuse(r,'chat')) loadChat(null); });
  }
  function addResource(){
    var t=document.getElementById('crTitle'), u=document.getElementById('crUrl');
    var tv=(t.value||'').trim(); if(!tv) return;
    rest('community_resources',{method:'POST',headers:{Prefer:'return=minimal'},
      body:{community_id:S.cur.id,added_by:SES.user.id,title:tv,url:(u.value||'').trim()||null,kind:'link'}})
      .then(function(r){ if(refuse(r,'resource')) renderResources(); });
  }

  /* ── the account gate ───────────────────────────────────────────────────────────────── */
  var gate=null;
  function openGate(slug){
    var c=S.list.filter(function(x){ return x.slug===slug; })[0];
    if(!c) return;
    /* The destination the visitor actually asked for, carried through signup and login so they
       come back HERE rather than being dropped on a profile page. */
    var next=encodeURIComponent('/connect/?c='+slug);
    if(!gate){
      gate=document.createElement('div');
      gate.id='commGate';
      document.body.appendChild(gate);
      /* ⚠ ITS OWN LISTENER. The delegated handler is bound to #commPane and the gate lives on
         document.body, outside it — so Not now and X were unreachable and the gate could not be
         dismissed at all. Backdrop click closes it too. */
      gate.addEventListener('click', function(ev){
        if(ev.target===gate || (ev.target.closest && ev.target.closest('.g-not, .g-x'))) closeGate();
      });
    }
    gate.innerHTML='<div class="g-panel" role="dialog" aria-modal="true">'
      +'<button class="g-x" aria-label="Close">&#10005;</button>'
      +'<h3>Join the community</h3>'
      +'<p>Create a KEEPITIL account or sign in to enter '+esc(c.name)+' and take part.</p>'
      +'<div class="g-act">'
        +'<a class="g-primary" href="/signup.html?next='+next+'">Create account</a>'
        +'<a class="g-secondary" href="/apply.html?next='+next+'">Log in</a>'
        +'<button type="button" class="g-not">Not now</button>'
      +'</div></div>';
    gate.classList.add('on');
    document.body.style.overflow='hidden';
  }
  function closeGate(){
    if(gate) gate.classList.remove('on');
    document.body.style.overflow='';
    /* Nothing is re-rendered and nothing scrolls: the directory was never touched, so the
       search text, the selected topic and the scroll position are exactly as they were. */
  }

  /* ── back preserves search, topic and scroll ────────────────────────────────────────── */
  function backToList(){
    S.view='list'; S.slug=null; S.cur=null; S.role=null;
    renderList();
    /* Restore AFTER paint, or the document is not yet tall enough to scroll to. */
    requestAnimationFrame(function(){ try{ window.scrollTo({top:S.scroll||0,behavior:'instant'}); }catch(e){ window.scrollTo(0,S.scroll||0); } });
  }

  /* ── boot ───────────────────────────────────────────────────────────────────────────── */
  function boot(n){
    if(!window.supabase){ if(n<40) setTimeout(function(){ boot(n+1); },300); else start(); return; }
    try{
      SB=window.__kilSB||(window.__kilSB=window.supabase.createClient(U,K));
      SB.auth.getSession().then(function(r){
        SES=(r&&r.data)?r.data.session:null;
        return SES ? rest('app_users?select=handle&id=eq.'+SES.user.id).then(function(x){ ME=(x.data||[])[0]||null; }) : null;
      }).then(start);
      SB.auth.onAuthStateChange(function(_e,s){ SES=s; loadMine().then(function(){
        if(S.view==='detail'&&S.cur){ S.role=S.mine[S.cur.id]||null; renderDetail(); } else renderList(); }); });
    }catch(e){ start(); }
  }
  function start(){
    Promise.all([loadTopics(),loadCommunities()]).then(loadMine).then(function(){
      /* DEEP LINK: /connect/?c=<slug> opens that community directly. This is what CREATE's
         "Communities for this CREATE" strip and Culture's DISCUSS IN COMMUNITY link point at,
         so without it both would land on the list and leave the visitor to find it again. */
      var want='';
      try{ want=(new URLSearchParams(location.search).get('c')||'').trim(); }catch(e){}
      if(want && S.list.some(function(c){ return c.slug===want; }) && !SES){
        /* Arriving at /connect/?c=<slug> signed out shows the directory with the gate over it,
           so a shared community link still explains itself instead of failing silently. */
        document.body.classList.add('comm-on');
        var seg0=document.getElementById('seg');
        if(seg0){ [].forEach.call(seg0.querySelectorAll('button'),function(b){
          b.classList.toggle('on', b.dataset.k==='community'); }); }
        renderList();
        openGate(want);
        return;
      }
      if(want && S.list.some(function(c){ return c.slug===want; })){
        document.body.classList.add('comm-on');
        var seg=document.getElementById('seg');
        if(seg){ [].forEach.call(seg.querySelectorAll('button'),function(b){
          b.classList.toggle('on', b.dataset.k==='community'); }); }
        openCommunity(want);
        return;
      }
      if(document.body.classList.contains('comm-on')) renderList();
    });
  }
  window.__commActivate=function(){
    if(S.view==='detail') renderDetail(); else renderList();
  };
  boot(0);
})();
</script>
</body>
</html>
