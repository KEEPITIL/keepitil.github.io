*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--panel:rgba(255,255,255,.035);--panel-brd:rgba(255,255,255,.09);--ink:#f4f2fb;--ink2:#9a94b4;--ink3:#6b6588;--artist:var(--purple-2);--brand:#00e0a4;--organizer:#ff8a3d;--venue:var(--brand);--cyan:var(--brand);--fh:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;}
html{scroll-behavior:smooth;}
/* KODE 2026-08-20, Part C #2: the 128pt green band under the footer is body::before — a
   position:fixed backdrop showing through because the page content is shorter than the
   viewport, so nothing paints over the bottom. Footer padding can never fix that.
   /create does NOT have the band, and the reason is this exact rule: it is a flex column at
   min-height:100dvh with footer{margin-top:auto}, so the footer is pushed to the bottom and
   covers the backdrop. Same treatment here. padding-bottom moves to the footer, because on a
   flex column body padding leaves a gap BELOW the footer — the bug fixed on 2026-08-19. */
/* overflow-x:clip, NOT hidden (Atlas 2026-08-21). `overflow-x:hidden` on body computes
   overflow-y:auto, which turns BODY into a scroll container. position:sticky then resolves
   against body instead of the viewport, and because the page actually scrolls on the
   viewport the bar never sticks — the filter bars were correctly declared sticky and simply
   could not work. `clip` clips the same overflow WITHOUT creating a scroll container, so
   sticky resolves against the viewport again. `hidden` is kept first as the fallback for
   anything that predates `clip`. */
body{background:var(--bg,#0a0a0f);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:var(--bg,#0a0a0f) url('/assets/images/scene-hero.jpg') center/cover no-repeat;opacity:1}
html.has-season body::before{display:none!important} /* seasonal image takes over the hero backdrop on its dates */
a{color:inherit;text-decoration:none;}
nav#main-nav{position:sticky;top:0;z-index:200;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);padding:0 24px;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;padding:0 32px;height:66px;}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-logo img{height:44px;width:auto;filter:drop-shadow(0 0 6px var(--brand));mix-blend-mode:screen;}
.nav-brand{font-family:var(--fh);font-size:1.5rem;letter-spacing:.13em;color:#fff;}
.nav-links{display:flex;list-style:none;flex:1;justify-content:space-evenly;margin:0;padding:0;}
.nav-links li{list-style:none;}
.nav-links a{font-family:var(--fh);font-size:1.05rem;letter-spacing:.14em;color:rgba(255,255,255,.75);transition:color .2s;white-space:nowrap;}
.nav-links a:hover,.nav-links a.active{color:#fff;}
.nav-inner>a.nav-cta{font-family:var(--fh);font-size:1rem;letter-spacing:.14em;color:var(--brand)!important;background:transparent!important;border:2px solid var(--brand);padding:7px 22px;border-radius:4px;flex-shrink:0;transition:background .2s,color .2s;white-space:nowrap;}
.nav-inner>a.nav-cta:hover{background:var(--brand)!important;color:#000!important;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;margin-left:14px;}
.nav-hamburger span{display:block;width:24px;height:2px;background:#fff;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:66px;left:0;right:0;background:rgba(10,10,18,.98);z-index:199;flex-direction:column;padding:14px 26px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:var(--fh);font-size:1.3rem;letter-spacing:.12em;color:rgba(255,255,255,.8);padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.mobile-menu a:last-child{border-bottom:none;color:var(--brand)!important;}
@media(max-width:820px){.nav-links{display:none;}.nav-inner>a.nav-cta{display:none;}.nav-hamburger{display:flex;margin-left:auto;}}
/* BACKGROUND FIRST, CONTENT SCROLLS UP (Founder 2026-08-21: "every page except culture
   should start like the homepage. background image first, than everything else can scroll up
   into place"). The homepage does this with .hero{min-height:100dvh} — a full-viewport opening
   panel over the fixed backdrop. Same here. svh first so the iOS URL bar collapsing does not
   change the height mid-scroll; dvh is the fallback for anything without svh. */
/* BOTTOM-WEIGHTED LANDING PANEL (Founder 2026-08-21: "titles and metrics needs to be bigger
   and towards the bottom of the landing page and also match the color theme of that page").
   justify-content:flex-end drops the block to the foot of the full-viewport panel, so the
   artwork owns the top two thirds and the type sits over the darkest part of the scrim where
   it is most legible. */
/*   The 130px is /create's value and is now the standard (Founder 2026-08-21: "create is the
   best example on positioning. it sits above the radio so it is readable on the landing page.
   the filter sits right behind the radio bar"). It is the fixed top nav (70) plus the radio bar
   (60): subtracting both keeps the title and metrics clear of the player instead of sitting
   under it, and lets the filter bar settle behind the bar as you scroll. */
/* LEFT EDGE IS /create's (Founder 2026-08-26: "title row, metric row, measurement space
   from the left of the screen" must match). Every landing panel now shares ONE measure —
   1120px with 16px side padding, which is what /create's .wrap gives .ce-hero. The pages
   had drifted to four different insets: create 1120/16, earn 1120/16, connect and culture
   1360/30, discovery 1180/24. Same-looking titles, four different left edges. */
.hero{position:relative;padding:6px 16px 40px;max-width:1120px;margin:0 auto;overflow:hidden;
  min-height:calc(100svh - 130px);min-height:calc(100dvh - 130px);
  display:flex;flex-direction:column;justify-content:flex-end;}
.hero::before{content:"";position:absolute;top:-160px;left:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,255,.30),transparent 62%);filter:blur(20px);z-index:-1;}
.hero::after{content:"";position:absolute;top:-90px;right:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(0,224,164,.18),transparent 62%);filter:blur(20px);z-index:-1;}
.hero-head{width:max-content;max-width:100%;}
.eyebrow{font-family:var(--fh);font-size:1.1rem;color:var(--cyan);margin-bottom:10px;display:block;text-align:justify;text-align-last:justify;letter-spacing:.42em;}
/* CONNECT is neon green (Founder 2026-08-23) — was white-to-purple. */
.hero h1{font-family:var(--fh);font-size:clamp(3.6rem,13vw,8rem);line-height:.88;letter-spacing:.02em;filter:drop-shadow(0 4px 26px rgba(0,0,0,.7));background:linear-gradient(120deg,#CFFFE4 12%,#39FF9E 48%,#00E0A4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{max-width:640px;color:var(--ink2);margin-top:12px;font-size:1.02rem;}
.stats{display:flex;gap:46px;margin-top:22px;flex-wrap:wrap;}
.stat b{font-family:var(--fh);font-size:clamp(2.4rem,6vw,3.6rem);letter-spacing:.02em;line-height:1;display:block;text-shadow:0 2px 18px rgba(0,0,0,.7);}
.stat span{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#c9c2e0;margin-top:5px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7);}
.stat.artist b{color:var(--artist);}.stat.brand b{color:var(--brand);}.stat.organizer b{color:var(--organizer);}.stat.venue b{color:var(--venue);}
/* MOBILE METRICS — one centred row, matching /create and /earn (Founder 2026-08-22/23).
   ⚠ THIS BLOCK MUST STAY BELOW THE BASE .stats/.stat RULES. A media query adds no specificity,
   so when it sat above them the base `.stats{gap:46px;flex-wrap:wrap}` simply won on source
   order and the stats kept wrapping to two rows on a phone. That is why the earlier fix looked
   like it had not applied. */
@media(max-width:860px){
  /* ── LANDING FILLS THE PHONE EXACTLY (Founder 2026-08-24) ─────────────────────────────
     "the page title and metric always sits on top of the bottom nav bar ... filters need to
     start behind the bottom nav bar only."
     The base rule subtracts 130px — the desktop top nav (70) plus the radio bar (60). NEITHER
     EXISTS ON A PHONE: the shell hides the top nav below 861px and pushes the radio bar off
     screen. So the panel came up 130px short, which lifted the metrics away from the nav and
     dragged the filter deck up into view on first paint. That is the whole bug.
     --kil-vh is the shell's measured usable band (status layer -> nav top); adding
     --kil-safe-top back accounts for the panel starting at y=0, underneath the black layer.
     Result: metrics land exactly on the nav and the deck begins one pixel below the fold. */
  .hero{text-align:center;
    min-height:calc(var(--kil-vh,100dvh) + var(--kil-safe-top,0px));
    padding-bottom:14px;}
  .hero-head{width:auto;margin:0 auto;}
  .hero p{margin-left:auto;margin-right:auto;}
  .stats{display:flex;flex-wrap:nowrap;justify-content:center;gap:min(6vw,26px);margin-top:18px;}
  .stat{flex:0 1 auto;min-width:0;text-align:center;}
  .stat b{font-size:clamp(1.4rem,6.5vw,2rem);}
  .stat span{font-size:.56rem;letter-spacing:.09em;margin-top:4px;}
}
/* FULL-BLEED AND OPAQUE (Founder 2026-08-21): "filling the entire top of the sheet ... no
   background image visible above or behind it when scrolling."
   It was a 1360px centred card at 90% opacity, so the backdrop showed through it AND down both
   sides of it while the page scrolled underneath. The BAR now spans the viewport and is solid;
   the CONTROLS inside it keep the page's 1360px measure so they still line up with the grid.
   The top:-1px/border trick closes the hairline the browser leaves above a sticky element. */
.controls{position:sticky;top:70px;z-index:100;background:#0b0b12;max-width:none;width:100%;
  margin:20px 0 0;padding:12px 0;border-top:1px solid rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 10px 24px rgba(0,0,0,.45);}
.controls-row,.subfilters{max-width:1360px;margin-left:auto;margin-right:auto;padding-left:30px;padding-right:30px;}
.controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--panel-brd);border-radius:12px;padding:4px;flex-wrap:wrap;}
.seg button{font-family:var(--fh);font-size:.98rem;letter-spacing:.09em;color:var(--ink2);background:none;border:0;cursor:pointer;padding:8px 16px;border-radius:9px;transition:all .18s;}
.seg button:hover{color:#fff;}
.seg button[data-k=all].on{background:#fff;color:var(--bg);}
.seg button[data-k=artist].on{background:var(--artist);color:#fff;}
.seg button[data-k=brand].on{background:var(--brand);color:#053a2c;}
.seg button[data-k=organizer].on{background:var(--organizer);color:#3a1e08;}
.seg button[data-k=venue].on{background:var(--venue);color:#052436;}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--panel-brd);border-radius:12px;padding:10px 16px;}
.search input{flex:1;background:none;border:0;color:var(--ink);font-family:var(--fb);font-size:.95rem;outline:none;}
.search input::placeholder{color:var(--ink3);}
.count{font-size:.76rem;color:var(--ink3);white-space:nowrap;}
@media(max-width:768px){#count{display:none!important}}
.subfilters{display:none;gap:8px 8px;align-items:center;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.05);}
.subfilters.show{display:flex;}
.sf-label{font-family:var(--fh);font-size:.82rem;letter-spacing:.14em;color:var(--ink3);margin:0 2px 0 4px;}
.chip{font-size:.76rem;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.05);border:1px solid var(--panel-brd);border-radius:20px;padding:6px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.3);}
.chip.on{background:var(--cyan);color:#04222f;border-color:var(--cyan);}
@media(max-width:768px){
.controls{padding:10px 0;max-width:none;margin-top:0;}
.controls-row,.subfilters{padding-left:14px;padding-right:14px;}
.controls-row{flex-direction:column;align-items:stretch;gap:8px;}
.seg{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:0 0 auto;white-space:nowrap;}
.search{width:100%;min-width:0;}
.count{text-align:right;}
.subfilters.show{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.subfilters::-webkit-scrollbar{display:none;}
.subfilters .chip,.subfilters .sf-label{flex:0 0 auto;}
}
.grid{max-width:1360px;margin:24px auto 60px;padding:0 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
@media(max-width:680px){
.grid{grid-template-columns:repeat(3,minmax(0,1fr));padding:0 10px;gap:5px;margin:16px auto 48px;}
/* Founder-tuned 2026-08-15: 3-up, card 1:1, gap 5, radius 5, name 8px. The IMAGE was already
   1/1 but the card was image + name strip, so the tile itself was taller than square. The card
   now owns the ratio and the image flexes into whatever the name strip leaves. */
/* 2:3 ONLY (Founder 2026-08-20) — matches the homepage, CREATE and profile event cards.
   Was 1/1. */
.card{border-radius:5px;aspect-ratio:2/3;display:flex;flex-direction:column;}
.card .imgw{flex:1 1 auto;aspect-ratio:auto;min-height:0;}
.card .body{flex:0 0 auto;}
.card .nm{font-size:8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .desc{display:none;}
.hero{padding:42px 18px 18px;}
}
/* 2:3 AT EVERY WIDTH (Founder 2026-08-21). It was 2:3 only below 680px; on desktop the card
   was image + name strip, so the tile was taller than 2:3 and did not match the homepage,
   CREATE or the profile event cards. The CARD owns the ratio and the image flexes into
   whatever the name strip leaves. */
.card{position:relative;background:var(--panel);border:1px solid var(--panel-brd);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;
  aspect-ratio:2/3;display:flex;flex-direction:column;}
.card .imgw{flex:1 1 auto;min-height:0;}
.card .body{flex:0 0 auto;}
.card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.2);box-shadow:0 18px 40px rgba(0,0,0,.5);}
.card .imgw{position:relative;aspect-ratio:auto;overflow:hidden;background:var(--surface-2);}
.card .imgw img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.card .imgw .fallback{position:absolute;inset:0;z-index:0;display:flex!important;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800;font-size:2.2rem;letter-spacing:.06em;color:#fff;}
.card:hover .imgw img{transform:scale(1.06);}
.card .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:2.6rem;color:#fff;}
.kinds{position:absolute;top:11px;left:11px;display:flex;gap:4px;flex-wrap:wrap;max-width:80%;}
.kind{font-family:var(--fh);font-size:.7rem;letter-spacing:.13em;padding:4px 10px;border-radius:20px;}
.kind.artist{background:var(--artist);color:#fff;}.kind.brand{background:var(--brand);color:#053a2c;}.kind.organizer{background:var(--organizer);color:#3a1e08;}.kind.venue{background:var(--venue);color:#052436;}
.card .body{padding:13px 14px 15px;}
.card .nm{font-family:var(--fh);font-size:1.32rem;letter-spacing:.02em;line-height:1;margin-bottom:0;}
/* Scene cards: image + name only (Founder 2026-07-20) */
.card .desc,.card .loc,.card .ig,.card .kinds{display:none!important}
.card .body{padding:10px 12px 12px!important}
.card .desc-orig{font-size:.76rem;color:var(--ink2);line-height:1.4;min-height:2.1em;}
.card .loc{font-size:.7rem;color:var(--ink3);margin-top:7px;}
.card .ig{margin-top:8px;font-size:.7rem;color:var(--cyan);}
.empty{grid-column:1/-1;text-align:center;color:var(--ink3);padding:56px 0;}
.empty .big{font-family:var(--fh);font-size:1.7rem;letter-spacing:.06em;color:var(--ink2);}
footer{border-top:1px solid rgba(255,255,255,.06);padding:32px 30px;text-align:center;color:var(--ink3);font-size:.82rem;
  background:var(--bg,#0a0a0f);}
footer a{color:var(--artist);}
/* Founder 2026-08-20: "do not let it hide behind the clock, battery icon" — top:0 puts the
   sticky bar under the iOS status bar in standalone/PWA mode. env(safe-area-inset-top) is the
   height of that band, so the bar parks just below it on a notched phone and at 0 elsewhere. */
/* MOBILE ONLY (Founder 2026-08-21: "i only ask for the mobile change not the desktop").
   Both of these were global on 2026-08-20 and changed the desktop page — the sticky filter bar
   was locking to the top of the viewport on scroll, and the flex-column body altered the
   desktop layout. Desktop is back to static flow; the sticky bar and the green-band footer fix
   live here, below 860px, where they were actually asked for. */
@media(max-width:860px){
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
/* A flex-column body makes every child a flex item, and a flex item defaults to
   min-width:auto — it will not shrink below its own max-content width. Measured at
   375px: .wrap computed to 1120px while body{overflow-x:hidden} clipped the excess,
   hiding the overflow instead of fixing it. Releasing min-width is what lets the
   locked-footer flex body and a nowrap rail coexist. */
body>*{min-width:0}

  footer{margin-top:auto}
    /* EXACTLY the homepage pattern (#evx .evx-nav, index.html): top:0 and GROW into the
     status-bar band. Offsetting to top:env(safe-area-inset-top) leaves a transparent strip
     above the bar that page content scrolls through — the Founder's "you can see scrolling
     above the filter". The bar must own that band, not sit below it. */
  /*     ⚠ z-index 940, BELOW the shell's bottom nav (#kil-bnav is 950). It was 960, which put the
     filter bar IN FRONT of the bottom nav as the page scrolled — every other page passes behind
     it. Anything sticky on a page must stay under 950 or it will cross the nav. */
  /* Founder 2026-08-24: sticks directly under the black status layer, no spacer. The old
     grow-and-pad (top:0 + padding-top:10px + inset) put the bar's top edge behind the clock and
     padded its content clear, which rendered as an empty bar-coloured band above the filters.
     --kil-safe-top is the shell's measured layer height; identical on desktop where it is 0. */
  .controls{top:var(--kil-safe-top,0px);padding-top:10px;z-index:940;}
}

// roster reset 2026-07-21 — rebuild from Google Sheet + web research. Seeded with the 2 gold standards.
/* ARTISTS COME FROM ARTICLES (Founder 2026-08-26: "public view profiles will not be on the
   connected page. just article artist template").
   The seed used to hardcode Groove Trooper with a SoundCloud avatar and a link to
   /profile.html. Both are gone: the roster is now whatever has an artist article, the
   picture is his current profile picture, and the card opens the article. Empty here so
   there is exactly one source of truth — see the blog_articles fetch below. */
const ART=[],BRND=[],ORG=[],VEN=[
  /* BLEU — corrected 2026-08-20. Was hardcoded here with an image from bleuxo.net named
     BleuDailyMeals.jpg: a MEAL-PREP graphic, not the event space, and the wrong city
     (Santa Ana; BLEU is in Westminster). This seed overrode the venues table, which has held
     the correct logo at /venues/bleu-logo.png since 2026-08-18 — the reason the card kept
     showing food no matter how many times the database was fixed.
     Kept as a seed so the card renders before the Supabase fetch returns, but every field now
     matches the venues row. */
  {name:'BLEU',city:'Westminster',county:'Orange County',genre:'Event Space / Live Music',ig:'xoeventspace',img:'/venues/bleu-2x3.jpg?v=20260823',color:'var(--brand)',blog:'/venue.html?v=bleu',keepitil:true,type:'Event Space'}
];
// Each item carries kinds=[...]; multi-category profiles (once claimed) can list several.
let DATA=[].concat(
  ART.map(x=>Object.assign({},x,{kinds:['artist']})),
  BRND.map(x=>Object.assign({},x,{kinds:['brand']})),
  ORG.map(x=>Object.assign({},x,{kinds:['organizer']})),
  VEN.map(x=>Object.assign({},x,{kinds:['venue']}))
);
const KL={artist:'Artist',brand:'Brand',organizer:'Organizer',venue:'Venue'};
const cnt=k=>DATA.filter(x=>x.kinds.includes(k)).length;
cA.textContent=cnt('artist');cB.textContent=cnt('brand');cO.textContent=cnt('organizer');cV.textContent=cnt('venue');
// ---- genre buckets (tightened) ----
const BUCKETS=[['House',['house','tech house','deep house','bass house','latin house','jackin house','soulful house','organic house','disco tech','afro house','afro','disco']],
['Techno',['techno','hard techno','minimal techno','deep techno','dark techno','acid techno','ambient techno','melodic techno','peak-time','hypnotic','industrial','minimal','deep tech','psychedelic industrial techno','acid']],
['Bass',['bass','bass music','dubstep','riddim','tearout','hybrid trap','heavy bass']],
['Drum & Bass',['dnb','drum and bass','jungle','breaks']],
['Trance',['trance','tech trance','progressive']],
['Hard',['hardcore','hardstyle','hard']],
['UKG / Garage',['ukg','uk garage','garage','speed garage','uk bass','bassline','club','bounce','ghetto-tech']],
['Experimental',['experimental','leftfield','electronica','electro','future bass','ambient']]];
function splitv(s){return (s||'').split('/').map(t=>t.trim()).filter(Boolean);}
function bucketOf(g){g=g.toLowerCase();for(const[b,l]of BUCKETS){if(l.includes(g))return b;}return 'Other';}
function artistBuckets(){const items=DATA.filter(x=>x.kinds.includes('artist'));const present=new Set();items.forEach(x=>splitv(x.genre).forEach(g=>present.add(bucketOf(g))));return BUCKETS.map(b=>b[0]).concat(['Other']).filter(b=>present.has(b));}
function typeValues(kind){const items=DATA.filter(x=>x.kinds.includes(kind));return [...new Set(items.flatMap(x=>splitv(x.category||x.type)))].sort();}
let kind='all',q='',sub=null; // sub={facet:'genre'|'type',val}
function initials(n){return (n||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function desc(x){return x.genre||x.category||x.type||'';}
function card(x){
  const d=desc(x);const ig=x.ig?('@'+x.ig):'';
  /* No dead links (Atlas 2026-07-16): internal profile if it exists, else the org's Instagram (new tab), else a non-clickable card. Never href="#". */
  const igurl=x.ig?('https://instagram.com/'+String(x.ig).replace(/^@/,'').trim()):'';
  /* blog already starts with "/"; only add a leading slash if it's missing. A double slash ("//path") is a protocol-relative URL and sends every card to a dead domain. */
  const href=x.blog?(String(x.blog).charAt(0)==='/'?x.blog:'/'+x.blog):(igurl||'');
  const ext=!x.blog && !!igurl;
  const img=x.img?('<img loading="lazy" referrerpolicy="no-referrer" src="'+x.img+'" alt="" onerror="this.style.display=\'none\'"/>'):'';
  const fb='<div class="fallback" style="background:linear-gradient(135deg,'+(x.color||'#6d28d9')+',#111)">'+initials(x.name)+'</div>';
  const chips=x.kinds.map(k=>'<span class="kind '+k+'">'+KL[k]+'</span>').join('');
  const inner='<div class="imgw"><div class="kinds">'+chips+'</div>'+img+fb+'</div>'
    +'<div class="body"><div class="nm">'+(x.name||'')+'</div><div class="desc">'+d+'</div>'
    +(x.city?'<div class="loc">◍ '+x.city+(x.county?' · '+x.county.replace(' County',' Co.'):'')+'</div>':'')
    +(ig?'<div class="ig">'+ig+(ext?' ↗':'')+'</div>':'')+'</div>';
  if(href) return '<a class="card" href="'+href+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+inner+'</a>';
  return '<div class="card nolink" style="cursor:default">'+inner+'</div>';
}
function renderSubs(){
  const box=document.getElementById('subs');
  if(kind==='all'){box.classList.remove('show');box.innerHTML='';return;}
  const parts=[];
  if(kind==='artist'){
    const gb=artistBuckets();
    if(gb.length>1){parts.push('<span class="sf-label">Genre</span>');gb.forEach(v=>parts.push('<button class="chip'+(sub&&sub.facet==='genre'&&sub.val===v?' on':'')+'" data-f="genre" data-v="'+v+'">'+v+'</button>'));}
  } else {
    const tv=typeValues(kind);
    if(tv.length>1){parts.push('<span class="sf-label">Type</span>');tv.forEach(v=>parts.push('<button class="chip'+(sub&&sub.facet==='type'&&sub.val===v?' on':'')+'" data-f="type" data-v="'+v.replace(/"/g,'')+'">'+v+'</button>'));}
  }
  box.innerHTML=parts.join('');box.classList.toggle('show',parts.length>0);
}
function matchSub(x){
  if(!sub)return true;
  if(sub.facet==='genre'){return splitv(x.genre).some(g=>bucketOf(g)===sub.val);}
  return ((x.type||'')+' '+(x.category||'')).toLowerCase().includes(sub.val.toLowerCase());
}
function render(){
  const ql=q.trim().toLowerCase();
  const list=DATA.filter(x=>{
    if(kind!=='all'&&!x.kinds.includes(kind))return false;
    if(!matchSub(x))return false;
    if(ql){const h=((x.name||'')+' '+(x.city||'')+' '+desc(x)).toLowerCase();if(!h.includes(ql))return false;}
    return true;
  });
  /* ARTISTS LEAD (Founder 2026-08-26: "by default all artist profile at the top of the connect
     page"). Applies to the default All view; once a specific category is selected the list is
     already single-kind and this is a no-op. Stable sort — within artists, and within everything
     else, the existing order (articles newest-first, then venues) is preserved. */
  if(kind==='all'){
    list.sort(function(a,b){
      var aa=(a.kinds||[]).indexOf('artist')>-1?0:1;
      var bb=(b.kinds||[]).indexOf('artist')>-1?0:1;
      return aa-bb;
    });
  }
  const g=document.getElementById('grid');
  g.innerHTML=list.length?list.map(card).join(''):'<div class="empty"><div class="big">No matches</div><div>Try another search or filter.</div></div>';
  document.getElementById('count').textContent=list.length+' of '+DATA.length;
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;sub=null;[...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b));renderSubs();render();});
document.getElementById('subs').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const f=c.dataset.f,v=c.dataset.v;sub=(sub&&sub.facet===f&&sub.val===v)?null:{facet:f,val:v};renderSubs();render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
renderSubs();render();
/* ---- LIVE DIRECTORY: pull from Google Sheet master (1UU2). Founder edits sheet -> site reflects on refresh. Falls back to built-in roster if sheet unreachable. ---- */
(function(){
  var SHEET='1UU2rPPwsIRCFnZBgk6Uzb9IRcckcBmvYVORNVMFtIoo';
  var TQ='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?sheet=Untitled&headers=1&tqx=out:json';
  function cell(c,i){return (c&&c[i]&&c[i].v!=null)?String(c[i].v):'';}
  fetch(TQ).then(function(r){return r.text();}).then(function(t){
    var m=t.match(/setResponse\(([\s\S]*?)\);?\s*$/); if(!m) throw 0;
    var j=JSON.parse(m[1]); var rows=(j.table&&j.table.rows)||[]; var live=[];
    rows.forEach(function(row){
      var c=row.c||[]; var kind=cell(c,1).toLowerCase().trim(); var name=cell(c,2).trim();
      var lv=cell(c,9).toLowerCase().trim();
      if(!name||!kind) return;
      if(lv && lv!=='yes' && lv!=='true' && lv!=='1') return;              // live=no hides it
      live.push({_order:parseFloat(cell(c,0))||9999, name:name, city:cell(c,3), county:cell(c,4),
        genre:cell(c,5), ig:cell(c,6), img:cell(c,7), blog:cell(c,8),
        type:(kind==='artist'?'DJ':''), kinds:[kind]});
    });
    if(!live.length) throw 0;
    live.sort(function(a,b){return a._order-b._order;});
    DATA=live;
    cA.textContent=cnt('artist');cB.textContent=cnt('brand');cO.textContent=cnt('organizer');cV.textContent=cnt('venue');
    renderSubs();render();
  }).catch(function(){/* sheet not shared/unreachable -> keep built-in roster */});
})();
/* ---- LIVE DB PROFILES: auto-created venues + claimed profiles from Supabase profile_meta, merged into the Scene grid + counts. This is what makes a venue created via an event show up on the Scene. ---- */
(function(){
  var U='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
  var K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
  function _dedupe(){ var h={}; DATA.forEach(function(x){ h[String(x.blog||'').toLowerCase()]=1; h[String(x.name||'').toLowerCase()]=1; }); return h; }
  function _refresh(){ cA.textContent=cnt('artist');cB.textContent=cnt('brand');cO.textContent=cnt('organizer');cV.textContent=cnt('venue'); renderSubs();render(); }
  // claimed artist/brand/organizer profiles from profile_meta
  fetch(U+'/rest/v1/profile_meta?select=slug,display_name,account_type,location,cover_url,avatar_url&account_type=in.(brand,organizer)&status=eq.published',{headers:{apikey:K,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var have=_dedupe();
      rows.forEach(function(p){
        var blog='/profile.html?slug='+p.slug;
        if(have[blog.toLowerCase()]||have[String(p.display_name||'').toLowerCase()]) return;
        DATA.push({name:p.display_name||p.slug, city:p.location||'', county:'', genre:'', ig:'', img:p.cover_url||p.avatar_url||'', blog:blog, type:(p.account_type==='artist'?'DJ':''), kinds:[p.account_type], keepitil:true});
      });
      _refresh();
    }).catch(function(){});
  /* ARTIST CARDS = ARTIST ARTICLES. One fetch, no join: a featured artist may have no
     profile_meta row at all (RAB3L does not), and joining would have silently dropped them.
     The card opens /article/artist/<slug>, never a public profile. */
  fetch(U+'/rest/v1/blog_articles?select=artist_slug,artist_name,artist_avatar,artist_city,artist_genre,image_url,url,title&artist_slug=not.is.null&status=eq.published&published=is.true&order=published_at.desc',{headers:{apikey:K,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var have=_dedupe();
      rows.forEach(function(a){
        var href = a.url || ('/article/artist/'+a.artist_slug);
        if(have[href.toLowerCase()]) return;
        DATA.push({
          name: a.artist_name || a.title,
          city: a.artist_city || '', county:'',
          genre: a.artist_genre || '',
          ig:'',
          img: a.artist_avatar || a.image_url || '',
          blog: href,
          type:'DJ', kinds:['artist'], keepitil:true
        });
      });
      _refresh();
    }).catch(function(){});

  // venues (incl. auto-created from events) from the venues table -> venue.html
  fetch(U+'/rest/v1/venues?select=slug,name,city,cover_url,logo_url&status=eq.published',{headers:{apikey:K,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var have=_dedupe();
      rows.forEach(function(p){
        var blog='/venue.html?v='+p.slug;
        if(have[blog.toLowerCase()]||have[String(p.name||'').toLowerCase()]) return;
        DATA.push({name:p.name||p.slug, city:p.city||'', county:'', genre:'', ig:'', img:p.cover_url||p.logo_url||'', blog:blog, type:'Venue', kinds:['venue'], keepitil:true});
      });
      _refresh();
    }).catch(function(){});
})();
</script>
