<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log In — KEEPITIL</title>
<meta name="description" content="Log in to your KEEPITIL account — OC & LA underground EDM."/>
<meta property="og:title" content="Log In — KEEPITIL"/>
<meta property="og:url" content="https://keepitil.com/apply.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#0b0b0f;--dark:#111118;--dark2:#18181f;--dark3:#22222c;--blue:#00b4ff;--white:#f0f0f0;--grey:#888;--font-head:'Bebas Neue',sans-serif;--font-body:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;}
a{color:var(--blue);text-decoration:none;}
#main-nav{position:sticky;top:0;z-index:40;background:rgba(11,11,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--dark3);}
.nav-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px;}
.nav-logo{display:flex;align-items:center;gap:8px;}
.nav-logo img{height:40px;width:auto;mix-blend-mode:screen;}
.nav-brand{font-family:var(--font-head);letter-spacing:.08em;font-size:1.3rem;color:var(--white);}
.nav-links{list-style:none;display:flex;gap:18px;margin-left:8px;}
.nav-links a{font-family:var(--font-head);letter-spacing:.06em;color:var(--grey);font-size:1rem;}
.nav-links a:hover{color:var(--white);}
.nav-cta{margin-left:auto;font-family:var(--font-head);letter-spacing:.06em;background:var(--blue);color:#06121a;padding:8px 18px;border-radius:8px;font-size:1rem;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 18px;}
.login-card{width:100%;max-width:380px;background:var(--dark);border:1px solid var(--dark3);border-radius:16px;padding:38px 30px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{font-family:var(--font-head);letter-spacing:.14em;font-size:2.5rem;color:var(--white);margin-bottom:4px;}
.login-sub{color:var(--grey);font-size:.85rem;margin-bottom:26px;}
.login-card input{width:100%;background:var(--dark2);border:1px solid var(--dark3);border-radius:9px;color:var(--white);font-size:.95rem;padding:13px 14px;margin-bottom:11px;outline:none;}
.login-card input:focus{border-color:var(--blue);}
.btn-login{width:100%;background:var(--blue);color:#06121a;border:none;border-radius:9px;font-family:var(--font-head);letter-spacing:.08em;font-size:1.2rem;padding:13px;cursor:pointer;margin-top:5px;transition:opacity .2s;}
.btn-login:disabled{opacity:.6;cursor:default;}
.login-err{color:#ff5c5c;font-size:.82rem;margin:11px 0 0;min-height:1em;line-height:1.4;}
.forgot{display:inline-block;margin-top:16px;font-size:.82rem;}
.divider{display:flex;align-items:center;gap:12px;color:var(--grey);font-size:.72rem;letter-spacing:.1em;margin:22px 0 18px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--dark3);}
.signup-row{font-size:.86rem;color:var(--grey);}
#reset-box{display:none;}
footer{text-align:center;padding:22px;border-top:1px solid var(--dark3);color:var(--grey);font-size:.75rem;}
footer a{margin:0 5px;}
@media(max-width:600px){.nav-links{display:none;}}
</style>
</head>
<body>
<nav id="main-nav"><div class="nav-inner">
  <a class="nav-logo" href="/"><img src="/keepitil-x-blue.png" alt="KEEPITIL"/><span class="nav-brand">KEEPITIL</span></a>
  <ul class="nav-links"><li><a href="/culture">CULTURE</a></li><li><a href="/scene.html">SCENE</a></li></ul>
  <a href="/apply.html" class="nav-cta">LOGIN</a>
</div></nav>

<main>
  <div class="login-card">
    <div id="signin-box">
      <div class="login-logo">KEEPITIL</div>
      <div class="login-sub">Log in to your account</div>
      <input type="email" id="email" placeholder="Email" autocomplete="email"/>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password"/>
      <button class="btn-login" id="login-btn">LOG IN</button>
      <div class="login-err" id="err"></div>
      <a href="#" class="forgot" id="forgot-link">Forgot password?</a>
      <div class="divider">OR</div>
      <div class="signup-row">Don't have an account? <a href="/signup.html">Sign up</a></div>
    </div>
    <div id="reset-box">
      <div class="login-logo">KEEPITIL</div>
      <div class="login-sub">Reset your password</div>
      <input type="email" id="reset-email" placeholder="Your email" autocomplete="email"/>
      <button class="btn-login" id="reset-btn">SEND RESET LINK</button>
      <div class="login-err" id="reset-msg" style="color:var(--blue)"></div>
      <a href="#" class="forgot" id="back-link">&larr; Back to log in</a>
    </div>
  </div>
</main>

<footer>
  <a href="/">KEEPITIL</a> — OC &amp; LA Underground EDM · <a href="/privacy.html">Privacy</a> · <a href="/scene.html">Scene</a> · <a href="/culture">Culture</a>
</footer>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}
if(supa){
  supa.auth.getSession().then(function(r){ if(r&&r.data&&r.data.session) location.replace('/portal.html'); }).catch(function(){});
  supa.auth.onAuthStateChange(function(e,s){ if(s) location.replace('/portal.html'); });
}
function signIn(){
  if(!supa){ $('err').textContent='Sign-in is loading — try again in a moment.'; return; }
  var email=($('email').value||'').trim(), pw=$('password').value||'';
  $('err').textContent='';
  if(!email){ $('err').textContent='Enter your email.'; return; }
  if(!pw){ $('err').textContent='Enter your password.'; return; }
  var b=$('login-btn'); b.disabled=true; b.textContent='LOGGING IN…';
  supa.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    if(r&&r.error){
      var m=r.error.message||'';
      if(/email not confirmed|not confirmed/i.test(m)) $('err').textContent='Your email isn’t confirmed yet — check your inbox (and spam), or use Forgot password.';
      else if(m==='Invalid login credentials') $('err').textContent='Wrong email or password. Try “Forgot password?”.';
      else $('err').textContent=m;
      b.disabled=false; b.textContent='LOG IN';
    } else { location.replace('/portal.html'); }
  }).catch(function(){ $('err').textContent='Could not log in — try again.'; b.disabled=false; b.textContent='LOG IN'; });
}
$('login-btn').addEventListener('click',signIn);
$('password').addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
$('email').addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
$('forgot-link').addEventListener('click',function(e){ e.preventDefault(); $('signin-box').style.display='none'; $('reset-box').style.display='block'; });
$('back-link').addEventListener('click',function(e){ e.preventDefault(); $('reset-box').style.display='none'; $('signin-box').style.display='block'; });
$('reset-btn').addEventListener('click',function(){
  if(!supa) return;
  var email=($('reset-email').value||'').trim(), msg=$('reset-msg');
  if(!email){ msg.style.color='#ff5c5c'; msg.textContent='Enter your email.'; return; }
  supa.auth.resetPasswordForEmail(email,{redirectTo:'https://keepitil.com/portal.html'}).then(function(r){
    if(r&&r.error){ msg.style.color='#ff5c5c'; msg.textContent=r.error.message; }
    else { msg.style.color='var(--blue)'; msg.textContent='Check your email (and spam) for the reset link.'; }
  }).catch(function(){ msg.style.color='#ff5c5c'; msg.textContent='Could not send — try again.'; });
});
</script>
</body>
</html>
