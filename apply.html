<style>
:root{--black:#0b0b0f;--dark:#111118;--dark2:#18181f;--dark3:#22222c;--blue:var(--brand);--white:var(--text);--grey:#888;--font-head:'Bebas Neue',sans-serif;--font-body:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;padding-bottom:72px;}
/* A flex-column body makes every child a flex item, and a flex item defaults to
   min-width:auto — it will not shrink below its own max-content width. Measured at
   375px: .wrap computed to 1120px while body{overflow-x:hidden} clipped the excess,
   hiding the overflow instead of fixing it. Releasing min-width is what lets the
   locked-footer flex body and a nowrap rail coexist. */
body>*{min-width:0}

a{color:var(--blue);text-decoration:none;}
nav#main-nav{position:sticky;top:0;z-index:200;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);padding:0 24px;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;padding:0 32px;height:66px;}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-logo img{height:44px;width:auto;filter:drop-shadow(0 0 6px var(--brand));mix-blend-mode:screen;}
.nav-brand{font-family:var(--font-head);font-size:1.5rem;letter-spacing:.13em;color:#fff;}
.nav-links{display:flex;list-style:none;flex:1;justify-content:space-evenly;margin:0;padding:0;}
.nav-links li{list-style:none;}
.nav-links a{font-family:var(--font-head);font-size:1.05rem;letter-spacing:.14em;color:rgba(255,255,255,.75);transition:color .2s;}
.nav-links a:hover{color:#fff;}
.nav-inner>a.nav-cta{font-family:var(--font-head);font-size:1rem;letter-spacing:.14em;color:var(--brand)!important;border:2px solid var(--brand);padding:7px 22px;border-radius:4px;flex-shrink:0;transition:.2s;}
.nav-inner>a.nav-cta:hover{background:var(--brand)!important;color:#000!important;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;margin-left:auto;}
.nav-hamburger span{display:block;width:24px;height:2px;background:#fff;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:66px;left:0;right:0;background:rgba(10,10,18,.98);z-index:199;flex-direction:column;padding:14px 26px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:var(--font-head);font-size:1.3rem;letter-spacing:.12em;color:rgba(255,255,255,.8);padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.mobile-menu a:last-child{border-bottom:none;color:var(--brand)!important;}
@media(max-width:820px){.nav-links{display:none;}.nav-inner>a.nav-cta{display:none;}.nav-hamburger{display:flex;}}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 18px;}
.login-card{width:100%;max-width:380px;background:var(--dark);border:1px solid var(--dark3);border-radius:16px;padding:38px 30px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{font-family:var(--font-head);letter-spacing:.14em;font-size:2.5rem;color:var(--white);margin-bottom:4px;}
.login-sub{color:var(--grey);font-size:.85rem;margin-bottom:26px;}
.login-card input{width:100%;background:var(--dark2);border:1px solid var(--dark3);border-radius:9px;color:var(--white);font-size:.95rem;padding:13px 14px;margin-bottom:11px;outline:none;}
.login-card input:focus{border-color:var(--blue);}
.btn-login{width:100%;background:var(--blue);color:#06121a;border:none;border-radius:9px;font-family:var(--font-head);letter-spacing:.08em;font-size:1.2rem;padding:13px;cursor:pointer;margin-top:5px;transition:opacity .2s;}
.btn-login:disabled{opacity:.6;cursor:default;}
.login-err{color:#ff5c5c;font-size:.82rem;margin:11px 0 0;min-height:1em;line-height:1.4;}
.forgot{display:inline-block;margin-top:16px;font-size:.82rem;}
.portal-note{display:none;margin-top:14px;font-size:.82rem;color:var(--grey);}
.divider{display:flex;align-items:center;gap:12px;color:var(--grey);font-size:.72rem;letter-spacing:.1em;margin:22px 0 18px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--dark3);}
.signup-row{font-size:.86rem;color:var(--grey);}
#reset-box{display:none;}
footer{text-align:center;padding:22px;border-top:1px solid var(--dark3);color:var(--grey);font-size:.75rem;}
footer a{margin:0 5px;}
@media(max-width:600px){.nav-links{display:none;}}
/* ---- New-user plan picker (Join merged into Login) ---- */
.scrollcue{display:block;margin-top:18px;font-size:.82rem;color:var(--grey);}
.scrollcue a{font-weight:700;}
.plans{max-width:1000px;margin:0 auto;padding:20px 18px 60px;}
.plans-head{text-align:center;margin:10px 0 26px;}
.plans-head .eyebrow{display:inline-block;font-family:var(--font-head);letter-spacing:.16em;color:var(--blue);font-size:.9rem;border:1px solid var(--dark3);border-radius:999px;padding:5px 15px;margin-bottom:12px;}
.plans-head h2{font-family:var(--font-head);letter-spacing:.06em;font-size:2.4rem;line-height:1;}
.plans-head p{color:var(--grey);font-size:.95rem;margin-top:8px;}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
/* ≤720 mobile: body is a column flexbox, so .plans sizes to its grid's intrinsic (min-content)
   width — the 1fr track resolves against content (~750px) and the whole section blows past the
   viewport. Explicit width:100% + minmax(0,1fr) kills intrinsic sizing; verified 375/390px. */
@media(max-width:720px){.plans{width:100%;max-width:100%;box-sizing:border-box}.plan-grid{grid-template-columns:minmax(0,1fr);max-width:440px;margin:0 auto;width:100%}.plan-card{max-width:100%;min-width:0}}
.plan-card{background:var(--dark);border:1px solid var(--dark3);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;}
.plan-card.pro{border-color:color-mix(in srgb,var(--blue) 50%,var(--dark3));box-shadow:0 0 46px color-mix(in srgb,var(--blue) 12%,transparent);}
.plan-badge{align-self:flex-start;font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:4px 11px;border-radius:20px;margin-bottom:14px;}
.plan-badge.free{background:color-mix(in srgb,var(--grey) 22%,transparent);color:#cfcfd6;}
.plan-badge.pro{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue);}
.plan-name{font-family:var(--font-head);letter-spacing:.04em;font-size:2rem;}
.plan-price{margin:2px 0 4px;color:var(--grey);font-size:.95rem;}
.plan-price strong{font-size:2rem;color:var(--white);font-family:var(--font-head);}
.plan-mission{color:var(--grey);font-size:.9rem;margin-bottom:16px;}
.plan-card ul{list-style:none;margin:6px 0 20px;padding:0;}
.plan-card li{padding:7px 0;font-size:.9rem;display:flex;gap:9px;align-items:flex-start;color:#e7e7ee;}
.plan-card li::before{content:"✓";color:var(--blue);font-weight:800;}
.plan-card li.no{opacity:.5;}
.plan-card li.no::before{content:"–";color:var(--grey);}
.plan-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;font-family:var(--font-head);letter-spacing:.06em;font-size:1.1rem;padding:13px 20px;border-radius:10px;text-decoration:none;transition:transform .15s,opacity .2s;}
.plan-cta.primary{background:var(--blue);color:#04121b;}
.plan-cta.primary:hover{transform:translateY(-2px);}
.plan-cta.ghost{border:2px solid var(--dark3);color:var(--white);}
.plan-cta.ghost:hover{border-color:var(--blue);color:var(--blue);}
.plan-fine{color:var(--grey);font-size:.75rem;text-align:center;margin-top:10px;}
.perks{margin-top:40px;}
.perks h3{text-align:center;font-family:var(--font-head);letter-spacing:.08em;font-size:1.5rem;margin-bottom:6px;}
.perks .sub{text-align:center;color:var(--grey);font-size:.88rem;margin-bottom:22px;}
.perk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:860px){.perk-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.perk-grid{grid-template-columns:1fr;}}
.perk{background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:18px 16px;text-align:center;}
.perk .ic{font-size:1.6rem;}
.perk .t{font-weight:700;margin:8px 0 4px;font-size:.95rem;}
.perk .d{color:var(--grey);font-size:.8rem;line-height:1.45;}
.rewards-note{max-width:760px;margin:30px auto 0;background:color-mix(in srgb,var(--blue) 7%,var(--dark2));border:1px dashed color-mix(in srgb,var(--blue) 40%,var(--dark3));border-radius:14px;padding:16px 20px;text-align:center;font-size:.86rem;color:var(--grey);}
.rewards-note b{color:var(--white);}
.plans-legal{text-align:center;margin-top:26px;font-size:.82rem;}
.plans-legal a{margin:0 7px;}
/* mobile plan fit (Founder 2026-07-16): plans must fit the viewport, no horizontal overflow */
@media(max-width:480px){body{overflow-x:hidden}.plan-grid{max-width:100%;gap:14px}.plan-card{padding:20px 14px;min-width:0}.plan-card ul{margin:6px 0 14px}}
</style>
</head>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
function $(id){return document.getElementById(id);}

/* If already signed in, go STRAIGHT to the profile (you stay logged in on this device —
   no re-login needed). Use ?stay=1 to remain on the login page (e.g. to switch accounts). */
if(supa){
  supa.auth.getSession().then(function(r){
    if(r&&r.data&&r.data.session){
      if(new URLSearchParams(location.search).get('stay')==='1'){ var p=$('portal-note'); if(p) p.style.display='inline-block'; }
      else { location.replace('/profile.html'); }
    }
  }).catch(function(){});
}

/* Accept a username OR an email. Emails (contain "@") are used directly; a username is resolved to its email. */
function resolveEmail(id){
  if(id.indexOf('@')>-1) return Promise.resolve(id);
  var handle=id.replace(/^@/,'');
  if(!supa||!supa.from) return Promise.resolve(null);
  // Try a security-definer RPC first (works even if app_users.email is RLS-protected), then a
  // case-insensitive direct lookup as fallback. Either resolves the handle to its login email.
  return supa.rpc('email_for_handle',{h:handle}).then(function(rp){
    if(rp&&!rp.error&&rp.data) return rp.data;
    return supa.from('app_users').select('email').ilike('handle',handle).maybeSingle()
      .then(function(r){ return (r&&r.data&&r.data.email)?r.data.email:null; });
  }).catch(function(){
    return supa.from('app_users').select('email').ilike('handle',handle).maybeSingle()
      .then(function(r){ return (r&&r.data&&r.data.email)?r.data.email:null; })
      .catch(function(){ return null; });
  });
}

function signIn(){
  if(!supa){ $('err').textContent='Sign-in is loading — try again in a moment.'; return; }
  var id=($('login-id').value||'').trim(), pw=$('password').value||'';
  $('err').textContent='';
  if(!id){ $('err').textContent='Enter your username or email.'; return; }
  if(!pw){ $('err').textContent='Enter your password.'; return; }
  var b=$('login-btn'); b.disabled=true; b.textContent='LOGGING IN…';
  resolveEmail(id).then(function(email){
    if(!email){ $('err').textContent='Couldn’t find that username. Try logging in with your email.'; b.disabled=false; b.textContent='LOG IN'; return; }
    return supa.auth.signInWithPassword({email:email,password:pw}).then(function(r){
      if(r&&r.error){
        var m=r.error.message||'';
        if(/email not confirmed|not confirmed/i.test(m)) $('err').textContent='Your email isn’t confirmed yet — check your inbox (and spam), or use Forgot password.';
        else if(m==='Invalid login credentials') $('err').textContent='Wrong username/email or password. Try “Forgot password?”.';
        else $('err').textContent=m;
        b.disabled=false; b.textContent='LOG IN';
      } else { location.replace('/profile.html'); }
    });
  }).catch(function(){ $('err').textContent='Could not log in — try again.'; b.disabled=false; b.textContent='LOG IN'; });
}

$('login-btn').addEventListener('click',signIn);
/* Social sign-in (Google / Apple). Works once the provider is enabled in Supabase Auth.
   Until then it shows a friendly message instead of a raw error. */
function oauth(provider){
  if(!supa){ var e=$('err'); if(e){e.textContent='Sign-in is unavailable right now.';} return; }
  try{
    supa.auth.signInWithOAuth({ provider:provider, options:{ redirectTo: location.origin+'/profile.html' } })
      .then(function(r){ if(r&&r.error){ var e=$('err'); if(e){ e.textContent=(provider.charAt(0).toUpperCase()+provider.slice(1))+' sign-in failed: '+r.error.message; } } })
      .catch(function(){ var e=$('err'); if(e){e.textContent='Could not start sign-in. Try email + password.';} });
  }catch(e2){ var e=$('err'); if(e){e.textContent='Could not start sign-in.';} }
}
(function(){ var g=$('btn-google'); if(g)g.addEventListener('click',function(){oauth('google');});
  var a=$('btn-apple'); if(a)a.addEventListener('click',function(){oauth('apple');}); })();
$('password').addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
$('login-id').addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
$('forgot-link').addEventListener('click',function(e){ e.preventDefault(); $('signin-box').style.display='none'; $('reset-box').style.display='block'; });
$('back-link').addEventListener('click',function(e){ e.preventDefault(); $('reset-box').style.display='none'; $('signin-box').style.display='block'; });
$('reset-btn').addEventListener('click',function(){
  if(!supa) return;
  var email=($('reset-email').value||'').trim(), msg=$('reset-msg');
  if(!email){ msg.style.color='#ff5c5c'; msg.textContent='Enter your email.'; return; }
  supa.auth.resetPasswordForEmail(email,{redirectTo:'https://keepitil.com/portal.html'}).then(function(r){
    if(r&&r.error){ msg.style.color='#ff5c5c'; msg.textContent=r.error.message; }
    else { msg.style.color='var(--blue)'; msg.textContent='Check your email (and spam) for the reset link.'; }
  }).catch(function(){ msg.style.color='#ff5c5c'; msg.textContent='Could not send — try again.'; });
});
</script>
