<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEEPITIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#050505;min-height:100vh;}
nav{position:sticky;top:0;z-index:100;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);padding:0 24px;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;height:60px;}
.nav-logo{flex-shrink:0;text-decoration:none;display:flex;align-items:center;}
.nav-brand{color:#fff;font-family:"Bebas Neue",sans-serif;font-size:1.15rem;letter-spacing:.14em;margin-left:10px;}
.nav-links{display:flex;flex:1;justify-content:space-evenly;align-items:center;list-style:none;padding:0;}
.nav-links a{color:#888;text-decoration:none;font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:color .2s;}
.nav-links a:hover{color:#00b4ff;}
.nav-cta{background:#00b4ff!important;color:#fff!important;padding:7px 20px;border-radius:4px;}
.nav-cta:hover{opacity:.85;}
@media(max-width:768px){.nav-links{display:none;}}
.home-stage{display:flex;align-items:center;justify-content:center;height:calc(100vh - 60px);}
.mark{width:min(52vw,52vh);height:min(52vw,52vh);object-fit:contain;display:block;}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <img src="/logo-blue-nav.png" alt="KEEPITIL" style="height:30px;width:auto;filter:drop-shadow(0 0 6px #00b4ff);"><span class="nav-brand">KEEPITIL</span>
    </a>
    <ul class="nav-links">
      <li><a href="/spotlight">SPOTLIGHT</a></li>
      <li><a href="/artist">ARTIST</a></li>
      <li><a href="/brand">BRAND</a></li>
      <li><a href="/organizer">ORGANIZER</a></li>
      <li><a href="/events">EVENTS</a></li>
      <li><a href="/culture">CULTURE</a></li>
      <li><a href="/apply.html" class="nav-cta">APPLY</a></li>
    </ul>
  </div>
</nav>
<div class="home-stage">
  <img class="mark" src="/keepitil_logo_optimized.png" alt="KEEPITIL">
</div>
</body>
</html>
