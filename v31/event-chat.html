<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<link rel="stylesheet" href="/v3/v3-tokens.css"/>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event Chat — KEEPITIL</title>
<meta name="description" content="Live event chat room for KEEPITIL — talk with others going to the show."/>
<link rel="icon" type="image/png" href="https://keepitil.com/logo-blue-nav.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--black:#0f0f1a;--green:var(--live);--blue:var(--brand);--white:var(--text);--grey:#889;--head:'Bebas Neue',sans-serif;--body:'Inter',sans-serif;}
  html,body{height:100%;}
  body{background:#0a0a12;color:var(--white);font-family:var(--body);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  /* Dedicated scroll region so the chat always scrolls on every device (iOS-safe) */
  #scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;}
  a{color:var(--blue);text-decoration:none;}
  header{flex:0 0 auto;position:relative;z-index:20;background:rgba(9,9,16,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,180,255,.15);}
  .hd{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;}
  .hd .brand{font-family:var(--head);letter-spacing:.16em;font-size:1.15rem;color:#fff;}
  .hd .back{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8aa;}
  .ev-hd{max-width:820px;margin:0 auto;width:100%;padding:22px 18px 10px;}
  .ev-eyebrow{font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--green);}
  .ev-title{font-family:var(--head);font-size:clamp(1.7rem,5vw,2.6rem);letter-spacing:.03em;line-height:1.02;margin-top:6px;}
  .ev-sub{color:var(--grey);font-size:.82rem;margin-top:8px;}
  .scene-note{max-width:820px;margin:8px auto 0;width:100%;padding:0 18px;}
  .scene-note div{background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.2);border-radius:10px;padding:10px 14px;font-size:.76rem;color:#9fb;}
  main{max-width:820px;margin:0 auto;width:100%;padding:16px 18px 24px;}
  .msg{display:flex;gap:9px;padding:5px 0;align-items:flex-end;}
  .msg.me{flex-direction:row-reverse;}
  .msg .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#b400ff);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#06120a;}
  .msg .col{display:flex;flex-direction:column;max-width:76%;}
  .msg.me .col{align-items:flex-end;}
  .msg .who{font-weight:700;font-size:.72rem;color:#9ab;margin:0 0 3px 10px;}
  .msg .bubble{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:18px 18px 18px 5px;padding:9px 13px;}
  .msg.me .bubble{background:linear-gradient(135deg,var(--blue),var(--purple));border:none;border-radius:18px 18px 5px 18px;}
  .msg .btext{font-size:.9rem;line-height:1.45;color:#eef;white-space:pre-wrap;word-break:break-word;}
  .msg.me .btext{color:#fff;}
  .msg .when{font-size:.62rem;color:#566;margin:3px 8px 0;}
  .msg img.shared{max-width:230px;border-radius:12px;margin-top:6px;display:block;}
  .msg .react{margin-top:7px;display:flex;gap:6px;}
  .react button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#9ab;border-radius:20px;font-size:.72rem;padding:3px 9px;cursor:pointer;transition:all .15s;}
  .react button:hover,.react button.on{border-color:var(--green);color:var(--green);}
  .empty{text-align:center;color:#566;padding:50px 20px;font-size:.9rem;}
  .composer{flex:0 0 auto;z-index:20;background:rgba(9,9,16,.98);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);}
  .composer .cwrap{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:flex-end;}
  .composer textarea{flex:1;resize:none;height:46px;min-height:46px;max-height:120px;padding:12px 14px;border-radius:11px;background:transparent;border:1.5px solid var(--green);color:#fff;font-family:var(--body);font-size:.9rem;}
  .composer .imgbtn{width:46px;height:46px;border-radius:11px;background:transparent;border:1.5px solid var(--green);color:var(--green);font-size:1.7rem;line-height:1;font-weight:400;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .composer .send{padding:0 18px;height:46px;border-radius:11px;background:var(--green);color:#06120a;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;border:none;cursor:pointer;flex-shrink:0;}
  .gate{flex:0 0 auto;max-width:820px;margin:0 auto;width:100%;padding:14px 18px;text-align:center;}
  .gate .card{background:linear-gradient(160deg,#12121e,#0a0a12);border:1px solid rgba(0,255,136,.25);border-radius:14px;padding:20px;}
  .gate h4{font-family:var(--head);font-size:1.3rem;letter-spacing:.03em;margin-bottom:6px;}
  .gate p{color:var(--grey);font-size:.82rem;margin-bottom:12px;}
  .gate input{width:100%;max-width:320px;padding:11px 13px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#fff;margin-bottom:10px;}
  .gate button{padding:11px 20px;border-radius:9px;background:var(--green);color:#06120a;font-weight:800;text-transform:uppercase;font-size:.76rem;letter-spacing:.06em;border:none;cursor:pointer;}
  .gate .msg2{min-height:16px;font-size:.74rem;color:var(--green);margin-top:8px;}
  .gate button.linky{display:block;margin:8px auto 0;background:none;color:#3cf;text-transform:none;letter-spacing:0;font-weight:600;font-size:.76rem;text-decoration:underline;padding:0;}
  .gate .mini{font-size:.74rem;color:var(--grey);margin-top:10px;}
  .gate .mini a{color:#3cf;}
  /* Embed mode: used inside tickets.html — hide all chrome so only the room shows */
  body.embed{padding-top:0!important;}
  body.embed header#main-nav, body.embed #v3shell-nav, body.embed #v3-footer, body.embed footer, body.embed .ev-hd{display:none!important;}
  body.embed #scroller{padding-top:8px;}
</style>
</head>
<body>
<header id="main-nav"><div class="hd" style="display:flex;align-items:center;gap:12px;padding:12px 16px">
  <a class="back" href="/v31/" style="margin-left:0;flex:0 0 auto">← Event</a>
  <div id="ev-title" style="flex:1 1 auto;min-width:0;text-align:center;font-family:var(--head,'Bebas Neue',sans-serif);font-weight:800;font-size:1.5rem;letter-spacing:.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Event</div>
  <span id="ev-date-h" style="flex:0 0 auto;font-size:.8rem;font-weight:700;letter-spacing:.03em;color:#9fb;text-align:right;white-space:nowrap"></span>
  <span id="ev-host" style="display:none"></span>
</div></header>

<div id="scroller">
<div class="scene-note" style="display:none"><div id="conn"></div></div>

<main id="thread"><div class="empty">No messages yet. Be the first to start the conversation.</div></main>
</div><!-- /#scroller -->

<div class="composer" id="composer" style="display:none;">
  <div class="cwrap">
    <button class="imgbtn" id="imgbtn" title="Share a photo">+</button>
    <input type="file" id="imgfile" accept="image/*" hidden/>
    <textarea id="ta" placeholder="Say something to the room…"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</div>

<div class="gate" id="gate">
  <div class="card">
    <h4>Join the room</h4>
    <p>You can read the scene room freely. Log in to post, share photos and plan meetups.</p>
    <input type="email" id="gemail" placeholder="you@email.com" autocomplete="email"/>
    <input type="password" id="gpass" placeholder="Password" autocomplete="current-password"/>
    <button id="glogin">Log in</button>
    <button id="gsend" class="linky">Email me a magic link instead</button>
    <div class="msg2" id="gmsg"></div>
    <p class="mini">New here? <a href="/v31/apply.html">Create your free account</a>.</p>
  </div>
</div>

<script>
(function(){
  var URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
  var p=new URLSearchParams(location.search);
  var slug=p.get('e')||'general'; var title=p.get('t')||'Event Chat';
  if(p.get('embed')==='1'){ document.body.classList.add('embed'); }
  /* profile chat section + embedded contexts: the parent provides navigation, so drop the "← Event / Event" header */
  (function(){ var _hs=document.createElement('style'); _hs.textContent='body.embed .hd,body.mode-chat .hd{display:none!important}'; document.head.appendChild(_hs); })();
  /* mode=chat (opened from a profile) = a PLAIN chat, not an event scene room:
     hide the "← Events" nav, the "Scene Room" label, the event eyebrow/sub + scene-note. */
  if(p.get('mode')==='chat'){
    document.body.classList.add('mode-chat');
    var _st=document.createElement('style');
    _st.textContent='.mode-chat #ev-date-h,.mode-chat #ev-host{display:none!important}';
    document.head.appendChild(_st);
  }
  document.getElementById('ev-title').textContent=title;
  document.title=title+' — Event Chat · KEEPITIL';
  var sb=null; try{ if(window.supabase) sb=window.supabase.createClient(URL,KEY); }catch(e){}
  /* Header bar: event date (left of center) + host (top-right), fetched by slug. */
  (function(){ try{ if(!sb||slug==='general'||p.get('mode')==='chat') return;
    sb.from('events').select('starts_at,owner_handle,title').eq('slug',slug).maybeSingle().then(function(r){
      var d=r&&r.data; if(!d) return;
      if(d.title){ document.getElementById('ev-title').textContent=d.title; document.title=d.title+' — Event Chat · KEEPITIL'; }
      if(d.starts_at){ try{ var dt=new Date(d.starts_at); if(!isNaN(dt)){ document.getElementById('ev-date-h').textContent=dt.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'}); } }catch(e){} }
      if(d.owner_handle){ document.getElementById('ev-host').textContent='@'+String(d.owner_handle).replace(/^@/,''); }
    }).catch(function(){});
  }catch(e){} })();
  var session=null;
  var _firstRender=true;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function initials(n){n=(n||'raver').trim();return (n[0]||'R').toUpperCase();}
  function when(t){try{var d=new Date(t);return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
  function render(rows){
    var t=$('thread');
    if(!rows||!rows.length){ t.innerHTML='<div class="empty">No messages yet. Be the first to start the conversation.</div>'; return; }
    var myId=(typeof session!=='undefined'&&session&&session.user)?session.user.id:null;
    t.innerHTML=rows.map(function(m){
      var mine=(myId&&m.user_id===myId);
      var img=m.image_url?'<img class="shared" src="'+esc(m.image_url)+'" alt="shared photo" loading="lazy"/>':'';
      var body=m.body?'<div class="btext">'+esc(m.body)+'</div>':'';
      var av=mine?'':'<div class="av">'+initials(m.handle)+'</div>';
      var who=mine?'':'<span class="who">'+esc(m.handle||'raver')+'</span>';
      return '<div class="msg'+(mine?' me':'')+'">'+av+'<div class="col">'+who+'<div class="bubble">'+body+img+'</div><span class="when">'+when(m.created_at)+'</span></div></div>';
    }).join('');
    // Auto-scroll to newest ONLY on first load or when already near the bottom,
    // so incoming messages don't yank the user away while they scroll back.
    var sc=document.getElementById('scroller');
    if(sc){ var near=(sc.scrollHeight - sc.scrollTop - sc.clientHeight) < 140; if(_firstRender||near){ sc.scrollTop=sc.scrollHeight; } }
    _firstRender=false;
  }
  function load(){
    if(!sb){ $('conn').textContent='Chat backend is being set up — check back soon.'; return; }
    sb.from('event_messages').select('*').eq('event_slug',slug).order('created_at',{ascending:true}).then(function(r){
      if(r&&r.error){ $('conn').textContent='This scene room goes live once the community backend is enabled.'; return; }
      render(r&&r.data);
    }).catch(function(){ $('conn').textContent='This scene room goes live once the community backend is enabled.'; });
  }
  function subscribe(){
    if(!sb||!sb.channel) return;
    try{ sb.channel('room-'+slug).on('postgres_changes',{event:'INSERT',schema:'public',table:'event_messages',filter:'event_slug=eq.'+slug},function(){ load(); }).subscribe(); }catch(e){}
  }
  function setAuthUI(){
    if(session){ $('gate').style.display='none'; $('composer').style.display='block'; }
    else { $('gate').style.display='block'; $('composer').style.display='none'; }
  }
  var myHandle=null;
  function loadHandle(){ if(!sb||!session) return; sb.from('app_users').select('handle').eq('id',session.user.id).maybeSingle().then(function(r){ if(r&&r.data&&r.data.handle) myHandle=r.data.handle; }).catch(function(){}); }
  function handle(){ if(myHandle) return myHandle; return session && session.user ? (session.user.email||'raver').split('@')[0] : 'raver'; }
  function post(body,imageUrl){
    if(!session||!sb) return;
    sb.from('event_messages').insert({event_slug:slug,user_id:session.user.id,handle:handle(),body:body||null,image_url:imageUrl||null}).then(function(r){ if(!(r&&r.error)) load(); }).catch(function(){});
  }
  var send=$('send');
  if(send) send.onclick=function(){ var v=$('ta').value.trim(); if(!v) return; $('ta').value=''; post(v,null); };
  var imgbtn=$('imgbtn'); if(imgbtn) imgbtn.onclick=function(){ $('imgfile').click(); };
  var imgfile=$('imgfile');
  if(imgfile) imgfile.onchange=function(){
    var f=this.files&&this.files[0]; if(!f||!sb||!session) return;
    var path=slug+'/'+Date.now()+'-'+f.name.replace(/[^a-z0-9.\-]+/gi,'_');
    sb.storage.from('chat-images').upload(path,f).then(function(r){
      if(r&&r.error){ alert('Photo upload needs the chat-images storage bucket.'); return; }
      var pub=sb.storage.from('chat-images').getPublicUrl(path);
      post(null,(pub&&pub.data)?pub.data.publicUrl:null);
    }).catch(function(){});
  };
  var glogin=$('glogin');
  if(glogin) glogin.onclick=function(){
    var email=$('gemail').value||''; var pass=($('gpass')||{}).value||''; var m=$('gmsg');
    if(!email||!pass){ m.textContent='Enter your email and password.'; return; }
    if(!sb){ m.textContent='Sign-in is being set up — check back soon.'; return; }
    m.textContent='Logging in…';
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){ m.textContent=(r&&r.error)?(r.error.message||'Could not log in.'):''; }).catch(function(){ m.textContent='Could not log in.'; });
  };
  var gsend=$('gsend');
  if(gsend) gsend.onclick=function(){
    var email=$('gemail').value||''; var m=$('gmsg');
    if(!email){ m.textContent='Enter your email above first.'; return; }
    if(!sb){ m.textContent='Sign-in is being set up — check back soon.'; return; }
    m.textContent='Sending…';
    sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href}}).then(function(r){ m.textContent=(r&&r.error)?'Could not send link.':'Check your email for your magic link!'; }).catch(function(){ m.textContent='Could not send link.'; });
  };
  /* Ticket gate: an EVENT room (not a plain profile chat, not the general lobby) is fully hidden
     unless the viewer has a paid ticket for that event. mode=chat / embed / general are exempt. */
  var isEventRoom=(p.get('mode')!=='chat' && p.get('embed')!=='1' && slug && slug!=='general');
  function ticketWall(){
    document.body.innerHTML='<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;font-family:var(--body),sans-serif">'
      +'<div style="font-size:2.4rem;margin-bottom:12px">🎟️</div>'
      +'<h2 style="margin:0 0 8px;font-size:1.3rem">Ticket holders only</h2>'
      +'<p style="color:#9ab;max-width:330px;line-height:1.5;margin:0 0 22px">This event chat unlocks when you buy a ticket. Grab yours to join the room.</p>'
      +'<a href="/v31/event.html?e='+encodeURIComponent(slug)+'" style="background:#00e08a;color:#06120a;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:13px 26px;border-radius:11px;text-decoration:none">Get a ticket</a>'
      +'<a href="/v31/event.html?e='+encodeURIComponent(slug)+'" style="color:#6cf;margin-top:16px;font-size:.82rem;text-decoration:none">← Back to event</a>'
      +'</div>';
  }
  function gateThenStart(){
    sb.rpc('has_event_ticket',{p_slug:slug}).then(function(r){
      if(r&&r.data===true){ load(); subscribe(); } else { ticketWall(); }
    }).catch(function(){ ticketWall(); });
  }
  /* 3rd-party (external) events are listings only — no scene room / chat. */
  function externalWall(){
    document.body.innerHTML='<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;font-family:var(--body),sans-serif">'
      +'<div style="font-size:2.4rem;margin-bottom:12px">🔗</div>'
      +'<h2 style="margin:0 0 8px;font-size:1.3rem">No event chat for this show</h2>'
      +'<p style="color:#9ab;max-width:340px;line-height:1.5;margin:0 0 22px">This is a third-party listing — tickets and details live on the promoter\'s page. Scene rooms are only for events hosted on KEEPITIL.</p>'
      +'<a href="/v31/event.html?e='+encodeURIComponent(slug)+'" style="background:#00e08a;color:#06120a;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:13px 26px;border-radius:11px;text-decoration:none">View event</a>'
      +'</div>';
  }
  function startRoom(){
    var started=false;
    function haveSession(s){ session=s; setAuthUI(); loadHandle(); if(!started){ started=true; if(isEventRoom){ gateThenStart(); } else { load(); subscribe(); } } }
    function giveUp(){ if(started) return; setAuthUI(); if(isEventRoom){ ticketWall(); } else { load(); subscribe(); } }
    /* if we're embedded (profile chat / ticket page) and can't find a session, ask the PARENT window for it */
    function tryParent(cb){
      if(window.parent===window){ cb(); return; }
      var done=false;
      function onMsg(e){ var d=e&&e.data; if(d&&d.kilSession&&d.kilSession.access_token){ done=true; window.removeEventListener('message',onMsg);
        sb.auth.setSession({access_token:d.kilSession.access_token,refresh_token:d.kilSession.refresh_token}).then(function(r){ var s=r&&r.data?r.data.session:null; if(s){ haveSession(s); } else cb(); }).catch(cb); } }
      window.addEventListener('message',onMsg);
      try{ window.parent.postMessage({kilNeedSession:1},'*'); }catch(e){}
      setTimeout(function(){ if(!done){ window.removeEventListener('message',onMsg); cb(); } },1500);
    }
    /* a signed-in user (incl. Google/Apple) may have their session restore slightly late — catch it live */
    sb.auth.onAuthStateChange(function(_e,s){ if(s) haveSession(s); });
    var tries=0;
    (function recheck(){
      if(started) return;
      sb.auth.getSession().then(function(r){ var s=(r&&r.data)?r.data.session:null;
        if(s){ haveSession(s); }
        else if(tries++<3){ setTimeout(recheck,600); }
        else { tryParent(giveUp); }
      }).catch(function(){ if(tries++<3){ setTimeout(recheck,600); } else { tryParent(giveUp); } });
    })();
  }
  if(sb){
    if(isEventRoom){
      sb.from('events').select('source_url').eq('slug',slug).maybeSingle().then(function(r){
        var ext=r&&r.data&&r.data.source_url&&String(r.data.source_url).trim()!=='';
        if(ext){ externalWall(); } else { startRoom(); }
      }).catch(function(){ startRoom(); });
    } else { startRoom(); }
  } else { setAuthUI(); $('conn').textContent='Chat backend is being set up — check back soon.'; }
})();
</script>
<!-- Chromeless embedded chat widget (Founder 2026-07-16): NO shell/nav/footer/radio — they
     injected stray flex children into the chat iframe and broke the composer-at-bottom layout. -->
</body>
</html>
