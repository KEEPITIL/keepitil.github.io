<!DOCTYPE html>
<!-- V3.1 MY TICKETS — the signed-in user's purchased tickets (Founder 2026-07-17).
     Auth-required: signed-out visitors are redirected to /v31/apply.html.
     Data: get_my_tickets() RPC (auth-scoped, same as V3's tickets wallet).
     Each card opens the existing /v3/tickets.html?e=<slug> QR/wallet view (detail
     pages intentionally live in /v3/ per the V3.1 scope — only top-level nav is trimmed). -->
<html lang="en" data-theme="default">
<head>
<link rel="stylesheet" href="/v3/v3-tokens.css?v=20260718"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/v3/logo-blue-nav.png"/>
<title>My Tickets — KEEPITIL</title>
<meta name="description" content="Your purchased KEEPITIL event tickets — OC & LA EDM."/>
<link rel="canonical" href="https://keepitil.com/v31/my-tickets.html"/>
<meta name="robots" content="noindex,nofollow"/><!-- personal, auth-only page -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://ovmqtzjfpzrbzrlkxwgw.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#0b0b0f;--dark:#111118;--dark2:#18181f;--dark3:#22222c;--grey:#888;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text,#f0f0f0);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:90px}
.wrap{max-width:1100px;margin:0 auto;padding:34px 18px 60px}
.eyebrow{display:inline-block;font-family:'Bebas Neue',sans-serif;letter-spacing:.16em;color:var(--brand,#00b4ff);font-size:.9rem;border:1px solid var(--dark3);border-radius:999px;padding:5px 15px;margin-bottom:10px}
h1{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-size:2.6rem;line-height:1;margin-bottom:6px}
.sub{color:var(--grey);font-size:.95rem;margin-bottom:26px}
.tixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tix{display:flex;gap:14px;background:var(--dark);border:1px solid var(--dark3);border-radius:16px;padding:14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.tix:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand,#00b4ff) 55%,var(--dark3))}
.tix .cov{flex:0 0 86px;width:86px;height:112px;border-radius:10px;overflow:hidden;background:var(--dark2)}
.tix .cov img{width:100%;height:100%;object-fit:cover;display:block}
.tix .cov .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#3a3a48}
.tix .info{flex:1;min-width:0;display:flex;flex-direction:column}
.tix .ti{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;font-size:1.35rem;line-height:1.1;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tix .dt{color:var(--brand,#00b4ff);font-weight:700;font-size:.82rem;margin-bottom:2px}
.tix .vn{color:var(--grey);font-size:.8rem;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tix .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.72rem}
.chip{background:var(--dark2);border:1px solid var(--dark3);border-radius:999px;padding:3px 10px;color:#cfd3df;font-weight:700}
.chip.ok{color:#22e39b;border-color:color-mix(in srgb,#22e39b 40%,var(--dark3))}
.chip.used{color:var(--grey)}
.qrhint{margin-left:auto;color:var(--brand,#00b4ff);font-weight:800;font-size:.74rem;letter-spacing:.04em}
.state{max-width:520px;margin:60px auto;text-align:center;background:var(--dark);border:1px solid var(--dark3);border-radius:18px;padding:38px 26px}
.state h2{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em;font-size:1.8rem;margin-bottom:8px}
.state p{color:var(--grey);font-size:.92rem;line-height:1.6;margin-bottom:18px}
.state a.cta{display:inline-block;background:var(--brand,#00b4ff);color:#04121b;font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;font-size:1.15rem;padding:11px 26px;border-radius:10px;text-decoration:none}
.loading{color:var(--grey);text-align:center;padding:70px 0}
@media(max-width:600px){.tixgrid{grid-template-columns:1fr}.wrap{padding-top:22px}h1{font-size:2.1rem}}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">EVENTS</span>
  <h1>MY TICKETS</h1>
  <div class="sub">Every ticket you've purchased — tap one for its QR / entry pass.</div>
  <div class="loading" id="loading">Loading your tickets…</div>
  <div class="tixgrid" id="grid" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB=supabase.createClient('https://ovmqtzjfpzrbzrlkxwgw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* self-contained venue-TZ date (deferred-shell race rule: never depend on KIL being ready) */
function fmtDate(iso){
  try{
    if(!iso) return 'Date TBD';
    var d=new Date(iso); if(isNaN(d)) return '';
    var f=function(o){ o.timeZone='America/Los_Angeles'; return new Intl.DateTimeFormat('en-US',o).format(d); };
    return f({weekday:'short'})+', '+f({month:'short',day:'numeric',year:'numeric'})+' · '+f({hour:'numeric',minute:'2-digit'});
  }catch(e){ return String(iso).slice(0,10); }
}
function empty(){
  document.getElementById('loading').style.display='none';
  var e=document.createElement('div'); e.className='state';
  e.innerHTML='<h2>NO TICKETS YET</h2><p>When you buy a ticket to an event, it lands here with its QR entry pass.</p><a class="cta" href="/v31/scene.html">EXPLORE THE SCENE &rarr;</a>';
  document.querySelector('.wrap').appendChild(e);
}
function render(rows){
  document.getElementById('loading').style.display='none';
  if(!rows.length){ empty(); return; }
  var g=document.getElementById('grid'); g.style.display='grid';
  g.innerHTML=rows.map(function(t){
    var used=!!t.checked_in_at;
    var st=used?'<span class="chip used">CHECKED IN</span>':(t.status==='paid'||t.status==='confirmed'||t.status==='comp'?'<span class="chip ok">VALID</span>':'<span class="chip">'+esc((t.status||'').toUpperCase())+'</span>');
    return '<a class="tix" href="/v3/tickets.html?e='+encodeURIComponent(t.slug||'')+'">'
      +'<div class="cov">'+(t.cover_url?'<img src="'+esc(t.cover_url)+'" alt="" loading="lazy">':'<div class="noimg">🎟</div>')+'</div>'
      +'<div class="info">'
        +'<div class="ti">'+esc(t.title||'Event')+'</div>'
        +'<div class="dt">'+esc(fmtDate(t.starts_at))+'</div>'
        +'<div class="vn">'+esc([t.venue,t.city].filter(Boolean).join(' · '))+'</div>'
        +'<div class="meta">'
          +'<span class="chip">'+esc(t.tier_name||'GA')+'</span>'
          +'<span class="chip">×'+(t.qty||1)+'</span>'
          +st
          +'<span class="qrhint">QR &rarr;</span>'
        +'</div>'
      +'</div>'
    +'</a>';
  }).join('');
}
SB.auth.getSession().then(function(r){
  var s=r&&r.data&&r.data.session;
  if(!s){ location.replace('/v31/apply.html'); return; }
  SB.rpc('get_my_tickets').then(function(o){
    if(o&&o.error){ document.getElementById('loading').textContent='Could not load tickets — please refresh.'; return; }
    var rows=(o&&o.data)||[];
    rows.sort(function(a,b){ return new Date(b.starts_at||0)-new Date(a.starts_at||0); });
    render(rows);
  });
});
</script>
<script src="/v3/keepitil-radio.js?v=20260718" defer></script>
<script src="/v3/keepitil-ai.js?v=20260731" defer></script>
<script src="/v31/v31-shell.js?v=20260731" defer></script>
</body>
</html>
