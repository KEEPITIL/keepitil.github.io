/* Blog cards expand the article's TEXT inline (no navigating away, no images) — lazy-fetched on first open. */
function culBlogExpand(cap, slug, ev){
  if(ev){ if(ev.target && ev.target.closest && ev.target.closest('a')) return; }
  if(!cap) return;
  var fx=cap.querySelector('.fx');
  var opening=!cap.classList.contains('open');
  cap.classList.toggle('open');
  if(opening && fx && !fx.getAttribute('data-loaded')){
    fx.setAttribute('data-loaded','1');
    fx.innerHTML='<p style="opacity:.55">Loading…</p>';
    fetch('/blog-'+slug+'.html').then(function(r){return r.text();}).then(function(html){
      var doc=new DOMParser().parseFromString(html,'text/html');
      var art=doc.querySelector('article');
      if(!art){ fx.innerHTML='<p><a href="/blog-'+slug+'.html">Open full article →</a></p>'; return; }
      art.querySelectorAll('img,video,iframe,picture,figure,svg,script,style,button').forEach(function(n){n.remove();});
      fx.innerHTML=art.innerHTML;
    }).catch(function(){ fx.innerHTML='<p><a href="/blog-'+slug+'.html">Open full article →</a></p>'; });
  }
}
